<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Lively Navi - 配達ナビゲーション＆運行管理</title>
  
  <!-- PWA設定 -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="logo.png">

  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      color: #f8fafc;
      text-align: center;
      padding: 20px;
    }
    .portal-card {
      background: rgba(30, 41, 59, 0.9);
      border: 1px solid #334155;
      backdrop-filter: blur(12px);
      border-radius: 18px;
      padding: 32px 20px;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 12px 32px rgba(0,0,0,0.5);
    }
    .logo-img {
      max-width: 240px;
      width: 100%;
      height: auto;
      background: #ffffff;
      padding: 8px 16px;
      border-radius: 12px;
      margin-bottom: 16px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.2);
    }
    p {
      margin: 0 0 24px;
      font-size: 13px;
      color: #cbd5e1;
      line-height: 1.5;
    }
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .portal-btn {
      padding: 15px 20px;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: all 0.2s;
    }
    .btn-driver {
      background: #1d4ed8;
      color: #fff;
      box-shadow: 0 4px 12px rgba(29, 78, 216, 0.35);
    }
    .btn-driver:active {
      background: #1e40af;
      transform: scale(0.98);
    }
    .btn-admin {
      background: #334155;
      color: #f8fafc;
      border: 1px solid #475569;
    }
    .btn-admin:active {
      background: #475569;
    }
    .pwa-hint {
      margin-top: 20px;
      font-size: 11px;
      color: #64748b;
      line-height: 1.4;
    }
  </style>
</head>
<body>

  <div class="portal-card">
    <img src="logo.png" alt="Lively Navi" class="logo-img">
    <p>ルート配送ドライバー向けナビゲーション＆運行管理システム</p>

    <div class="btn-group">
      <a href="driver.html" class="portal-btn btn-driver">
        📱 スマホドライバーアプリを開く
      </a>
      <a href="admin.html" class="portal-btn btn-admin">
        🖥️ PC管理画面を開く
      </a>
    </div>

    <div class="pwa-hint">
      ※スマホのブラウザメニューから「ホーム画面に追加」すると全画面アプリとしてご利用いただけます。
    </div>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(err => console.log('SW failed:', err));
    }
  </script>
</body>
</html>
