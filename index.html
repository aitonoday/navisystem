<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Lively Navi - 次世代ルート配送ナビゲーション</title>
  
  <!-- PWA設定 -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#090d16">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="logo.png">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-family: 'Plus Jakarta Sans', 'Noto Sans JP', -apple-system, sans-serif;
      background: radial-gradient(circle at 50% 10%, #1e1b4b 0%, #090d16 60%, #030712 100%);
      color: #f8fafc;
      text-align: center;
      padding: 20px;
      overflow-x: hidden;
      position: relative;
    }

    /* 背景の環境光エフェクト */
    .ambient-glow {
      position: absolute;
      width: 320px;
      height: 320px;
      background: radial-gradient(circle, rgba(56, 189, 248, 0.15) 0%, rgba(220, 38, 38, 0.08) 60%, transparent 100%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      filter: blur(40px);
      z-index: 0;
    }

    .portal-card {
      position: relative;
      z-index: 1;
      background: rgba(15, 23, 42, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 24px;
      padding: 40px 28px;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.05);
      animation: cardEnter 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes cardEnter {
      from { opacity: 0; transform: translateY(20px) scale(0.96); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .logo-container {
      display: inline-block;
      background: #ffffff;
      padding: 10px 22px;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
      margin-bottom: 24px;
      transition: transform 0.3s ease;
    }
    .logo-container:hover {
      transform: translateY(-2px);
    }
    .logo-img {
      max-width: 220px;
      width: 100%;
      height: auto;
      display: block;
    }

    .app-tagline {
      font-size: 14px;
      color: #94a3b8;
      line-height: 1.6;
      margin: 0 0 32px;
      font-weight: 500;
    }

    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .portal-btn {
      padding: 16px 20px;
      border-radius: 14px;
      font-size: 15px;
      font-weight: 700;
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
      overflow: hidden;
    }

    .btn-driver {
      background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
      color: #ffffff;
      box-shadow: 0 6px 20px rgba(37, 99, 235, 0.4), inset 0 1px 1px rgba(255, 255, 255, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.15);
    }
    .btn-driver:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 28px rgba(37, 99, 235, 0.5), inset 0 1px 1px rgba(255, 255, 255, 0.3);
    }
    .btn-driver:active {
      transform: scale(0.98);
    }

    .btn-admin {
      background: rgba(30, 41, 59, 0.8);
      color: #f1f5f9;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.25);
    }
    .btn-admin:hover {
      background: rgba(51, 65, 85, 0.9);
      border-color: rgba(255, 255, 255, 0.2);
      transform: translateY(-2px);
    }
    .btn-admin:active {
      transform: scale(0.98);
    }

    .badge-cloud {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.3);
      border-radius: 20px;
      font-size: 11px;
      color: #34d399;
      font-weight: 600;
      margin-bottom: 20px;
    }
    .badge-cloud-dot {
      width: 6px;
      height: 6px;
      background: #10b981;
      border-radius: 50%;
      box-shadow: 0 0 8px #10b981;
      animation: pulseDot 2s infinite;
    }
    @keyframes pulseDot {
      0% { opacity: 0.4; }
      50% { opacity: 1; }
      100% { opacity: 0.4; }
    }

    .pwa-hint {
      margin-top: 24px;
      font-size: 11px;
      color: #64748b;
      line-height: 1.5;
    }
  </style>
</head>
<body>

  <div class="ambient-glow"></div>

  <div class="portal-card">
    <div class="logo-container">
      <img src="logo.png" alt="Lively Navi" class="logo-img">
    </div>

    <div>
      <span class="badge-cloud">
        <span class="badge-cloud-dot"></span> Firebase クラウドリアルタイム同期中
      </span>
    </div>

    <p class="app-tagline">
      ルート配送に特化した次世代ナビゲーション＆<br>リアルタイム運行マネジメント
    </p>

    <div class="btn-group">
      <a href="driver.html" class="portal-btn btn-driver">
        <span style="font-size:18px;">📱</span> スマホドライバーアプリを開く
      </a>
      <a href="admin.html" class="portal-btn btn-admin">
        <span style="font-size:18px;">🖥️</span> PC管理画面（コース作成・監視）を開く
      </a>
    </div>

    <div class="pwa-hint">
      ※スマートフォンでご利用の際は、ブラウザメニューから「ホーム画面に追加」を行うと全画面ネイティブアプリとして快適にご利用いただけます。
    </div>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(err => console.log('SW failed:', err));
    }
  </script>
</body>
</html>
