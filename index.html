<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>LIVELY NAVI - Move Lively, Arrive Happy.</title>
  
  <!-- PWA設定 -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#f0fdfa">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="apple-touch-icon" href="logo.png">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-family: 'Plus Jakarta Sans', 'Noto Sans JP', -apple-system, sans-serif;
      background: linear-gradient(135deg, #f0fdfa 0%, #e0f2fe 50%, #f8fafc 100%);
      color: #0f172a;
      text-align: center;
      padding: 24px 16px;
      overflow-x: hidden;
      position: relative;
    }

    /* 背景のソフトな環境光 */
    .ambient-circle-1 {
      position: absolute;
      width: 450px;
      height: 450px;
      background: radial-gradient(circle, rgba(20, 184, 166, 0.15) 0%, transparent 70%);
      top: -100px;
      left: -100px;
      border-radius: 50%;
      pointer-events: none;
      filter: blur(40px);
    }
    .ambient-circle-2 {
      position: absolute;
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, rgba(56, 189, 248, 0.18) 0%, transparent 70%);
      bottom: -80px;
      right: -80px;
      border-radius: 50%;
      pointer-events: none;
      filter: blur(40px);
    }

    .portal-card {
      position: relative;
      z-index: 1;
      background: rgba(255, 255, 255, 0.88);
      border: 1px solid rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-radius: 28px;
      padding: 44px 32px;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 20px 50px rgba(15, 23, 42, 0.08), 0 1px 3px rgba(15, 23, 42, 0.04);
      animation: cardEnter 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes cardEnter {
      from { opacity: 0; transform: translateY(24px) scale(0.96); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .brand-header {
      margin-bottom: 24px;
    }
    .logo-container {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: #ffffff;
      padding: 10px 24px;
      border-radius: 18px;
      box-shadow: 0 8px 24px rgba(13, 148, 136, 0.12);
      margin-bottom: 12px;
    }
    .logo-img {
      max-width: 200px;
      width: 100%;
      height: auto;
      display: block;
    }

    .brand-slogan {
      font-size: 13px;
      font-weight: 700;
      color: #0d9488;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    .brand-catchcopy {
      font-size: 22px;
      font-weight: 900;
      color: #0f172a;
      letter-spacing: -0.5px;
      margin: 0 0 12px;
    }
    .brand-desc {
      font-size: 13px;
      color: #64748b;
      line-height: 1.6;
      margin: 0 0 28px;
    }

    /* 特徴グリッド */
    .features-list {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 32px;
      text-align: left;
    }
    .feature-item {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 14px;
      padding: 10px 12px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .feature-icon {
      width: 32px;
      height: 32px;
      border-radius: 10px;
      background: #e0f2fe;
      color: #0284c7;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      flex-shrink: 0;
    }
    .feature-text b {
      display: block;
      font-size: 12px;
      color: #0f172a;
    }
    .feature-text span {
      font-size: 10px;
      color: #64748b;
    }

    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .portal-btn {
      padding: 16px 20px;
      border-radius: 16px;
      font-size: 15px;
      font-weight: 800;
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .btn-driver {
      background: linear-gradient(135deg, #0d9488 0%, #059669 100%);
      color: #ffffff;
      box-shadow: 0 8px 24px rgba(13, 148, 136, 0.35);
    }
    .btn-driver:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 30px rgba(13, 148, 136, 0.45);
    }
    .btn-driver:active { transform: scale(0.98); }

    .btn-admin {
      background: #ffffff;
      color: #0f172a;
      border: 1.5px solid #e2e8f0;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.04);
    }
    .btn-admin:hover {
      background: #f8fafc;
      border-color: #cbd5e1;
      transform: translateY(-2px);
    }
    .btn-admin:active { transform: scale(0.98); }

    .badge-cloud {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      background: rgba(13, 148, 136, 0.1);
      border: 1px solid rgba(13, 148, 136, 0.25);
      border-radius: 20px;
      font-size: 11px;
      color: #0d9488;
      font-weight: 700;
      margin-bottom: 20px;
    }
    .badge-cloud-dot {
      width: 6px;
      height: 6px;
      background: #0d9488;
      border-radius: 50%;
      box-shadow: 0 0 6px #0d9488;
      animation: pulseDot 2s infinite;
    }
    @keyframes pulseDot {
      0% { opacity: 0.4; }
      50% { opacity: 1; }
      100% { opacity: 0.4; }
    }
  </style>
</head>
<body>

  <div class="ambient-circle-1"></div>
  <div class="ambient-circle-2"></div>

  <div class="portal-card">
    <div class="brand-header">
      <div class="logo-container">
        <img src="logo.svg" alt="LIVELY NAVI" class="logo-img">
      </div>
      <div class="brand-slogan">Move Lively, Arrive Happy.</div>
      <h1 class="brand-catchcopy">毎日の移動を、もっと心地よく。</h1>
      <p class="brand-desc">リアルタイム運行情報とスマートなルート案内で、<br>配送業務を軽やかにサポートします。</p>
    </div>

    <div>
      <span class="badge-cloud">
        <span class="badge-cloud-dot"></span> Firebase クラウドリアルタイム同期中
      </span>
    </div>

    <div class="features-list">
      <div class="feature-item">
        <div class="feature-icon">🚀</div>
        <div class="feature-text">
          <b>Smart & Accurate</b>
          <span>最適ルートナビ</span>
        </div>
      </div>
      <div class="feature-item">
        <div class="feature-icon" style="background:#fef2f2; color:#ef4444;">📍</div>
        <div class="feature-text">
          <b>Safe & Reliable</b>
          <span>GPS近接自動判定</span>
        </div>
      </div>
      <div class="feature-item">
        <div class="feature-icon" style="background:#f0fdf4; color:#16a34a;">☁️</div>
        <div class="feature-text">
          <b>Live Cloud Sync</b>
          <span>リアルタイム運行監視</span>
        </div>
      </div>
      <div class="feature-item">
        <div class="feature-icon" style="background:#fdf4ff; color:#a855f7;">🗺️</div>
        <div class="feature-text">
          <b>Google Maps Link</b>
          <span>安全なシームレス連携</span>
        </div>
      </div>
    </div>

    <div class="btn-group">
      <a href="driver.html" class="portal-btn btn-driver">
        <span style="font-size:18px;">📱</span> スマホドライバーアプリを開く
      </a>
      <a href="admin.html" class="portal-btn btn-admin">
        <span style="font-size:18px;">🖥️</span> PC管理画面（コース作成・監視）を開く
      </a>
    </div>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js?v=7').catch(err => console.log('SW failed:', err));
    }
  </script>
</body>
</html>
