<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NaviSystem - 配達コース管理システム (PC管理画面)</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: #0f172a;
      color: #f1f5f9;
    }
    #header {
      background: #1e293b;
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #334155;
    }
    .header-logo {
      font-size: 18px;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 10px;
      color: #38bdf8;
    }
    .nav-links {
      display: flex;
      gap: 12px;
      align-items: center;
    }
    .btn {
      padding: 8px 16px;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      font-size: 13px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
      text-decoration: none;
    }
    .btn-blue { background: #2563eb; color: #fff; }
    .btn-blue:hover { background: #1d4ed8; }
    .btn-green { background: #16a34a; color: #fff; }
    .btn-green:hover { background: #15803d; }
    .btn-amber { background: #d97706; color: #fff; }
    .btn-amber:hover { background: #b45309; }
    .btn-purple { background: #9333ea; color: #fff; }
    .btn-purple:hover { background: #7e22ce; }
    .btn-slate { background: #334155; color: #f8fafc; }
    .btn-slate:hover { background: #475569; }
    .btn-red { background: #dc2626; color: #fff; }
    .btn-red:hover { background: #b91c1c; }

    #container {
      display: flex;
      flex: 1;
      overflow: hidden;
      position: relative;
    }

    /* 左パネル：コース管理 & CSV取込 */
    #left-panel {
      width: 420px;
      background: #1e293b;
      border-right: 1px solid #334155;
      display: flex;
      flex-direction: column;
      z-index: 10;
    }
    .panel-tabs {
      display: flex;
      border-bottom: 1px solid #334155;
      background: #0f172a;
    }
    .tab-btn {
      flex: 1;
      padding: 12px;
      text-align: center;
      background: transparent;
      border: none;
      color: #94a3b8;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: all 0.2s;
    }
    .tab-btn.active {
      color: #38bdf8;
      border-bottom-color: #38bdf8;
      background: #1e293b;
    }

    .tab-content {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: none;
    }
    .tab-content.active {
      display: flex;
      flex-direction: column;
    }

    /* ドロップエリア */
    .drop-zone {
      border: 2px dashed #475569;
      border-radius: 8px;
      padding: 24px;
      text-align: center;
      background: #0f172a;
      cursor: pointer;
      transition: all 0.2s;
      margin-bottom: 16px;
    }
    .drop-zone:hover, .drop-zone.dragover {
      border-color: #38bdf8;
      background: #1e293b;
    }

    .form-group {
      margin-bottom: 14px;
    }
    .form-group label {
      display: block;
      font-size: 12px;
      color: #94a3b8;
      margin-bottom: 6px;
      font-weight: 600;
    }
    .form-group input, .form-group select {
      width: 100%;
      padding: 8px 12px;
      border-radius: 6px;
      border: 1px solid #475569;
      background: #0f172a;
      color: #f8fafc;
      font-size: 13px;
    }

    /* コースカード */
    .course-card {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 14px;
      margin-bottom: 12px;
      transition: all 0.2s;
      cursor: pointer;
    }
    .course-card:hover {
      border-color: #38bdf8;
    }
    .course-card.selected {
      border-color: #38bdf8;
      background: #172554;
    }
    .course-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }
    .course-title {
      font-weight: bold;
      font-size: 14px;
      color: #f8fafc;
    }
    .course-meta {
      font-size: 12px;
      color: #94a3b8;
      display: flex;
      gap: 12px;
    }
    .progress-bar-bg {
      background: #334155;
      height: 6px;
      border-radius: 3px;
      margin-top: 8px;
      overflow: hidden;
    }
    .progress-bar-fill {
      background: #16a34a;
      height: 100%;
      width: 0%;
      transition: width 0.3s;
    }

    /* 配達リスト */
    .delivery-item {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 8px 12px;
      margin-bottom: 6px;
      font-size: 12px;
    }

    /* ルートツールバー（地図上フローティング） */
    #route-planner-bar {
      position: absolute;
      top: 16px;
      left: 436px;
      right: 16px;
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid #334155;
      backdrop-filter: blur(8px);
      border-radius: 12px;
      padding: 10px 16px;
      z-index: 1000;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
      flex-wrap: wrap;
    }
    .mode-switch-btn {
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: bold;
      border: 1px solid #475569;
      background: #1e293b;
      color: #94a3b8;
      cursor: pointer;
      transition: all 0.2s;
    }
    .mode-switch-btn.active {
      background: #2563eb;
      color: #fff;
      border-color: #2563eb;
    }

    .route-select-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      flex: 1;
      min-width: 180px;
    }
    .route-select-item select {
      flex: 1;
      padding: 6px 8px;
      background: #1e293b;
      border: 1px solid #475569;
      color: #f8fafc;
      border-radius: 6px;
      font-size: 12px;
    }

    #routeInfoPill {
      display: none;
      align-items: center;
      gap: 10px;
      background: #1e293b;
      padding: 4px 12px;
      border-radius: 20px;
      border: 1px solid #38bdf8;
      font-size: 12px;
      color: #38bdf8;
      font-weight: bold;
    }

    /* 手動描画ガイドバー */
    #draw-guide-bar {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.95);
      border: 2px solid #a855f7;
      color: #fff;
      padding: 10px 20px;
      border-radius: 30px;
      z-index: 1000;
      display: none;
      align-items: center;
      gap: 14px;
      font-size: 13px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }

    /* 右パネル：マップ */
    #map {
      flex: 1;
      height: 100%;
      background: #0b0f19;
    }
    .drawing-mode-cursor {
      cursor: crosshair !important;
    }
  </style>
</head>
<body>

  <div id="header">
    <div class="header-logo" style="display:flex; align-items:center; gap:8px;">
      <img src="logo.png" alt="Lively Navi" style="height: 32px; background: #fff; padding: 2px 8px; border-radius: 6px;">
      <span style="font-size: 12px; font-weight: normal; color: #94a3b8;">PC管理画面</span>
    </div>
    <div class="nav-links">
      <a href="driver.html" target="_blank" class="btn btn-blue">
        📱 スマホドライバー画面を開く ↗
      </a>
      <button id="btnExportAll" class="btn btn-slate" onclick="exportDataBackup()">💾 データ出力</button>
    </div>
  </div>

  <div id="container">
    <!-- ルートツールバー -->
    <div id="route-planner-bar">
      <!-- モード切り替え -->
      <div style="display:flex; gap:6px; background:#0f172a; padding:3px; border-radius:8px; border:1px solid #334155;">
        <button id="modeAutoBtn" class="mode-switch-btn active" onclick="switchRouteMode('auto')">
          🚩 A➔B 自動探索
        </button>
        <button id="modeManualBtn" class="mode-switch-btn" onclick="switchRouteMode('manual')">
          ✏️ 地図クリック手動描画
        </button>
      </div>

      <!-- A➔B 自動探索コントロール -->
      <div id="autoControls" style="display:flex; align-items:center; gap:10px; flex:1; flex-wrap:wrap;">
        <div class="route-select-item">
          <span>🚩 <b>A (出発)</b>:</span>
          <select id="routeFromSelect"><option value="">-- ピンまたはリストから選択 --</option></select>
        </div>
        <div class="route-select-item">
          <span>🏁 <b>B (到着)</b>:</span>
          <select id="routeToSelect"><option value="">-- ピンまたはリストから選択 --</option></select>
        </div>
        <button class="btn btn-blue" style="padding:6px 12px; font-size:12px;" onclick="calculateAndDrawRoute()">
          🚀 ルート計算
        </button>
        <button class="btn btn-slate" style="padding:6px 10px; font-size:12px;" onclick="clearDrawnRoute()">
          ✕ 解除
        </button>
      </div>

      <!-- 手動描画コントロール -->
      <div id="manualControls" style="display:none; align-items:center; gap:10px; flex:1; flex-wrap:wrap;">
        <div style="display:flex; align-items:center; gap:6px; font-size:12px;">
          <span>吸着:</span>
          <select id="manualSnapType" style="padding:4px 8px; background:#1e293b; color:#fff; border:1px solid #475569; border-radius:4px;">
            <option value="snap">🛣️ 道路スナップ（推奨）</option>
            <option value="straight">📏 直線フリー</option>
          </select>
        </div>
        <button id="btnUndoPoint" class="btn btn-slate" style="padding:6px 10px; font-size:12px;" onclick="undoLastManualPoint()">
          ↩ 1つ戻す
        </button>
        <button class="btn btn-slate" style="padding:6px 10px; font-size:12px;" onclick="clearManualRoute()">
          🗑️ クリア
        </button>
      </div>

      <!-- 結果情報ピル -->
      <div id="routeInfoPill">
        <span>📏 <span id="routeDistanceText">0 km</span></span>
        <span id="routeDurationSpan">⏱️ <span id="routeDurationText">0 分</span></span>
        <button class="btn btn-amber" style="padding:2px 8px; font-size:11px;" onclick="saveCurrentDrawnRouteAsGeoJson()">
          💾 固定ルートとして保存
        </button>
      </div>
    </div>

    <!-- 手動描画中 ガイドバナー -->
    <div id="draw-guide-bar">
      <span>✏️ <b>地図上をクリック</b> してルートを描画中... (通過地点: <b id="manualPointCount">0</b> 点)</span>
      <button class="btn btn-purple" style="padding:4px 12px; font-size:12px;" onclick="finishManualDrawing()">
        ✅ 描画完了・確定
      </button>
    </div>

    <!-- 左パネル -->
    <div id="left-panel">
      <div class="panel-tabs">
        <button class="tab-btn active" onclick="switchTab('import')">📂 CSV取込・新規コース</button>
        <button class="tab-btn" onclick="switchTab('courses')">📋 保存済みコース一覧 (<span id="courseCount">0</span>)</button>
      </div>

      <!-- タブ1: CSV取込 & コース作成 -->
      <div id="tab-import" class="tab-content active">
        <div class="drop-zone" id="dropZone" onclick="document.getElementById('csvInput').click()">
          <div style="font-size: 32px; margin-bottom: 8px;">📂</div>
          <b style="font-size: 14px;">CSVファイルをドラッグ＆ドロップ</b>
          <div style="font-size: 12px; color: #94a3b8; margin-top: 4px;">またはクリックしてファイル選択 (Shift-JIS / UTF-8対応)</div>
          <input type="file" id="csvInput" accept=".csv" style="display:none;">
        </div>

        <div id="importSettings" style="display: none;">
          <div class="form-group">
            <label>コース名</label>
            <input type="text" id="courseNameInput" placeholder="例: 2026-08-15 奈良エリア午前便">
          </div>

          <div class="form-group">
            <label>担当ドライバー / ルートメモ</label>
            <input type="text" id="driverMemoInput" placeholder="例: 担当: 山田 / ルート001">
          </div>

          <div style="display: flex; justify-content: space-between; margin-bottom: 12px; font-size: 12px; color: #94a3b8;">
            <span>変換完了: <b id="geocodeSuccessCount" style="color:#38bdf8;">0</b> 件</span>
            <span>合計: <b id="geocodeTotalCount">0</b> 件</span>
          </div>

          <button id="btnSaveCourse" class="btn btn-green" style="width: 100%; justify-content: center; padding: 10px;">
            ✨ このコースを保存してドライバーに配信
          </button>
        </div>

        <div id="previewList" style="flex: 1; overflow-y: auto; margin-top: 16px;"></div>
      </div>

      <!-- タブ2: 保存済みコース一覧 & 進捗モニター -->
      <div id="tab-courses" class="tab-content">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
          <span style="font-size:13px; color:#94a3b8;">作成済み配達コース</span>
          <button class="btn btn-slate" style="padding:4px 8px; font-size:11px;" onclick="loadSampleCourses()">＋ サンプル便を追加</button>
        </div>
        <div id="courseList" style="flex: 1; overflow-y: auto;"></div>
      </div>
    </div>

    <!-- 右パネル：地図 -->
    <div id="map"></div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const map = L.map('map').setView([34.685, 135.805], 13);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '© OpenStreetMap contributors'
    }).addTo(map);

    let activeMarkers = [];
    let currentParsedItems = [];
    let activeLoadedItems = [];
    let currentDrawnRouteLayer = null;
    let lastCalculatedGeoJson = null;

    // 手動描画用変数
    let routeMode = 'auto'; // 'auto' | 'manual'
    let manualPoints = []; // [ { lat, lng } ]
    let manualPointMarkers = [];
    let manualRouteSegments = []; // GeoJSON line layers

    const STORAGE_KEY = 'navisystem_courses';

    // --- ストレージ管理 ---
    function getSavedCourses() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        return raw ? JSON.parse(raw) : [];
      } catch (e) {
        return [];
      }
    }

    function saveCourses(courses) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(courses));
      renderCourseList();
    }

    // --- タブ切り替え ---
    function switchTab(tabId) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));

      if (tabId === 'import') {
        document.querySelectorAll('.tab-btn')[0].classList.add('active');
        document.getElementById('tab-import').classList.add('active');
        activeLoadedItems = currentParsedItems;
        updateRouteDropdowns();
      } else {
        document.querySelectorAll('.tab-btn')[1].classList.add('active');
        document.getElementById('tab-courses').classList.add('active');
        renderCourseList();
      }
    }

    // --- モード切り替え (自動A-B / 手動クリック) ---
    window.switchRouteMode = function(mode) {
      routeMode = mode;
      const mapEl = document.getElementById('map');

      if (mode === 'auto') {
        document.getElementById('modeAutoBtn').classList.add('active');
        document.getElementById('modeManualBtn').classList.remove('active');
        document.getElementById('autoControls').style.display = 'flex';
        document.getElementById('manualControls').style.display = 'none';
        document.getElementById('draw-guide-bar').style.display = 'none';
        mapEl.classList.remove('drawing-mode-cursor');
      } else {
        document.getElementById('modeAutoBtn').classList.remove('active');
        document.getElementById('modeManualBtn').classList.add('active');
        document.getElementById('autoControls').style.display = 'none';
        document.getElementById('manualControls').style.display = 'flex';
        document.getElementById('draw-guide-bar').style.display = 'flex';
        mapEl.classList.add('drawing-mode-cursor');
        clearDrawnRoute();
      }
    };

    // --- 地図クリックイベント (手動描画) ---
    map.on('click', async (e) => {
      if (routeMode !== 'manual') return;

      const lat = e.latlng.lat;
      const lng = e.latlng.lng;
      const pt = { lat, lng };

      // マーカー追加
      const ptMarker = L.circleMarker([lat, lng], {
        radius: 6,
        fillColor: "#a855f7",
        color: "#ffffff",
        weight: 2,
        fillOpacity: 1
      }).addTo(map);
      manualPointMarkers.push(ptMarker);

      manualPoints.push(pt);
      document.getElementById('manualPointCount').innerText = manualPoints.length;

      // 2点以上あればラインを描画
      if (manualPoints.length >= 2) {
        const prevPt = manualPoints[manualPoints.length - 2];
        const snapType = document.getElementById('manualSnapType').value;

        if (snapType === 'snap') {
          // OSRM 道路スナップ探索
          const url = `https://router.project-osrm.org/route/v1/driving/${prevPt.lng},${prevPt.lat};${lng},${lat}?overview=full&geometries=geojson`;
          try {
            const res = await fetch(url);
            const data = await res.json();
            if (data.routes && data.routes.length > 0) {
              const segLayer = L.geoJSON(data.routes[0].geometry, {
                style: { color: '#dc2626', weight: 6, opacity: 0.9 } // 固定ルートは赤色
              }).addTo(map);
              manualRouteSegments.push({ layer: segLayer, geometry: data.routes[0].geometry, distance: data.routes[0].distance, duration: data.routes[0].duration });
            } else {
              drawStraightSegment(prevPt, pt);
            }
          } catch (err) {
            drawStraightSegment(prevPt, pt);
          }
        } else {
          drawStraightSegment(prevPt, pt);
        }

        updateManualRouteSummary();
      }
    });

    function drawStraightSegment(p1, p2) {
      const geojson = {
        type: "LineString",
        coordinates: [[p1.lng, p1.lat], [p2.lng, p2.lat]]
      };
      const segLayer = L.geoJSON(geojson, {
        style: { color: '#dc2626', weight: 6, opacity: 0.9 } // 固定ルートは赤色
      }).addTo(map);
      const d = map.distance([p1.lat, p1.lng], [p2.lat, p2.lng]);
      manualRouteSegments.push({ layer: segLayer, geometry: geojson, distance: d, duration: d / 8.33 }); // 約30km/h換算
    }

    function updateManualRouteSummary() {
      let totalDist = 0;
      let totalDur = 0;
      const allCoords = [];

      manualRouteSegments.forEach(s => {
        totalDist += s.distance || 0;
        totalDur += s.duration || 0;
        if (s.geometry && s.geometry.coordinates) {
          allCoords.push(...s.geometry.coordinates);
        }
      });

      const distKm = (totalDist / 1000).toFixed(2);
      const durMin = Math.round(totalDur / 60);

      document.getElementById('routeDistanceText').innerText = `${distKm} km`;
      document.getElementById('routeDurationText').innerText = `${durMin} 分`;
      document.getElementById('routeInfoPill').style.display = 'inline-flex';

      lastCalculatedGeoJson = {
        type: "Feature",
        properties: {
          route_name: `手動描画ルート_${new Date().toLocaleDateString()}`,
          distance_km: parseFloat(distKm),
          duration_min: durMin,
          points_count: manualPoints.length,
          created_at: new Date().toISOString()
        },
        geometry: {
          type: "LineString",
          coordinates: allCoords
        }
      };
    }

    window.undoLastManualPoint = function() {
      if (manualPoints.length === 0) return;
      manualPoints.pop();
      const lastMarker = manualPointMarkers.pop();
      if (lastMarker) map.removeLayer(lastMarker);

      if (manualRouteSegments.length > 0) {
        const lastSeg = manualRouteSegments.pop();
        if (lastSeg.layer) map.removeLayer(lastSeg.layer);
      }

      document.getElementById('manualPointCount').innerText = manualPoints.length;
      updateManualRouteSummary();
    };

    window.clearManualRoute = function() {
      manualPointMarkers.forEach(m => map.removeLayer(m));
      manualRouteSegments.forEach(s => map.removeLayer(s.layer));
      manualPointMarkers = [];
      manualRouteSegments = [];
      manualPoints = [];
      document.getElementById('manualPointCount').innerText = '0';
      document.getElementById('routeInfoPill').style.display = 'none';
      lastCalculatedGeoJson = null;
    };

    window.finishManualDrawing = function() {
      if (manualPoints.length < 2) return alert("2地点以上クリックしてください。");
      alert(`✅ ルート描画が完了しました！（全 ${manualPoints.length} 地点・距離 ${document.getElementById('routeDistanceText').innerText}）\n「💾 固定ルートとして保存」ボタンからGeoJSONとして保存できます。`);
    };

    // --- 国土地理院 API 住所変換 ---
    async function geocodeAddress(address) {
      if (!address) return null;
      let cleanAddr = address.trim().replace(/[ー−―-]/g, '-');
      let result = await fetchGsi(cleanAddr);
      if (result) return result;

      const simplifiedAddr = cleanAddr.replace(/[0-9０-９].*$/, '').trim();
      if (simplifiedAddr && simplifiedAddr !== cleanAddr) {
        result = await fetchGsi(simplifiedAddr);
        if (result) return result;
      }
      return null;
    }

    async function fetchGsi(query) {
      try {
        const url = `https://msearch.gsi.go.jp/address-search/AddressSearch?q=${encodeURIComponent(query)}`;
        const res = await fetch(url);
        const data = await res.json();
        if (data && data.length > 0) {
          return { lat: data[0].geometry.coordinates[1], lng: data[0].geometry.coordinates[0] };
        }
      } catch (e) {
        console.error("ジオコーディング通信エラー:", query, e);
      }
      return null;
    }

    // --- CSV処理 ---
    const dropZone = document.getElementById('dropZone');
    const csvInput = document.getElementById('csvInput');

    dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('dragover'); });
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
    dropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropZone.classList.remove('dragover');
      if (e.dataTransfer.files.length > 0) handleCsvFile(e.dataTransfer.files[0]);
    });
    csvInput.addEventListener('change', (e) => {
      if (e.target.files.length > 0) handleCsvFile(e.target.files[0]);
    });

    async function handleCsvFile(file) {
      const buffer = await file.arrayBuffer();
      let text = "";
      try {
        const utf8Decoder = new TextDecoder('utf-8', { fatal: true });
        text = utf8Decoder.decode(buffer);
      } catch (err) {
        const sjisDecoder = new TextDecoder('shift-jis');
        text = sjisDecoder.decode(buffer);
      }

      const rows = parseCSV(text);
      if (rows.length < 2) return alert("有効なCSVデータがありません。");

      const header = rows[0].map(h => h.trim());
      let orderIndex = header.findIndex(h => h.includes('順') || h.includes('No') || h.includes('no') || h.includes('Seq') || h.includes('seq') || h.includes('番号'));
      let nameIndex = header.findIndex(h => h.includes('名前') || h.includes('氏名') || h.includes('顧客') || h.includes('宛先'));
      let addrIndex = header.findIndex(h => h.includes('住所') || h.includes('お届け先') || h.includes('送付先') || h.includes('場所'));
      let timeIndex = header.findIndex(h => h.includes('時間') || h.includes('指定'));
      let memoIndex = header.findIndex(h => h.includes('メモ') || h.includes('備考') || h.includes('注意'));

      if (nameIndex === -1) nameIndex = orderIndex === 0 ? 1 : 0;
      if (addrIndex === -1) addrIndex = nameIndex === 1 ? 2 : 1;

      clearMap();
      clearDrawnRoute();
      clearManualRoute();
      currentParsedItems = [];
      document.getElementById('importSettings').style.display = 'block';
      document.getElementById('courseNameInput').value = `${new Date().toLocaleDateString()} 配達便 (${rows.length - 1}件)`;

      const previewEl = document.getElementById('previewList');
      previewEl.innerHTML = '<div style="color:#94a3b8; text-align:center;">住所を解析中...</div>';

      let successCount = 0;
      for (let i = 1; i < rows.length; i++) {
        const row = rows[i];
        if (!row || row.length <= addrIndex) continue;

        const orderVal = orderIndex !== -1 && row[orderIndex] ? parseInt(row[orderIndex]) : i;
        const name = row[nameIndex] || `配達先 ${i}`;
        const address = row[addrIndex] || "";
        const time = timeIndex !== -1 ? row[timeIndex] : "";
        const memo = memoIndex !== -1 ? row[memoIndex] : "";
        if (!address) continue;

        const coords = await geocodeAddress(address);
        const item = {
          id: i,
          order: isNaN(orderVal) ? i : orderVal,
          name: name,
          address: address,
          time: time,
          memo: memo,
          lat: coords ? coords.lat : 34.685 + (Math.random() - 0.5) * 0.05,
          lng: coords ? coords.lng : 135.805 + (Math.random() - 0.5) * 0.05,
          isDone: false,
          hasValidCoords: !!coords
        };

        currentParsedItems.push(item);
        if (coords) successCount++;
      }

      // 配達順でソート
      currentParsedItems.sort((a, b) => a.order - b.order);

      document.getElementById('geocodeSuccessCount').innerText = successCount;
      document.getElementById('geocodeTotalCount').innerText = currentParsedItems.length;

      activeLoadedItems = currentParsedItems;
      renderPreviewList();
      plotItemsOnMap(currentParsedItems);
      updateRouteDropdowns();
    }

    function parseCSV(text) {
      const lines = text.split(/\r\n|\n|\r/);
      const result = [];
      for (const line of lines) {
        if (!line.trim()) continue;
        const row = [];
        let insideQuote = false;
        let entry = '';
        for (let i = 0; i < line.length; i++) {
          const char = line[i];
          if (char === '"') {
            insideQuote = !insideQuote;
          } else if (char === ',' && !insideQuote) {
            row.push(entry.trim().replace(/^"|"$/g, ''));
            entry = '';
          } else {
            entry += char;
          }
        }
        row.push(entry.trim().replace(/^"|"$/g, ''));
        result.push(row);
      }
      return result;
    }

    function renderPreviewList() {
      const previewEl = document.getElementById('previewList');
      previewEl.innerHTML = '';
      currentParsedItems.forEach(item => {
        const div = document.createElement('div');
        div.className = 'delivery-item';
        div.innerHTML = `
          <div style="display:flex; justify-content:space-between;">
            <b>#${item.id} ${item.name}</b>
            <span style="font-size:11px; color:#38bdf8;">${item.time || '指定なし'}</span>
          </div>
          <div style="color:#94a3b8; font-size:11px; margin-top:2px;">${item.address}</div>
          ${item.memo ? `<div style="color:#f59e0b; font-size:10px; margin-top:2px;">📝 ${item.memo}</div>` : ''}
        `;
        previewEl.appendChild(div);
      });
    }

    // --- コース保存 ---
    document.getElementById('btnSaveCourse').addEventListener('click', () => {
      if (currentParsedItems.length === 0) return alert("保存する配達データがありません。");
      const name = document.getElementById('courseNameInput').value || `コース ${Date.now()}`;
      const memo = document.getElementById('driverMemoInput').value || "";

      const newCourse = {
        id: 'course_' + Date.now(),
        name: name,
        memo: memo,
        createdAt: new Date().toISOString(),
        items: currentParsedItems
      };

      const courses = getSavedCourses();
      courses.unshift(newCourse);
      saveCourses(courses);

      alert(`✅ コース「${name}」を保存しました！\nスマホドライバー画面から選択できるようになりました。`);
      switchTab('courses');
    });

    // --- コース一覧表示 & 進捗モニター ---
    function renderCourseList() {
      const courses = getSavedCourses();
      document.getElementById('courseCount').innerText = courses.length;
      const listEl = document.getElementById('courseList');
      listEl.innerHTML = '';

      if (courses.length === 0) {
        listEl.innerHTML = '<div style="text-align:center; color:#94a3b8; margin-top:30px; font-size:12px;">保存されたコースはありません</div>';
        return;
      }

      courses.forEach(course => {
        const doneCount = course.items.filter(i => i.isDone).length;
        const totalCount = course.items.length;
        const percent = totalCount > 0 ? Math.round((doneCount / totalCount) * 100) : 0;

        const card = document.createElement('div');
        card.className = 'course-card';
        card.innerHTML = `
          <div class="course-header">
            <span class="course-title">${course.name}</span>
            <button class="btn btn-red" style="padding:2px 6px; font-size:10px;" onclick="deleteCourse('${course.id}', event)">削除</button>
          </div>
          <div class="course-meta">
            <span>📦 ${totalCount} 件</span>
            <span>✅ 完了: ${doneCount}件 (${percent}%)</span>
            <span>🕒 ${new Date(course.createdAt).toLocaleDateString()}</span>
          </div>
          <div class="progress-bar-bg">
            <div class="progress-bar-fill" style="width: ${percent}%"></div>
          </div>
        `;

        card.onclick = () => {
          document.querySelectorAll('.course-card').forEach(c => c.classList.remove('selected'));
          card.classList.add('selected');
          activeLoadedItems = course.items;
          plotItemsOnMap(course.items);
          updateRouteDropdowns();
        };

        listEl.appendChild(card);
      });
    }

    window.deleteCourse = function(courseId, event) {
      event.stopPropagation();
      if (!confirm("このコースを削除しますか？")) return;
      let courses = getSavedCourses();
      courses = courses.filter(c => c.id !== courseId);
      saveCourses(courses);
      clearMap();
      clearDrawnRoute();
      clearManualRoute();
    };

    function clearMap() {
      activeMarkers.forEach(m => map.removeLayer(m));
      activeMarkers = [];
    }

    function plotItemsOnMap(items) {
      clearMap();
      if (!items || items.length === 0) return;

      items.forEach(item => {
        const marker = L.circleMarker([item.lat, item.lng], {
          radius: 9,
          fillColor: item.isDone ? "#16a34a" : "#2563eb",
          color: "#fff",
          weight: 2,
          fillOpacity: 0.9
        }).addTo(map);

        marker.bindPopup(`
          <div style="min-width:180px; font-size:12px;">
            <b style="font-size:13px;">#${item.id} ${item.name}</b><br>
            <span style="color:#64748b;">${item.address}</span><br>
            ${item.time ? `<span style="color:#2563eb;">🕒 ${item.time}</span><br>` : ''}
            ${item.memo ? `<span style="color:#f59e0b;">📝 ${item.memo}</span>` : ''}
            <div style="display:flex; gap:6px; margin-top:8px;">
              <button class="btn btn-blue" style="flex:1; padding:4px 6px; font-size:11px;" onclick="setRoutePoint('from', ${item.id})">🚩 A(出発)</button>
              <button class="btn btn-green" style="flex:1; padding:4px 6px; font-size:11px;" onclick="setRoutePoint('to', ${item.id})">🏁 B(到着)</button>
            </div>
          </div>
        `);

        activeMarkers.push(marker);
      });

      const group = new L.featureGroup(activeMarkers);
      map.fitBounds(group.getBounds(), { padding: [40, 40] });
    }

    // --- 自動 A➔B ルート計算 ---
    function updateRouteDropdowns() {
      const fromSel = document.getElementById('routeFromSelect');
      const toSel = document.getElementById('routeToSelect');
      
      const prevFrom = fromSel.value;
      const prevTo = toSel.value;

      fromSel.innerHTML = '<option value="">-- 出発地を選択 (A) --</option>';
      toSel.innerHTML = '<option value="">-- 目的地を選択 (B) --</option>';

      activeLoadedItems.forEach(it => {
        const label = `#${it.id} ${it.name} (${it.address.slice(0, 10)}...)`;
        fromSel.add(new Option(label, it.id));
        toSel.add(new Option(label, it.id));
      });

      if (prevFrom) fromSel.value = prevFrom;
      if (prevTo) toSel.value = prevTo;

      if (activeLoadedItems.length >= 2 && !fromSel.value && !toSel.value) {
        fromSel.value = activeLoadedItems[0].id;
        toSel.value = activeLoadedItems[1].id;
      }
    }

    window.setRoutePoint = function(type, id) {
      switchRouteMode('auto');
      if (type === 'from') {
        document.getElementById('routeFromSelect').value = id;
      } else {
        document.getElementById('routeToSelect').value = id;
      }
      map.closePopup();

      const fromId = document.getElementById('routeFromSelect').value;
      const toId = document.getElementById('routeToSelect').value;
      if (fromId && toId && fromId !== toId) {
        calculateAndDrawRoute();
      }
    };

    window.calculateAndDrawRoute = async function() {
      const fromId = parseInt(document.getElementById('routeFromSelect').value);
      const toId = parseInt(document.getElementById('routeToSelect').value);

      if (!fromId || !toId) return alert("出発地(A)と目的地(B)の両方を選択してください。");
      if (fromId === toId) return alert("出発地と目的地が同じです。異なる地点を選択してください。");

      const itemA = activeLoadedItems.find(i => i.id === fromId);
      const itemB = activeLoadedItems.find(i => i.id === toId);

      if (!itemA || !itemB) return alert("指定された配達先が見つかりません。");

      const url = `https://router.project-osrm.org/route/v1/driving/${itemA.lng},${itemA.lat};${itemB.lng},${itemB.lat}?overview=full&geometries=geojson`;

      try {
        const res = await fetch(url);
        const data = await res.json();

        if (data.routes && data.routes.length > 0) {
          const route = data.routes[0];
          clearDrawnRoute();

          currentDrawnRouteLayer = L.geoJSON(route.geometry, {
            style: { color: '#1d4ed8', weight: 7, opacity: 0.95 } // 濃い青色
          }).addTo(map);

          map.fitBounds(currentDrawnRouteLayer.getBounds(), { padding: [60, 60] });

          const distKm = (route.distance / 1000).toFixed(2);
          const durMin = Math.round(route.duration / 60);

          document.getElementById('routeDistanceText').innerText = `${distKm} km`;
          document.getElementById('routeDurationText').innerText = `${durMin} 分`;
          document.getElementById('routeDurationSpan').style.display = 'inline';
          document.getElementById('routeInfoPill').style.display = 'inline-flex';

          lastCalculatedGeoJson = {
            type: "Feature",
            properties: {
              route_name: `${itemA.name} ➔ ${itemB.name}`,
              from_id: itemA.id,
              from_name: itemA.name,
              to_id: itemB.id,
              to_name: itemB.name,
              distance_km: parseFloat(distKm),
              duration_min: durMin,
              created_at: new Date().toISOString()
            },
            geometry: route.geometry
          };
        } else {
          alert("経路が見つかりませんでした。");
        }
      } catch (err) {
        console.error(err);
        alert("経路探索APIへの通信に失敗しました。");
      }
    };

    window.clearDrawnRoute = function() {
      if (currentDrawnRouteLayer) {
        map.removeLayer(currentDrawnRouteLayer);
        currentDrawnRouteLayer = null;
      }
      lastCalculatedGeoJson = null;
      document.getElementById('routeInfoPill').style.display = 'none';
    };

    window.saveCurrentDrawnRouteAsGeoJson = function() {
      if (!lastCalculatedGeoJson) return alert("保存するルートがありません");
      const blob = new Blob([JSON.stringify(lastCalculatedGeoJson, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      const name = lastCalculatedGeoJson.properties.route_name || `route_${Date.now()}`;
      a.download = `${name.replace(/[ ➔]/g, '_')}.geojson`;
      a.click();
      alert("✅ 固定区間ルートをGeoJSONファイルとして保存しました！");
    };

    // --- サンプルコース投入 ---
    window.loadSampleCourses = function() {
      const sampleCourse = {
        id: 'sample_' + Date.now(),
        name: '本日 奈良エリア午前配達便 (サンプル)',
        memo: '担当: テストドライバー',
        createdAt: new Date().toISOString(),
        items: [
          { id: 1, name: "田中 太郎", address: "奈良県奈良市登大路町30", time: "午前中", memo: "置き配可（玄関前）", lat: 34.685062, lng: 135.832809, isDone: false },
          { id: 2, name: "佐藤 次郎", address: "奈良県生駒市北新町10-38", time: "14:00-16:00", memo: "オートロック暗証1234", lat: 34.694481, lng: 135.697067, isDone: false },
          { id: 3, name: "鈴木 三郎", address: "奈良県大和高田市大中100", time: "18:00-20:00", memo: "不在時宅配BOX", lat: 34.515060, lng: 135.737167, isDone: false },
          { id: 4, name: "高橋 四郎", address: "奈良県奈良市三条栄町", time: "指定なし", memo: "道幅狭小注意", lat: 34.680706, lng: 135.808823, isDone: false }
        ]
      };
      const courses = getSavedCourses();
      courses.unshift(sampleCourse);
      saveCourses(courses);
    };

    // 初期表示
    renderCourseList();
  </script>
</body>
