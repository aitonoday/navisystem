<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>LIVELY NAVI - 代配コース</title>
  
  <!-- PWA設定 -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#042f2e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Lively Navi">
  <link rel="apple-touch-icon" href="logo.png">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
  
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      font-family: 'Plus Jakarta Sans', 'Noto Sans JP', -apple-system, sans-serif;
      background: #f8fafc;
      color: #0f172a;
      overflow: hidden;
      user-select: none;
    }
    #app-root {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* 共通ボタン */
    .btn {
      padding: 10px 14px;
      border: none;
      border-radius: 12px;
      font-weight: 700;
      cursor: pointer;
      font-size: 13px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      text-decoration: none;
    }
    .btn-primary {
      background: linear-gradient(135deg, #0d9488 0%, #059669 100%);
      color: #ffffff;
      box-shadow: 0 4px 14px rgba(13, 148, 136, 0.35);
    }
    .btn-primary:active { transform: scale(0.97); }

    .btn-blue {
      background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
      color: #ffffff;
      box-shadow: 0 4px 14px rgba(2, 132, 199, 0.3);
    }
    .btn-blue:active { transform: scale(0.97); }

    .btn-green {
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      color: #ffffff;
      box-shadow: 0 4px 14px rgba(16, 185, 129, 0.35);
    }
    .btn-green:active { transform: scale(0.97); }

    .btn-slate {
      background: rgba(255, 255, 255, 0.15);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(8px);
    }
    .btn-slate:active { background: rgba(255, 255, 255, 0.25); transform: scale(0.97); }

    .btn-white {
      background: #ffffff;
      color: #0f172a;
      border: 1px solid #e2e8f0;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
    }
    .btn-white:active { background: #f1f5f9; transform: scale(0.97); }

    /* 🎯 ナビポインター (現在地ブルードット・三角なし安定デザイン) */
    .car-marker-container {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .car-icon-body {
      width: 22px;
      height: 22px;
      background: #0284c7;
      border: 3.5px solid #ffffff;
      border-radius: 50%;
      box-shadow: 0 3px 10px rgba(2, 132, 199, 0.6), 0 0 0 2px rgba(2, 132, 199, 0.4);
      z-index: 10;
    }
    .car-pulse {
      position: absolute;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: rgba(2, 132, 199, 0.35);
      animation: pulseAnim 2s infinite ease-out;
      z-index: 1;
    }
    @keyframes pulseAnim {
      0% { transform: scale(0.4); opacity: 0.9; }
      100% { transform: scale(1.5); opacity: 0; }
    }

    /* 🏁 目的地 Goalバッジ マーカー */
    .goal-pin-container {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .goal-pin-badge {
      background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
      color: #ffffff;
      font-weight: 900;
      font-size: 13px;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2.5px solid #ffffff;
      box-shadow: 0 4px 12px rgba(220, 38, 38, 0.5);
      animation: goalBounce 1.5s infinite ease-in-out;
    }
    .goal-pin-label {
      background: #0f172a;
      color: #38bdf8;
      font-size: 9px;
      font-weight: 800;
      padding: 1px 5px;
      border-radius: 4px;
      margin-top: -2px;
      border: 1px solid rgba(255,255,255,0.2);
      white-space: nowrap;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
    }
    @keyframes goalBounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }

    /* 配達ピン (通常・完了) */
    .dest-pin-badge {
      background: #0d9488;
      color: #ffffff;
      font-weight: 800;
      font-size: 11px;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid #ffffff;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }
    .dest-pin-badge.done {
      background: #10b981;
      opacity: 0.85;
    }

    /* --- 画面1: コース選択画面 (HOME) --- */
    #view-course-select {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 20px 16px;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      background: linear-gradient(180deg, #f0fdfa 0%, #f8fafc 100%);
    }
    .app-header-hero {
      text-align: center;
      margin: 10px 0 20px;
    }
    .logo-badge-wrap {
      display: inline-block;
      background: #ffffff;
      padding: 8px 20px;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(13, 148, 136, 0.12);
      margin-bottom: 6px;
    }
    .app-subtitle {
      font-size: 13px;
      color: #0d9488;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .course-card-mobile {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 20px;
      padding: 18px;
      margin-bottom: 14px;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.05);
      transition: all 0.2s ease;
    }
    .course-title-mobile {
      font-size: 17px;
      font-weight: 800;
      color: #0f172a;
      letter-spacing: -0.3px;
    }
    .course-desc-mobile {
      font-size: 12px;
      color: #64748b;
      margin: 4px 0 12px;
    }
    .course-stats {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      margin-bottom: 14px;
      background: #f8fafc;
      padding: 10px 14px;
      border-radius: 12px;
      border: 1px solid #f1f5f9;
    }

    /* --- 画面2: 運行・ナビ画面 (NAVIGATION) --- */
    #view-nav-main {
      flex: 1;
      display: none;
      flex-direction: column;
      width: 100%;
      height: 100%;
      position: relative;
    }

    /* ナビ上部ヘッダーバー */
    #nav-header {
      background: #ffffff;
      padding: 8px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #e2e8f0;
      z-index: 1000;
      height: 50px;
    }

    /* メインマップエリア */
    #map-container {
      flex: 1;
      width: 100%;
      height: calc(100% - 50px);
      position: relative;
      background: #f1f5f9;
      overflow: hidden;
    }
    #map {
      width: 100%;
      height: 100%;
      margin: 0;
      background: #f1f5f9;
    }

    /* 🚚 02. NAVIGATION 公式デザイン HUDカード（画面最上部） */
    #transit-target-card {
      position: absolute;
      top: 8px;
      left: 8px;
      right: 8px;
      background: linear-gradient(135deg, #042f2e 0%, #0f172a 100%);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 16px;
      padding: 8px 12px;
      z-index: 1000;
      box-shadow: 0 10px 30px rgba(4, 47, 46, 0.4), 0 2px 6px rgba(0,0,0,0.2);
      color: #ffffff;
      animation: fadeIn 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* 縦向き（デフォルト）：きっちり3段レイアウト */
    .hud-info-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; gap: 8px; }
    .hud-title-group { display: flex; align-items: center; gap: 6px; overflow: hidden; flex: 1; }
    .hud-order-badge { background: linear-gradient(135deg, #0d9488 0%, #0f766e 100%); color: #fff; font-size: 11px; font-weight: 800; padding: 2px 7px; border-radius: 6px; white-space: nowrap; }
    .hud-name { font-size: 15px; font-weight: 900; color: #38bdf8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .hud-address-landscape { display: none; }
    .hud-status-group { display: flex; align-items: center; gap: 5px; }
    .hud-distance-landscape { display: none; }
    .hud-fix-btn {
      font-size: 10px;
      color: #94a3b8;
      background: rgba(255,255,255,0.12);
      padding: 2px 6px;
      border-radius: 4px;
      cursor: pointer;
      white-space: nowrap;
    }
    .hud-address-row-portrait { display: flex; justify-content: space-between; align-items: center; font-size: 11px; color: #cbd5e1; margin-bottom: 6px; gap: 8px; }
    .hud-actions-row { display: flex; gap: 6px; align-items: center; margin-bottom: 0; }

    /* 📱 横向き（Landscape）最適化：超スリムな完全1段（1行）レイアウト */
    @media (orientation: landscape) {
      #nav-header {
        height: 36px;
        padding: 3px 12px;
      }
      #map-container {
        height: calc(100% - 36px);
      }
      #transit-target-card {
        top: 6px;
        left: 8px;
        right: 8px;
        padding: 6px 12px;
        border-radius: 14px;
        box-shadow: 0 8px 24px rgba(4, 47, 46, 0.45);
        display: flex !important;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
      }
      /* 1段目（左側情報エリア） */
      .hud-info-row {
        flex: 1;
        margin-bottom: 0;
        gap: 8px;
        overflow: hidden;
      }
      .hud-title-group {
        gap: 6px;
      }
      .hud-name {
        font-size: 14px;
      }
      .hud-address-landscape {
        display: inline-block;
        font-size: 11px;
        color: #cbd5e1;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 24vw;
        margin-left: 4px;
      }
      .hud-distance-landscape {
        display: inline-block;
        font-size: 11px;
        padding: 2px 6px;
        white-space: nowrap;
        color: #38bdf8;
        font-weight: 800;
        background: rgba(0,0,0,0.3);
        border-radius: 6px;
      }
      #tracking-indicator {
        font-size: 9px;
        padding: 1px 6px;
      }
      .hud-address-row-portrait {
        display: none !important;
      }
      /* 2段目（右側ボタンエリア）: 横一列に統合 */
      .hud-actions-row {
        margin-bottom: 0;
        gap: 6px;
        flex-shrink: 0;
      }
      .hud-actions-row .btn {
        padding: 6px 10px !important;
        font-size: 11px !important;
        border-radius: 8px !important;
        white-space: nowrap;
      }
      #btnRecenterLocation {
        bottom: 10px;
        right: 10px;
        width: 38px;
        height: 38px;
        font-size: 16px;
      }
    }

    /* 2択選択モーダル（フローティングカード） */
    #select-next-modal {
      position: absolute;
      top: 10px;
      left: 10px;
      right: 10px;
      z-index: 1500;
      display: none;
      pointer-events: none;
      animation: fadeIn 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .modal-content-card {
      pointer-events: auto;
      background: linear-gradient(135deg, #042f2e 0%, #0f172a 100%);
      border: 1.5px solid #14b8a6;
      border-radius: 20px;
      padding: 16px 18px;
      box-shadow: 0 16px 40px rgba(0,0,0,0.5);
      color: #ffffff;
    }
    .modal-headline {
      font-size: 11px;
      color: #94a3b8;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      margin-bottom: 4px;
    }
    .modal-target-title {
      font-size: 20px;
      font-weight: 900;
      color: #38bdf8;
      margin-bottom: 4px;
      line-height: 1.3;
    }
    .modal-target-addr {
      font-size: 13px;
      color: #cbd5e1;
      margin-bottom: 16px;
    }

    /* 配送先選択リストモーダル (03. SEARCH風) */
    #all-destinations-modal {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: #f8fafc;
      z-index: 2100;
      display: none;
      flex-direction: column;
      padding: 16px;
    }
    .dest-list-scroll {
      flex: 1;
      overflow-y: auto;
      margin: 14px 0;
      -webkit-overflow-scrolling: touch;
    }
    .dest-select-card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      padding: 14px;
      margin-bottom: 10px;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0,0,0,0.03);
      transition: all 0.2s;
    }
    .dest-select-card:active { background: #f1f5f9; }
    .dest-select-card.completed {
      background: #f0fdf4;
      border-color: #86efac;
    }

    /* GPS記録中インジケータ */
    #tracking-indicator {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: rgba(239, 68, 68, 0.2);
      border: 1px solid rgba(239, 68, 68, 0.4);
      padding: 2px 8px;
      border-radius: 20px;
      font-size: 10px;
      color: #fca5a5;
      font-weight: 700;
    }
  </style>
</head>
<body>

  <div id="app-root">
    <!-- ================= 画面1: コース選択画面 (HOME) ================= -->
    <div id="view-course-select">
      <div class="app-header-hero">
        <div class="logo-badge-wrap">
          <img src="logo.svg" alt="LIVELY NAVI" style="max-width: 190px; width: 100%; height: auto; display: block;">
        </div>
        <div class="app-subtitle">Move Lively, Arrive Happy.</div>
      </div>

      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;">
        <b style="font-size:17px; font-weight:900; color:#0f172a; display:flex; align-items:center; gap:6px;">🚚 代配コース</b>
        <div style="display:flex; gap:6px;">
          <button class="btn btn-primary" style="padding:5px 10px; font-size:11px; font-weight:800;" onclick="syncWithCloudDirect()">☁️ クラウド同期</button>
          <button class="btn btn-white" style="padding:5px 8px; font-size:11px;" onclick="openMapSelectorModal()">🗺️ 地図切替</button>
          <button class="btn btn-white" style="padding:5px 8px; font-size:11px; color:#0d9488; font-weight:700;" onclick="forceClearCacheAndReload()">⚡ 最新化</button>
        </div>
      </div>

      <div id="courseCardsContainer">
        <!-- コースカード動的挿入 -->
      </div>
    </div>

    <!-- ================= 画面2: 運行・ナビ画面 (NAVIGATION) ================= -->
    <div id="view-nav-main">
      <!-- 上部ヘッダー -->
      <div id="nav-header">
        <button class="btn btn-white" style="padding:6px 10px; font-size:12px;" onclick="exitToCourseSelect()">
          ◀ コース一覧
        </button>
        <button class="btn btn-white" style="padding:5px 10px; font-size:12px; font-weight:700; color:#0f172a; border-color:#cbd5e1;" onclick="openMapSelectorModal()">
          🗺️ 地図変更
        </button>
        <div style="font-size:12px; color:#0d9488; font-weight:800; background:#f0fdfa; border:1px solid #ccfbf1; padding:3px 8px; border-radius:12px;">
          <span id="navDeliveredCount">0</span>/<span id="navTotalCount">0</span> 完了
        </div>
      </div>

      <!-- マップコンテナ -->
      <div id="map-container">
        <!-- 🚚 02. NAVIGATION 公式デザイン HUDカード（画面最上部） -->
        <div id="transit-target-card" style="display:none;">
          <!-- 1段目: 宛名・順番 ＋ GPS ＋ 地点修正リンク -->
          <div class="hud-info-row">
            <div class="hud-title-group">
              <span class="hud-order-badge">
                #<span id="transitOrderNum">1</span>
              </span>
              <span class="hud-name" id="transitName">宛名 様</span>
              <span class="hud-address-landscape" id="transitAddressLandscape">住所</span>
            </div>
            <div class="hud-status-group">
              <span class="hud-distance hud-distance-landscape" id="distanceTextLandscape">-- m</span>
              <div id="tracking-indicator">
                🔴 GPS (<span id="gpsPointCount">0</span>)
              </div>
              <span class="hud-fix-btn" onclick="openLocationCorrectionModal()">📍位置修正</span>
            </div>
          </div>

          <!-- 2段目（縦向き専用）: 住所 ＋ メモ ＋ 残り距離（横向きでは1段目に統合されるため非表示） -->
          <div class="hud-address-row-portrait">
            <div style="flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; display:flex; align-items:center; gap:6px;">
              <span id="transitAddress" style="overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">住所</span>
              <span id="transitMemoInline" style="display:none; color:#f59e0b; font-weight:700; font-size:10px; background:rgba(245,158,11,0.15); padding:1px 5px; border-radius:4px; white-space:nowrap;">📝</span>
            </div>
            <span class="hud-distance" id="distanceText" style="white-space:nowrap; color:#38bdf8; font-weight:800; background:rgba(0,0,0,0.3); padding:1px 8px; border-radius:6px; font-size:11px;">-- m</span>
            <span id="proximityStatusBadge" style="display:none;">案内中</span>
          </div>

          <!-- 3段目（縦向き時） / 2段目（横向き時）: 3ボタン横並び（到着・Gマップ・変更） -->
          <div class="hud-actions-row">
            <button class="btn btn-green" id="mainArrivalButton" style="flex:1; padding:9px 4px; font-size:13px; font-weight:900;" onclick="onArrivalClick()">
              📍 到着
            </button>
            <button class="btn btn-blue" style="flex:1; padding:9px 4px; font-size:13px; font-weight:700;" onclick="openExternalGoogleMap()">
              🗺️ Gマップ
            </button>
            <button class="btn btn-slate" style="flex:1; padding:9px 4px; font-size:13px; font-weight:700;" onclick="openChangeDestinationModal()">
              🔄 変更
            </button>
          </div>
        </div>

        <!-- 地点修正モーダル -->
        <div id="location-correction-modal" style="position:absolute; top:20px; left:16px; right:16px; z-index:2000; background:linear-gradient(135deg, #042f2e 0%, #0f172a 100%); border:1.5px solid #14b8a6; border-radius:20px; padding:18px; color:#fff; box-shadow:0 16px 40px rgba(0,0,0,0.6); display:none;">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
            <b style="font-size:16px; color:#38bdf8;">📍 地点位置の修正・マスター登録</b>
            <button class="btn btn-slate" style="padding:2px 8px; font-size:11px;" onclick="closeLocationCorrectionModal()">✕</button>
          </div>
          <p style="font-size:12px; color:#cbd5e1; margin-bottom:14px; line-height:1.4;">
            ピンの位置が実際の建物と異なる場合、修正して登録できます。<br>
            <span style="color:#4ade80; font-weight:700;">※登録すると、次回以降のすべての配送でも自動的にこの位置にピンが立ちます。</span>
          </p>
          <div style="display:flex; flex-direction:column; gap:8px;">
            <button class="btn btn-primary" style="padding:12px; font-size:13px;" onclick="correctLocationWithCurrentGps()">
              📱 今いる現在地（GPS）を正しい位置にする
            </button>
            <button class="btn btn-blue" style="padding:12px; font-size:13px;" onclick="startMapTapCorrectionMode()">
              🗺️ 地図をタップして正しい建物を指定する
            </button>
          </div>
        </div>

        <!-- 地図タップ修正中 ガイドバナー -->
        <div id="map-tap-guide-bar" style="position:absolute; top:12px; left:12px; right:12px; z-index:2000; background:#0d9488; color:#fff; padding:10px 14px; border-radius:14px; display:none; justify-content:space-between; align-items:center; box-shadow:0 8px 24px rgba(0,0,0,0.3); font-size:12px; font-weight:800;">
          <span>🗺️ <b>地図上の正しい建物をタップ</b> してください</span>
          <button class="btn btn-white" style="padding:3px 8px; font-size:11px;" onclick="cancelMapTapCorrection()">✕ 中止</button>
        </div>

        <!-- 地図本体（全画面） -->
        <div id="map"></div>

        <!-- 右下フローティングコントロール（地図切替 ＆ 現在地センタリング） -->
        <div style="position:absolute; bottom:20px; right:16px; z-index:1000; display:flex; flex-direction:column; gap:10px; align-items:center;">
          <!-- 🗺️ 地図の種類切替ボタン -->
          <button id="btnOpenMapSelector" class="btn btn-white" style="border-radius:50%; width:46px; height:46px; padding:0; box-shadow:0 6px 16px rgba(0,0,0,0.15); font-size:20px; color:#0f172a; border:1.5px solid #e2e8f0;" onclick="openMapSelectorModal()" title="地図の種類を変更">
            🗺️
          </button>

          <!-- 📍 現在地へセンタリングするボタン -->
          <button id="btnRecenterLocation" class="btn btn-white" style="border-radius:50%; width:46px; height:46px; padding:0; box-shadow:0 6px 16px rgba(0,0,0,0.12); font-size:20px; color:#0d9488; border:1px solid #e2e8f0;" onclick="centerOnUserLocation()" title="現在地を中心にする">
            📍
          </button>
        </div>
      </div>

      <!-- 🗺️ 地図の種類 選択モーダルパネル (最前面オーバーレイ) -->
      <div id="map-selector-modal" style="position:fixed; top:0; left:0; right:0; bottom:0; z-index:9999; background:rgba(15,23,42,0.5); backdrop-filter:blur(6px); display:none; align-items:center; justify-content:center; padding:16px;">
        <div style="background:#ffffff; border:1px solid #e2e8f0; border-radius:24px; padding:22px; max-width:380px; width:100%; box-shadow:0 24px 60px rgba(15,23,42,0.3); animation:fadeIn 0.2s cubic-bezier(0.16,1,0.3,1);">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; border-bottom:1px solid #f1f5f9; padding-bottom:10px;">
            <b style="font-size:16px; color:#0f172a; font-weight:800;">🗺️ 地図の種類を選択 (無料)</b>
            <button class="btn btn-white" style="padding:4px 10px; font-size:12px;" onclick="closeMapSelectorModal()">✕ 閉じる</button>
          </div>

          <div style="display:flex; flex-direction:column; gap:8px;">
            <button class="btn btn-white map-choice-btn" id="mapChoice_carto" style="justify-content:flex-start; padding:11px 14px; font-size:13px; border-color:#0d9488; background:#f0fdfa;" onclick="switchMapLayer('carto')">
              <span style="font-size:20px; margin-right:4px;">🗺️</span>
              <div style="text-align:left;">
                <b style="color:#0d9488; display:block;">スマートナビ (CARTO) 【推奨】</b>
                <span style="font-size:11px; color:#64748b;">道路や建物がくっきり見やすい</span>
              </div>
            </button>

            <button class="btn btn-white map-choice-btn" id="mapChoice_osm" style="justify-content:flex-start; padding:11px 14px; font-size:13px;" onclick="switchMapLayer('osm')">
              <span style="font-size:20px; margin-right:4px;">🚗</span>
              <div style="text-align:left;">
                <b style="color:#0f172a; display:block;">OpenStreetMap (標準)</b>
                <span style="font-size:11px; color:#64748b;">道路が太く店舗がカラフル</span>
              </div>
            </button>

            <button class="btn btn-white map-choice-btn" id="mapChoice_photo" style="justify-content:flex-start; padding:11px 14px; font-size:13px;" onclick="switchMapLayer('photo')">
              <span style="font-size:20px; margin-right:4px;">🛰️</span>
              <div style="text-align:left;">
                <b style="color:#0f172a; display:block;">航空写真 (リアル衛星画像)</b>
                <span style="font-size:11px; color:#64748b;">建物の形や駐車場がそのまま見える</span>
              </div>
            </button>

            <button class="btn btn-white map-choice-btn" id="mapChoice_pale" style="justify-content:flex-start; padding:11px 14px; font-size:13px;" onclick="switchMapLayer('pale')">
              <span style="font-size:20px; margin-right:4px;">🏢</span>
              <div style="text-align:left;">
                <b style="color:#0f172a; display:block;">白地図 (国土地理院 淡色)</b>
                <span style="font-size:11px; color:#64748b;">ピンとルート線が最も際立つ</span>
              </div>
            </button>

            <button class="btn btn-white map-choice-btn" id="mapChoice_std" style="justify-content:flex-start; padding:11px 14px; font-size:13px;" onclick="switchMapLayer('std')">
              <span style="font-size:20px; margin-right:4px;">🗾</span>
              <div style="text-align:left;">
                <b style="color:#0f172a; display:block;">国土地理院 (標準地図)</b>
                <span style="font-size:11px; color:#64748b;">従来の地形図</span>
              </div>
            </button>
          </div>
        </div>
      </div>
      </div>

      <!-- ================= 2択選択モーダル（画面最上部にフローティング配置） ================= -->
      <div id="select-next-modal">
        <div class="modal-content-card" id="modalCardBody">
          <!-- 動的書き換え -->
        </div>
      </div>

      <!-- ================= 配送先一覧選択モーダル (03. SEARCH) ================= -->
      <div id="all-destinations-modal">
        <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #e2e8f0; padding-bottom:12px;">
          <b style="font-size:17px; color:#0f172a; font-weight:800;">📋 配送先を一覧から選択</b>
          <button class="btn btn-white" style="padding:4px 10px; font-size:12px;" onclick="closeAllDestinationsModal()">✕ 閉じる</button>
        </div>

        <div class="dest-list-scroll" id="destListContainer"></div>
      </div>

    </div>
  </div>

  <!-- Leaflet JS (Cloudflare CDN) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
  <!-- Firebase SDK (v9 compat) -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <!-- LZString 高圧縮デコードライブラリ -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/lz-string/1.5.0/lz-string.min.js"></script>
  <script src="firebase-sync.js"></script>
  <script>
    // キャッシュ互換性用（古いキャッシュが残っている端末でのエラーを100%防止）
    window.hookMapTouchRotation = function() {};

    // --- Service Worker 強制更新 (v23) ---
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js?v=23').then((reg) => {
          reg.update();
        }).catch(err => console.log('SW registration failed:', err));
      });
    }

    // キャッシュクリア＆強制リロード関数
    window.forceClearCacheAndReload = async function() {
      if ('caches' in window) {
        const keys = await caches.keys();
        await Promise.all(keys.map(k => caches.delete(k)));
      }
      if ('serviceWorker' in navigator) {
        const registrations = await navigator.serviceWorker.getRegistrations();
        for (let r of registrations) { await r.unregister(); }
      }
      window.location.href = window.location.pathname + '?v=' + Date.now();
    };

    const STORAGE_KEY = 'navisystem_courses';
    const PROXIMITY_THRESHOLD_METERS = 100;

    let currentCourse = null;
    let currentTargetItem = null;
    let lastArrivedCoords = null;
    let map = null;
    let markers = [];
    let currentRouteLayer = null;

    let userCarMarker = null;
    let currentUserCoords = null;
    let shouldCenterOnUser = true;

    let isGpsRecording = false;
    let gpsWatchId = null;
    let recordedLogs = [];
    let currentLegLogs = [];
    let gpsPolyline = null;

    // --- コースデータ取得（週次配達表フォーマット基準） ---
    const SAMPLE_COURSES = [
      {
        id: 'course_505001_20260817',
        name: '【20260817週】コース 505001 (宅配御膳 田原本)',
        memo: '週次配達表 拠点50 / コース001',
        createdAt: new Date().toISOString(),
        items: [
          { id: 1, order: 1, name: "山本 様", address: "奈良県橿原市忌部町246", time: "指定なし", memo: "ピ 玄中 留守玄前", lat: 34.503200, lng: 135.772500, isDone: false },
          { id: 2, order: 2, name: "森本 様", address: "奈良県橿原市四条町673", time: "指定なし", memo: "ポスト下 雨天時ピ玄中", lat: 34.506500, lng: 135.782000, isDone: false },
          { id: 3, order: 3, name: "田中 様", address: "奈良県奈良市登大路町30", time: "午前中", memo: "置き配可（玄関前）", lat: 34.685062, lng: 135.832809, isDone: false },
          { id: 4, order: 4, name: "佐藤 様", address: "奈良県生駒市北新町10-38", time: "14:00-16:00", memo: "オートロック暗証1234", lat: 34.694481, lng: 135.697067, isDone: false }
        ]
      }
    ];

    function getCourses() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          if (Array.isArray(parsed) && parsed.length > 0) return parsed;
        }
      } catch (e) {}

      return SAMPLE_COURSES;
    }

    function saveCourses(courses) {
      if (!courses || courses.length === 0) return;
      localStorage.setItem(STORAGE_KEY, JSON.stringify(courses));
    }

    window.loadSampleToDriver = function() {
      saveCourses(SAMPLE_COURSES);
      refreshCourses();
    };

    // ☁️ クラウドから最新コースを強制取得して同期
    window.syncWithCloudDirect = async function() {
      if (window.fetchCoursesFromCloudDirect) {
        const cloudCourses = await fetchCoursesFromCloudDirect();
        if (cloudCourses && cloudCourses.length > 0) {
          saveCourses(cloudCourses);
          refreshCourses();
          alert(`✅ クラウドから最新 ${cloudCourses.length} 件のコースを受信・同期しました！`);
          return;
        }
      }
      refreshCourses();
      alert("📡 クラウドと通信しました。コース一覧を最新化しました。");
    };

    function refreshCourses() {
      const courses = getCourses();
      const container = document.getElementById('courseCardsContainer');
      if (!container) return;
      container.innerHTML = '';

      if (!courses || courses.length === 0) {
        container.innerHTML = `
          <div style="text-align:center; color:#64748b; margin-top:40px; padding:24px; background:#ffffff; border-radius:18px; border:1px solid #e2e8f0; box-shadow:0 4px 14px rgba(0,0,0,0.03);">
            📦 代配コースはまだありません。<br>
            <span style="font-size:12px; color:#94a3b8; display:block; margin:8px 0 14px;">PC管理画面でCSVを保存するか、「☁️ クラウド同期」を押してください。</span>
            <button class="btn btn-primary" style="font-size:13px; padding:8px 16px;" onclick="syncWithCloudDirect()">☁️ クラウドから取得</button>
          </div>
        `;
        return;
      }

      courses.forEach(course => {
        const doneCount = course.items.filter(i => i.isDone).length;
        const totalCount = course.items.length;
        const remainingCount = totalCount - doneCount;
        const percent = totalCount > 0 ? Math.round((doneCount / totalCount) * 100) : 0;
        const isAllDone = (doneCount === totalCount && totalCount > 0);

        const card = document.createElement('div');
        card.className = 'course-card-mobile';
        card.innerHTML = `
          <div style="display:flex; justify-content:space-between; align-items:flex-start;">
            <div class="course-title-mobile">${course.name}</div>
            <button class="btn btn-white" style="padding:2px 8px; font-size:11px; color:#64748b;" onclick="resetCourseStatus('${course.id}', event)">
              🔄 リセット
            </button>
          </div>
          <div class="course-desc-mobile">${course.memo || 'ルート配送'}</div>
          <div class="course-stats">
            <span>件数: <b style="color:#0f172a;">${totalCount}件</b></span>
            <span style="color:${isAllDone ? '#10b981' : '#0d9488'}; font-weight:800;">
              進捗: ${doneCount}/${totalCount} (${percent}%)
            </span>
          </div>
          <button class="btn ${isAllDone ? 'btn-green' : 'btn-primary'}" style="width:100%; font-size:15px; padding:13px;" onclick="startDeliveryWorkflow('${course.id}')">
            ${isAllDone ? '✅ 配達完了済（確認・再配送）' : `🚚 配送を開始する（残り ${remainingCount}件）`}
          </button>
        `;
        container.appendChild(card);
      });
    }

    window.resetCourseStatus = function(courseId, event) {
      if (event) event.stopPropagation();
      if (!confirm("このコースの配達完了状況をリセットして最初から配送しますか？")) return;
      const courses = getCourses();
      const target = courses.find(c => c.id === courseId);
      if (target) {
        target.items.forEach(i => i.isDone = false);
        saveCourses(courses);
        refreshCourses();
        alert("✅ 配達状況をリセットしました！");
      }
    };

    // --- 1. 配送開始（コース起動） ---
    window.startDeliveryWorkflow = function(courseId) {
      try {
        const courses = getCourses();
        currentCourse = courses.find(c => c.id === courseId);
        if (!currentCourse) return alert("コースが見つかりません");

        // 地点補正マスターを最新適用
        if (window.findCorrectedCoords) {
          currentCourse.items.forEach(item => {
            const master = findCorrectedCoords(item.address, item.name);
            if (master) {
              item.lat = master.lat;
              item.lng = master.lng;
              item.isCorrectedMaster = true;
            }
          });
        }

        currentCourse.items.sort((a, b) => (a.order || a.id) - (b.order || b.id));

        document.getElementById('view-course-select').style.display = 'none';
        document.getElementById('view-nav-main').style.display = 'flex';

        initMap();
        startContinuousGpsTracking();
        promptNextDestinationSelection(true);
      } catch (err) {
        console.error("startDeliveryWorkflow error:", err);
        alert("開始中にエラーが発生しました: " + err.message);
      }
    };

    window.exitToCourseSelect = function() {
      stopGpsTracking();
      clearActiveSessionState();
      document.getElementById('view-nav-main').style.display = 'none';
      document.getElementById('view-course-select').style.display = 'flex';
      refreshCourses();
    };

    // --- 2. 次の行き先を選択するプロンプト表示 ---
    function promptNextDestinationSelection(isFirst = false) {
      updateNavStats();
      const undoneItems = currentCourse.items.filter(i => !i.isDone);
      const modalCard = document.getElementById('modalCardBody');

      if (undoneItems.length === 0) {
        document.getElementById('transit-target-card').style.display = 'none';
        document.getElementById('select-next-modal').style.display = 'flex';
        modalCard.innerHTML = `
          <div class="modal-headline" style="color:#4ade80;">🎉 全件配達完了</div>
          <div class="modal-target-title" style="color:#4ade80; font-size:19px;">本日の配達はすべて完了しています</div>
          <div class="modal-target-addr">配達データは保持されています。一覧から選んで再配送や確認が可能です。</div>
          <button class="btn btn-primary" style="width:100%; font-size:14px; padding:12px; margin-bottom:8px;" onclick="openAllDestinationsModal()">
            📋 配送先一覧から選んで再度向かう
          </button>
          <button class="btn btn-slate" style="width:100%; font-size:13px; padding:10px;" onclick="resetCurrentCourseAndRestart()">
            🔄 全件を未配達にリセットして再配送
          </button>
        `;
        plotMarkers();
        return;
      }

      const nextDefault = undoneItems[0];
      modalCard.innerHTML = `
        <div class="modal-headline">${isFirst ? "【1件目の配送先を選択】" : "【次の配送先を選択】"}</div>
        <div class="modal-target-title">#${nextDefault.order || nextDefault.id} ${nextDefault.name} 様</div>
        <div class="modal-target-addr">${nextDefault.address}</div>
        <button class="btn btn-primary" style="width:100%; font-size:15px; padding:14px; margin-bottom:10px;" onclick="chooseNextSequentialTarget()">
          🚚 この順番通りに出発する
        </button>
        <button class="btn btn-slate" style="width:100%; font-size:14px; padding:12px;" onclick="openAllDestinationsModal()">
          📋 別の配送先を一覧から選ぶ
        </button>
      `;

      document.getElementById('select-next-modal').style.display = 'flex';
      document.getElementById('transit-target-card').style.display = 'none';
      plotMarkers();
    }

    window.resetCurrentCourseAndRestart = function() {
      if (!confirm("すべての配達先を未配達に戻して最初からやり直しますか？")) return;
      currentCourse.items.forEach(i => i.isDone = false);
      const courses = getCourses();
      const idx = courses.findIndex(c => c.id === currentCourse.id);
      if (idx !== -1) {
        courses[idx] = currentCourse;
        saveCourses(courses);
      }
      promptNextDestinationSelection(true);
    };

    window.chooseNextSequentialTarget = function() {
      const undoneItems = currentCourse.items.filter(i => !i.isDone);
      if (undoneItems.length === 0) return;
      setTargetAndBeginTransit(undoneItems[0]);
    };

    window.openAllDestinationsModal = function() {
      document.getElementById('select-next-modal').style.display = 'none';
      const container = document.getElementById('destListContainer');
      container.innerHTML = '';

      currentCourse.items.forEach(item => {
        const card = document.createElement('div');
        card.className = `dest-select-card ${item.isDone ? 'completed' : ''}`;
        const codeDisplay = item.code ? `<span style="font-size:11px; color:#64748b; background:#f1f5f9; padding:1px 5px; border-radius:4px; margin-right:4px;">[${item.code}]</span>` : '';
        card.innerHTML = `
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <b style="font-size:15px; font-weight:800; color:#0f172a;">#${item.order || item.id} ${codeDisplay}${item.name} 様</b>
            <span style="font-size:11px; padding:2px 8px; border-radius:10px; font-weight:700; background:${item.isDone ? '#10b981' : '#0d9488'}; color:#fff;">
              ${item.isDone ? '✅ 配達済' : '未配達'}
            </span>
          </div>
          <div style="font-size:12px; color:#64748b; margin:4px 0;">${item.address}</div>
          ${item.memo ? `<div style="font-size:11px; color:#d97706; font-weight:600;">📝 ${item.memo}</div>` : ''}
          <div style="display:flex; gap:6px; margin-top:10px;">
            <button class="btn btn-primary" style="flex:1; padding:8px; font-size:12px;" onclick="event.stopPropagation(); setTargetAndBeginTransitDirect(${item.id})">
              🚚 ここへ向かう
            </button>
            <button class="btn btn-white" style="padding:8px 12px; font-size:11px;" onclick="event.stopPropagation(); toggleItemDoneState(${item.id})">
              ${item.isDone ? '↩ 未完に戻す' : '✅ 完了にする'}
            </button>
          </div>
        `;
        card.onclick = () => {
          document.getElementById('all-destinations-modal').style.display = 'none';
          setTargetAndBeginTransit(item);
        };
        container.appendChild(card);
      });

      document.getElementById('all-destinations-modal').style.display = 'flex';
    };

    window.toggleItemDoneState = function(itemId) {
      const item = currentCourse.items.find(i => i.id === itemId);
      if (item) {
        item.isDone = !item.isDone;
        const courses = getCourses();
        const idx = courses.findIndex(c => c.id === currentCourse.id);
        if (idx !== -1) {
          courses[idx] = currentCourse;
          saveCourses(courses);
        }
        openAllDestinationsModal();
        plotMarkers();
        updateNavStats();
      }
    };

    window.closeAllDestinationsModal = function() {
      document.getElementById('all-destinations-modal').style.display = 'none';
      if (!currentTargetItem) {
        document.getElementById('select-next-modal').style.display = 'flex';
      }
    };

    window.openChangeDestinationModal = function() {
      openAllDestinationsModal();
    };

    // --- 3. 配送先を確定して移動・ナビ開始 ---
    window.setTargetAndBeginTransit = function(item) {
      currentTargetItem = item;
      saveActiveSessionState();
      document.getElementById('select-next-modal').style.display = 'none';
      document.getElementById('all-destinations-modal').style.display = 'none';
      document.getElementById('transit-target-card').style.display = 'block';

      document.getElementById('transitOrderNum').innerText = item.order || item.id;
      document.getElementById('transitName').innerText = `${item.name} 様`;
      document.getElementById('transitAddress').innerText = item.address;
      const addrLandEl = document.getElementById('transitAddressLandscape');
      if (addrLandEl) addrLandEl.innerText = `(${item.address})`;

      const memoInlineEl = document.getElementById('transitMemoInline');
      if (memoInlineEl) {
        if (item.memo) {
          memoInlineEl.style.display = 'inline-block';
          memoInlineEl.innerText = `📝 ${item.memo}`;
        } else {
          memoInlineEl.style.display = 'none';
        }
      }

      currentLegLogs = [];
      plotMarkers();

      checkProximityToTarget();
      calculateTransitRoute(item);
    };

    function checkProximityToTarget() {
      if (!currentTargetItem) return;

      const distTextEl = document.getElementById('distanceText');
      const distLandEl = document.getElementById('distanceTextLandscape');
      const badgeEl = document.getElementById('proximityStatusBadge');
      const arrivalBtn = document.getElementById('mainArrivalButton');

      let distMeters = null;
      if (currentUserCoords) {
        distMeters = map.distance([currentUserCoords.lat, currentUserCoords.lng], [currentTargetItem.lat, currentTargetItem.lng]);
      }

      let formattedDist = "測位中...";
      if (distMeters !== null) {
        if (distMeters < 1000) {
          formattedDist = `${Math.round(distMeters)} m`;
        } else {
          formattedDist = `${(distMeters / 1000).toFixed(1)} km`;
        }

        if (distMeters <= PROXIMITY_THRESHOLD_METERS) {
          badgeEl.innerText = "🎯 目的地付近！";
          badgeEl.style.color = "#4ade80";
          arrivalBtn.classList.add('near-pulse');
        } else {
          badgeEl.innerText = "案内中";
          badgeEl.style.color = "#94a3b8";
          arrivalBtn.classList.remove('near-pulse');
        }
      } else {
        badgeEl.innerText = "GPS接続中";
      }

      distTextEl.innerText = formattedDist;
      if (distLandEl) distLandEl.innerText = formattedDist;
    }

    async function calculateTransitRoute(targetItem) {
      if (currentUserCoords) {
        drawRouteLine(currentUserCoords.lng, currentUserCoords.lat, targetItem.lng, targetItem.lat);
      } else {
        navigator.geolocation.getCurrentPosition(async (pos) => {
          const fromLng = pos.coords.longitude;
          const fromLat = pos.coords.latitude;
          drawRouteLine(fromLng, fromLat, targetItem.lng, targetItem.lat);
        }, () => {
          if (lastArrivedCoords) {
            drawRouteLine(lastArrivedCoords.lng, lastArrivedCoords.lat, targetItem.lng, targetItem.lat);
          } else {
            map.setView([targetItem.lat, targetItem.lng], 16);
          }
        });
      }
    }

    // --- 地点位置修正（スマホ版） ---
    let isMapTapCorrectionActive = false;

    window.openLocationCorrectionModal = function() {
      if (!currentTargetItem) return;
      document.getElementById('location-correction-modal').style.display = 'block';
    };

    window.closeLocationCorrectionModal = function() {
      document.getElementById('location-correction-modal').style.display = 'none';
    };

    // 1. 現在地（GPS）で修正
    window.correctLocationWithCurrentGps = async function() {
      if (!currentUserCoords) {
        return alert("GPS測位中です。現在地を取得してから再度お試しください。");
      }
      closeLocationCorrectionModal();
      await applyLocationCorrection(currentUserCoords.lat, currentUserCoords.lng);
    };

    // 2. 地図タップで修正
    window.startMapTapCorrectionMode = function() {
      closeLocationCorrectionModal();
      isMapTapCorrectionActive = true;
      document.getElementById('map-tap-guide-bar').style.display = 'flex';
      map.getContainer().style.cursor = 'crosshair';
    };

    window.cancelMapTapCorrection = function() {
      isMapTapCorrectionActive = false;
      document.getElementById('map-tap-guide-bar').style.display = 'none';
      map.getContainer().style.cursor = '';
    };

    // 地点修正の適用＆マスター保存
    async function applyLocationCorrection(lat, lng) {
      if (!currentTargetItem) return;

      currentTargetItem.lat = lat;
      currentTargetItem.lng = lng;
      currentTargetItem.isCorrectedMaster = true;

      // 1. 地点補正マスターに保存（次回以降のCSVや他の配送でも永続自動適用）
      if (window.saveLocationCorrection) {
        await saveLocationCorrection(currentTargetItem.address, currentTargetItem.name, lat, lng);
      }

      // 2. コースデータを保存
      const courses = getCourses();
      const cIdx = courses.findIndex(c => c.id === currentCourse.id);
      if (cIdx !== -1) {
        courses[cIdx] = currentCourse;
        saveCourses(courses);
      }

      // 3. ルート再計算 & ピン再描画
      plotMarkers();
      calculateTransitRoute(currentTargetItem);
      checkProximityToTarget();

      alert(`🎯 #${currentTargetItem.order || currentTargetItem.id} ${currentTargetItem.name} 様の地点位置を修正し、【地点マスター】に登録しました！\n次回以降の配送でも、この正確な位置にピンが立ちます。`);
    }

    // --- マップ初期化 (高視認性 CARTO Voyager / OSM / 国土地理院 / 航空写真) ---
    const PREFERRED_MAP_KEY = 'lively_navi_preferred_map';
    let availableTileLayers = {};
    let currentTileLayerKey = 'carto';

    window.openMapSelectorModal = function() {
      document.getElementById('map-selector-modal').style.display = 'block';
    };

    window.closeMapSelectorModal = function() {
      document.getElementById('map-selector-modal').style.display = 'none';
    };

    window.switchMapLayer = function(key) {
      if (!availableTileLayers[key] || !map) return;

      // 現在のタイルレイヤーを削除して新しいタイルを追加
      Object.keys(availableTileLayers).forEach(k => {
        if (map.hasLayer(availableTileLayers[k])) {
          map.removeLayer(availableTileLayers[k]);
        }
      });

      availableTileLayers[key].addTo(map);
      currentTileLayerKey = key;
      localStorage.setItem(PREFERRED_MAP_KEY, key);

      // モーダル内のボタンスタイル更新
      document.querySelectorAll('.map-choice-btn').forEach(btn => {
        btn.style.borderColor = '#e2e8f0';
        btn.style.background = '#ffffff';
        const title = btn.querySelector('b');
        if (title) title.style.color = '#0f172a';
      });

      const selectedBtn = document.getElementById(`mapChoice_${key}`);
      if (selectedBtn) {
        selectedBtn.style.borderColor = '#0d9488';
        selectedBtn.style.background = '#f0fdfa';
        const title = selectedBtn.querySelector('b');
        if (title) title.style.color = '#0d9488';
      }

      closeMapSelectorModal();
    };

    function initMap() {
      if (!map) {
        // 1. CARTO Voyager (スマートナビ地図：視認性抜群・道路と建物がくっきり)
        availableTileLayers['carto'] = L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
          maxZoom: 19,
          subdomains: 'abcd',
          attribution: '© <a href="https://carto.com/">CARTO</a> © <a href="https://www.openstreetmap.org/">OSM</a>'
        });

        // 2. OpenStreetMap 標準
        availableTileLayers['osm'] = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
          maxZoom: 19,
          attribution: '© <a href="https://www.openstreetmap.org/">OpenStreetMap</a>'
        });

        // 3. 国土地理院 航空写真
        availableTileLayers['photo'] = L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/seamlessphoto/{z}/{x}/{y}.jpg', {
          maxZoom: 18,
          attribution: '© <a href="https://maps.gsi.go.jp/">国土地理院 航空写真</a>'
        });

        // 4. 国土地理院 淡色地図
        availableTileLayers['pale'] = L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/pale/{z}/{x}/{y}.png', {
          maxZoom: 18,
          attribution: '© <a href="https://maps.gsi.go.jp/">国土地理院</a>'
        });

        // 5. 国土地理院 標準地図
        availableTileLayers['std'] = L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/std/{z}/{x}/{y}.png', {
          maxZoom: 18,
          attribution: '© <a href="https://maps.gsi.go.jp/">国土地理院</a>'
        });

        const savedMapKey = localStorage.getItem(PREFERRED_MAP_KEY) || 'carto';
        currentTileLayerKey = availableTileLayers[savedMapKey] ? savedMapKey : 'carto';

        map = L.map('map', { 
          zoomControl: false,
          layers: [availableTileLayers[currentTileLayerKey]]
        }).setView([34.685062, 135.832809], 16);

        L.control.zoom({ position: 'topright' }).addTo(map);

        // ユーザーがドラッグ移動したら追従を一時停止
        map.on('dragstart', () => {
          shouldCenterOnUser = false;
        });

        // ユーザーが拡大・縮小したズームレベルを保持
        map.on('zoomend', () => {
          if (map) {
            // 現在のズーム倍率を維持
          }
        });

        // 地図タップによる地点修正
        map.on('click', async (e) => {
          if (!isMapTapCorrectionActive) return;
          cancelMapTapCorrection();
          const { lat, lng } = e.latlng;
          await applyLocationCorrection(lat, lng);
        });
      }

      handleScreenResize();
    }

    // 画面回転・リサイズ時の適正化（横向き・縦向きで画面いっぱいに広げる）
    function handleScreenResize() {
      if (!map) return;
      map.invalidateSize();
      if (currentUserCoords && shouldCenterOnUser) {
        map.setView([currentUserCoords.lat, currentUserCoords.lng], map.getZoom(), { animate: false });
      }
    }
    window.addEventListener('resize', handleScreenResize);
    window.addEventListener('orientationchange', () => {
      setTimeout(handleScreenResize, 100);
      setTimeout(handleScreenResize, 300);
    });

    window.centerOnUserLocation = function() {
      if (currentUserCoords && map) {
        shouldCenterOnUser = true;
        // ユーザーが変更したズームレベルを維持したまま現在地を中央に配置
        map.setView([currentUserCoords.lat, currentUserCoords.lng], map.getZoom(), { animate: true });
      } else {
        alert("GPS測位中です。少々お待ちください。");
      }
    };

    // --- 🎯 現在地マーカー（拡大・縮小したズームレベルを完全保持） ---
    function updateCarMarker(lat, lng) {
      const isFirstFix = !currentUserCoords;
      currentUserCoords = { lat, lng };
      if (!map) return;

      if (!userCarMarker) {
        const carHtml = `
          <div class="car-marker-container">
            <div class="car-pulse"></div>
            <div class="car-icon-body"></div>
          </div>
        `;
        const carIcon = L.divIcon({
          html: carHtml,
          className: 'custom-car-icon',
          iconSize: [32, 32],
          iconAnchor: [16, 16]
        });
        userCarMarker = L.marker([lat, lng], { icon: carIcon, zIndexOffset: 3000 }).addTo(map);
      } else {
        userCarMarker.setLatLng([lat, lng]);
      }

      if (shouldCenterOnUser || isFirstFix) {
        // 固定ズーム(16)で上書きせず、ユーザーが拡大・縮小した倍率を100%保持
        const currentZoom = isFirstFix ? 16 : map.getZoom();
        map.setView([lat, lng], currentZoom, { animate: false });
      }

      checkProximityToTarget();
    }

    async function drawRouteLine(lng1, lat1, lng2, lat2) {
      const url = `https://router.project-osrm.org/route/v1/driving/${lng1},${lat1};${lng2},${lat2}?overview=full&geometries=geojson`;
      try {
        const res = await fetch(url);
        const data = await res.json();
        if (data.routes && data.routes.length > 0) {
          if (currentRouteLayer) map.removeLayer(currentRouteLayer);
          currentRouteLayer = L.geoJSON(data.routes[0].geometry, {
            style: { color: '#0284c7', weight: 8, opacity: 0.95 }
          }).addTo(map);
          map.setView([lat1, lng1], map.getZoom(), { animate: false });
        }
      } catch (e) {
        map.setView([lat1, lng1], map.getZoom(), { animate: false });
      }
    }

    // --- 到着ボタン押下 ---
    window.onArrivalClick = function() {
      if (!currentTargetItem) return;

      currentTargetItem.isDone = true;
      lastArrivedCoords = { lat: currentTargetItem.lat, lng: currentTargetItem.lng };

      const courses = getCourses();
      const idx = courses.findIndex(c => c.id === currentCourse.id);
      if (idx !== -1) {
        courses[idx] = currentCourse;
        saveCourses(courses);
      }

      if (window.updateItemStatusToCloud && currentCourse) {
        updateItemStatusToCloud(currentCourse.id, currentTargetItem.id, true);
      }

      if (currentRouteLayer) {
        map.removeLayer(currentRouteLayer);
        currentRouteLayer = null;
      }

      alert(`✅ #${currentTargetItem.order || currentTargetItem.id} ${currentTargetItem.name} 様への配達が完了しました！`);
      currentTargetItem = null;
      clearActiveSessionState();

      promptNextDestinationSelection(false);
    };

    // --- セッション状態の自動保存・復元 ---
    const ACTIVE_STATE_KEY = 'lively_navi_active_state';

    function saveActiveSessionState() {
      if (currentCourse && currentTargetItem) {
        localStorage.setItem(ACTIVE_STATE_KEY, JSON.stringify({
          courseId: currentCourse.id,
          targetItemId: currentTargetItem.id
        }));
      }
    }

    function clearActiveSessionState() {
      localStorage.removeItem(ACTIVE_STATE_KEY);
    }

    window.openExternalGoogleMap = function() {
      if (!currentTargetItem) return;
      saveActiveSessionState();

      const url = `https://www.google.com/maps/dir/?api=1&destination=${currentTargetItem.lat},${currentTargetItem.lng}`;
      
      const win = window.open(url, '_blank', 'noopener,noreferrer');
      if (!win) {
        const link = document.createElement('a');
        link.href = url;
        link.target = '_blank';
        link.rel = 'noopener noreferrer';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      }
    };

    function updateNavStats() {
      if (!currentCourse || !currentCourse.items) return;
      const doneCount = currentCourse.items.filter(i => i.isDone).length;
      const totalCount = currentCourse.items.length;
      document.getElementById('navDeliveredCount').innerText = doneCount;
      document.getElementById('navTotalCount').innerText = totalCount;
    }

    // --- 🏁 配送先ピン描画（目的地はGマーク・Goalバッジ） ---
    function plotMarkers() {
      if (!map || !currentCourse) return;
      markers.forEach(m => map.removeLayer(m));
      markers = [];

      currentCourse.items.forEach((item) => {
        const isTarget = currentTargetItem && currentTargetItem.id === item.id;

        let iconHtml = '';
        let iconSize = [26, 26];
        let iconAnchor = [13, 13];

        if (isTarget) {
          // 🏁 目的地: 鮮やかな赤い「G」Goalバッジ！
          iconHtml = `
            <div class="goal-pin-container">
              <div class="goal-pin-badge">G</div>
              <div class="goal-pin-label">GOAL</div>
            </div>
          `;
          iconSize = [40, 50];
          iconAnchor = [20, 25];
        } else if (item.isDone) {
          // 配達完了: 緑の✔バッジ
          iconHtml = `<div class="dest-pin-badge done">✔</div>`;
          iconSize = [26, 26];
          iconAnchor = [13, 13];
        } else {
          // 未達: 配達順番号バッジ
          iconHtml = `<div class="dest-pin-badge">#${item.order || item.id}</div>`;
          iconSize = [26, 26];
          iconAnchor = [13, 13];
        }

        const customIcon = L.divIcon({
          html: iconHtml,
          className: 'custom-dest-pin-icon',
          iconSize: iconSize,
          iconAnchor: iconAnchor
        });

        const marker = L.marker([item.lat, item.lng], {
          icon: customIcon,
          zIndexOffset: isTarget ? 2000 : 500
        }).addTo(map);

        marker.bindPopup(`
          <div style="min-width:170px; font-size:12px; font-family:'Noto Sans JP',sans-serif;">
            <b style="font-size:14px; color:#0f172a;">#${item.order || item.id} ${item.name} 様</b><br>
            <span style="color:#64748b;">${item.address}</span><br>
            ${item.memo ? `<span style="color:#d97706; font-weight:600;">📝 ${item.memo}</span><br>` : ''}
            <div style="margin-top:8px;">
              <button class="btn btn-primary" style="width:100%; padding:6px; font-size:11px;" onclick="setTargetAndBeginTransitDirect(${item.id})">
                🚚 ここへ向かう
              </button>
            </div>
          </div>
        `);

        markers.push(marker);
      });
    }

    window.setTargetAndBeginTransitDirect = function(id) {
      const item = currentCourse.items.find(i => i.id === id);
      if (item) {
        map.closePopup();
        setTargetAndBeginTransit(item);
      }
    };

    // --- GPS追従 & クラウド自動送信 ---
    let lastCloudUploadTime = 0;

    function startContinuousGpsTracking() {
      if (!navigator.geolocation) return;
      isGpsRecording = true;
      recordedLogs = [];

      if (gpsPolyline) map.removeLayer(gpsPolyline);
      gpsPolyline = L.polyline([], { color: '#ef4444', weight: 4 }).addTo(map);

      gpsWatchId = navigator.geolocation.watchPosition((pos) => {
        const pt = { lat: pos.coords.latitude, lng: pos.coords.longitude, time: pos.timestamp };
        recordedLogs.push(pt);
        currentLegLogs.push(pt);
        gpsPolyline.addLatLng([pt.lat, pt.lng]);
        document.getElementById('gpsPointCount').innerText = recordedLogs.length;

        updateCarMarker(pt.lat, pt.lng);

        const now = Date.now();
        if (now - lastCloudUploadTime > 3000) {
          lastCloudUploadTime = now;
          if (window.updateDriverLocationToCloud) {
            updateDriverLocationToCloud('driver_main', {
              name: '担当ドライバー',
              courseId: currentCourse ? currentCourse.id : null,
              lat: pt.lat,
              lng: pt.lng
            });
          }
          if (window.appendGpsLogToCloud && currentCourse) {
            appendGpsLogToCloud(currentCourse.id, pt);
          }
        }
      }, (err) => {
        console.warn("GPS error:", err);
      }, { enableHighAccuracy: true, maximumAge: 2000, timeout: 10000 });
    }

    function stopGpsTracking() {
      if (gpsWatchId) navigator.geolocation.clearWatch(gpsWatchId);
      isGpsRecording = false;
    }

    // 初期化 & クラウドコース購読 & 運行セッション自動復元
    function initDriverApp() {
      // 📱 QRコード / 共有リンクからの自動インポート (#import=...)
      try {
        const hash = window.location.hash;
        if (hash && hash.includes('import=')) {
          const rawCompressed = hash.substring(hash.indexOf('import=') + 7);
          if (rawCompressed && window.LZString) {
            const decompressedJson = LZString.decompressFromEncodedURIComponent(rawCompressed);
            if (decompressedJson) {
              const importedCourse = JSON.parse(decompressedJson);
              if (importedCourse && importedCourse.items && importedCourse.items.length > 0) {
                let courses = getCourses();
                // 既存の同一IDまたは名前のコースを更新、なければ先頭追加
                const existingIdx = courses.findIndex(c => c.id === importedCourse.id || c.name === importedCourse.name);
                if (existingIdx !== -1) {
                  courses[existingIdx] = importedCourse;
                } else {
                  courses.unshift(importedCourse);
                }
                saveCourses(courses);
                alert(`🎉 QRコードからコース「${importedCourse.name}」（${importedCourse.items.length}件）を正常に取り込みました！`);
                history.replaceState(null, null, ' ');
              }
            }
          }
        }
      } catch (importErr) {
        console.warn("QR/Link import error:", importErr);
      }

      refreshCourses();

      try {
        const savedStateRaw = localStorage.getItem(ACTIVE_STATE_KEY);
        if (savedStateRaw) {
          const state = JSON.parse(savedStateRaw);
          const courses = getCourses();
          const targetCourse = courses.find(c => c.id === state.courseId);
          if (targetCourse) {
            const targetItem = targetCourse.items.find(i => i.id === state.targetItemId && !i.isDone);
            if (targetItem) {
              currentCourse = targetCourse;
              document.getElementById('view-course-select').style.display = 'none';
              document.getElementById('view-nav-main').style.display = 'flex';
              initMap();
              startContinuousGpsTracking();
              setTargetAndBeginTransit(targetItem);
              console.log("✅ Restored active transit session:", targetItem.name);
            }
          }
        }
      } catch (e) {
        console.warn("Restore state error:", e);
      }

      if (window.subscribeCoursesFromCloud) {
        subscribeCoursesFromCloud((cloudCourses) => {
          if (cloudCourses && cloudCourses.length > 0) {
            saveCourses(cloudCourses);
            if (!currentCourse) {
              refreshCourses();
            }
          }
        });
      }

      // 初回起動時の直接同期
      if (window.fetchCoursesFromCloudDirect) {
        fetchCoursesFromCloudDirect().then((cloudCourses) => {
          if (cloudCourses && cloudCourses.length > 0) {
            saveCourses(cloudCourses);
            if (!currentCourse) {
              refreshCourses();
            }
          }
        });
      }
    }

    // 画面回転・リサイズ時の地図再描画
    window.addEventListener('resize', () => {
      if (map) {
        setTimeout(() => map.invalidateSize(), 100);
        setTimeout(() => map.invalidateSize(), 300);
      }
    });
    window.addEventListener('orientationchange', () => {
      if (map) {
        setTimeout(() => map.invalidateSize(), 150);
        setTimeout(() => map.invalidateSize(), 400);
      }
    });

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initDriverApp);
    } else {
      initDriverApp();
    }
  </script>
</body>
</html>
