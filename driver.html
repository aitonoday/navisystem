<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>LIVELY NAVI - 代配コース</title>
  
  <!-- PWA設定 -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#042f2e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Lively Navi">
  <link rel="apple-touch-icon" href="logo.png">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
  
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      font-family: 'Plus Jakarta Sans', 'Noto Sans JP', -apple-system, sans-serif;
      background: #f8fafc;
      color: #0f172a;
      overflow: hidden;
      user-select: none;
    }
    #app-root {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* 共通ボタン */
    .btn {
      padding: 10px 14px;
      border: none;
      border-radius: 12px;
      font-weight: 700;
      cursor: pointer;
      font-size: 13px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      text-decoration: none;
    }
    .btn-primary {
      background: linear-gradient(135deg, #0d9488 0%, #059669 100%);
      color: #ffffff;
      box-shadow: 0 4px 14px rgba(13, 148, 136, 0.35);
    }
    .btn-primary:active { transform: scale(0.97); }

    .btn-blue {
      background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
      color: #ffffff;
      box-shadow: 0 4px 14px rgba(2, 132, 199, 0.3);
    }
    .btn-blue:active { transform: scale(0.97); }

    .btn-green {
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      color: #ffffff;
      box-shadow: 0 4px 14px rgba(16, 185, 129, 0.35);
    }
    .btn-green:active { transform: scale(0.97); }

    .btn-slate {
      background: rgba(255, 255, 255, 0.15);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(8px);
    }
    .btn-slate:active { background: rgba(255, 255, 255, 0.25); transform: scale(0.97); }

    .btn-white {
      background: #ffffff;
      color: #0f172a;
      border: 1px solid #e2e8f0;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
    }
    .btn-white:active { background: #f1f5f9; transform: scale(0.97); }

    /* 🎯 ナビポインター (現在地ブルードット・三角なし安定デザイン) */
    .car-marker-container {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .car-icon-body {
      width: 22px;
      height: 22px;
      background: #0284c7;
      border: 3.5px solid #ffffff;
      border-radius: 50%;
      box-shadow: 0 3px 10px rgba(2, 132, 199, 0.6), 0 0 0 2px rgba(2, 132, 199, 0.4);
      z-index: 10;
    }
    .car-pulse {
      position: absolute;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: rgba(2, 132, 199, 0.35);
      animation: pulseAnim 2s infinite ease-out;
      z-index: 1;
    }
    @keyframes pulseAnim {
      0% { transform: scale(0.4); opacity: 0.9; }
      100% { transform: scale(1.5); opacity: 0; }
    }

    /* 🏁 目的地 Goalバッジ マーカー */
    .goal-pin-container {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .goal-pin-badge {
      background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
      color: #ffffff;
      font-weight: 900;
      font-size: 13px;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2.5px solid #ffffff;
      box-shadow: 0 4px 12px rgba(220, 38, 38, 0.5);
      animation: goalBounce 1.5s infinite ease-in-out;
    }
    .goal-pin-label {
      background: #0f172a;
      color: #38bdf8;
      font-size: 9px;
      font-weight: 800;
      padding: 1px 5px;
      border-radius: 4px;
      margin-top: -2px;
      border: 1px solid rgba(255,255,255,0.2);
      white-space: nowrap;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
    }
    @keyframes goalBounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }

    /* 配達ピン (通常・完了) */
    .dest-pin-badge {
      background: #0d9488;
      color: #ffffff;
      font-weight: 800;
      font-size: 11px;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid #ffffff;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }
    .dest-pin-badge.done {
      background: #10b981;
      opacity: 0.85;
    }

    /* --- 画面1: コース選択画面 (HOME) --- */
    #view-course-select {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 20px 16px;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      background: linear-gradient(180deg, #f0fdfa 0%, #f8fafc 100%);
    }
    .app-header-hero {
      text-align: center;
      margin: 10px 0 20px;
    }
    .logo-badge-wrap {
      display: inline-block;
      background: #ffffff;
      padding: 8px 20px;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(13, 148, 136, 0.12);
      margin-bottom: 6px;
    }
    .app-subtitle {
      font-size: 13px;
      color: #0d9488;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .course-card-mobile {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 20px;
      padding: 18px;
      margin-bottom: 14px;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.05);
      transition: all 0.2s ease;
    }
    .course-title-mobile {
      font-size: 17px;
      font-weight: 800;
      color: #0f172a;
      letter-spacing: -0.3px;
    }
    .course-desc-mobile {
      font-size: 12px;
      color: #64748b;
      margin: 4px 0 12px;
    }
    .course-stats {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      margin-bottom: 14px;
      background: #f8fafc;
      padding: 10px 14px;
      border-radius: 12px;
      border: 1px solid #f1f5f9;
    }

    /* --- 画面2: 運行・ナビ画面 (NAVIGATION) --- */
    #view-nav-main {
      flex: 1;
      display: none;
      flex-direction: column;
      width: 100%;
      height: 100%;
      position: relative;
    }

    /* ナビ上部ヘッダーバー */
    #nav-header {
      background: #ffffff;
      padding: 8px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #e2e8f0;
      z-index: 1000;
      height: 50px;
    }

    /* メインマップエリア */
    #map-container {
      flex: 1;
      width: 100%;
      height: calc(100% - 50px);
      position: relative;
      background: #f1f5f9;
      overflow: hidden;
      position: relative;
    }
    #map {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      margin: 0;
      background: #f1f5f9;
      transform-origin: 50% 50%;
    }
    /* 🧭 ヘディングアップ時は対角線を完全カバー（160%）して四隅のグレー余白を100%排除 */
    #map.heading-up-active {
      width: 160% !important;
      height: 160% !important;
      top: -30% !important;
      left: -30% !important;
      transform-origin: 50% 50% !important;
      transition: transform 0.35s cubic-bezier(0.25, 1, 0.5, 1);
    }

    /* 🚚 02. NAVIGATION 公式デザイン HUDカード（画面最上部） */
    #transit-target-card {
      position: absolute;
      top: 8px;
      left: 8px;
      right: 8px;
      background: linear-gradient(135deg, #042f2e 0%, #0f172a 100%);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 16px;
      padding: 8px 12px;
      z-index: 1000;
      box-shadow: 0 10px 30px rgba(4, 47, 46, 0.4), 0 2px 6px rgba(0,0,0,0.2);
      color: #ffffff;
      animation: fadeIn 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* 縦向き（デフォルト）：きっちり3段レイアウト */
    .hud-info-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; gap: 8px; }
    .hud-title-group { display: flex; align-items: center; gap: 6px; overflow: hidden; flex: 1; }
    .hud-order-badge { background: linear-gradient(135deg, #0d9488 0%, #0f766e 100%); color: #fff; font-size: 11px; font-weight: 800; padding: 2px 7px; border-radius: 6px; white-space: nowrap; }
    .hud-name { font-size: 15px; font-weight: 900; color: #38bdf8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .hud-address-landscape { display: none; }
    .hud-status-group { display: flex; align-items: center; gap: 5px; }
    .hud-distance-landscape { display: none; }
    .hud-fix-btn {
      font-size: 10px;
      color: #94a3b8;
      background: rgba(255,255,255,0.12);
      padding: 2px 6px;
      border-radius: 4px;
      cursor: pointer;
      white-space: nowrap;
    }
    .hud-address-row-portrait { display: flex; justify-content: space-between; align-items: center; font-size: 11px; color: #cbd5e1; margin-bottom: 6px; gap: 8px; }
    .hud-actions-row { display: flex; gap: 6px; align-items: center; margin-bottom: 0; }


    /* 🧭 ヘディングアップ時のピン・マーカー逆回転（常に水平で読みやすさを維持） */
    #map.heading-up-active .custom-delivery-pin,
    #map.heading-up-active .leaflet-popup,
    #map.heading-up-active .gps-log-start-pin,
    #map.heading-up-active .gps-log-end-pin {
      transition: transform 0.35s cubic-bezier(0.25, 1, 0.5, 1);
      transform-origin: 50% 50%;
    }
    
    /* 🧭 コンパス（方位磁針）ボタン */
    .compass-btn {
      position: relative;
      border-radius: 50% !important;
      width: 48px !important;
      height: 48px !important;
      padding: 0 !important;
      box-shadow: 0 6px 18px rgba(15, 23, 42, 0.18) !important;
      background: #ffffff !important;
      border: 2px solid #cbd5e1 !important;
      display: flex !important;
      flex-direction: column !important;
      align-items: center !important;
      justify-content: center !important;
      cursor: pointer;
      overflow: hidden;
      transition: all 0.2s;
    }
    .compass-btn.active-heading {
      border-color: #0284c7 !important;
      background: #f0f9ff !important;
      box-shadow: 0 6px 20px rgba(2, 132, 199, 0.35) !important;
    }
    .compass-needle-icon {
      width: 24px;
      height: 24px;
      transition: transform 0.3s cubic-bezier(0.25, 1, 0.5, 1);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .compass-mode-label {
      font-size: 8px;
      font-weight: 900;
      color: #64748b;
      margin-top: -2px;
      line-height: 1;
    }
    .compass-btn.active-heading .compass-mode-label {
      color: #0284c7;
    }

    /* 📱 横向き（Landscape）最適化：超スリムな完全1段（1行）レイアウト */
    @media (orientation: landscape) {
      #nav-header {
        height: 36px;
        padding: 3px 12px;
      }
      #map-container {
        height: calc(100% - 36px);
      }
      #transit-target-card {
        top: 6px;
        left: 8px;
        right: 8px;
        padding: 6px 12px;
        border-radius: 14px;
        box-shadow: 0 8px 24px rgba(4, 47, 46, 0.45);
        display: flex !important;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
      }
      /* 1段目（左側情報エリア） */
      .hud-info-row {
        flex: 1;
        margin-bottom: 0;
        gap: 8px;
        overflow: hidden;
      }
      .hud-title-group {
        gap: 6px;
      }
      .hud-name {
        font-size: 14px;
      }
      .hud-address-landscape {
        display: inline-block;
        font-size: 11px;
        color: #cbd5e1;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 24vw;
        margin-left: 4px;
      }
      .hud-distance-landscape {
        display: inline-block;
        font-size: 11px;
        padding: 2px 6px;
        white-space: nowrap;
        color: #38bdf8;
        font-weight: 800;
        background: rgba(0,0,0,0.3);
        border-radius: 6px;
      }
      #tracking-indicator {
        font-size: 9px;
        padding: 1px 6px;
      }
      .hud-address-row-portrait {
        display: none !important;
      }
      /* 2段目（右側ボタンエリア）: 横一列に統合 */
      .hud-actions-row {
        margin-bottom: 0;
        gap: 6px;
        flex-shrink: 0;
      }
      .hud-actions-row .btn {
        padding: 6px 10px !important;
        font-size: 11px !important;
        border-radius: 8px !important;
        white-space: nowrap;
      }
      #btnRecenterLocation {
        bottom: 10px;
        right: 10px;
        width: 38px;
        height: 38px;
        font-size: 16px;
      }
    }

    /* 2択選択モーダル（フローティングカード） */
    #select-next-modal {
      position: absolute;
      top: 10px;
      left: 10px;
      right: 10px;
      z-index: 1500;
      display: none;
      pointer-events: none;
      animation: fadeIn 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .modal-content-card {
      pointer-events: auto;
      background: linear-gradient(135deg, #042f2e 0%, #0f172a 100%);
      border: 1.5px solid #14b8a6;
      border-radius: 20px;
      padding: 16px 18px;
      box-shadow: 0 16px 40px rgba(0,0,0,0.5);
      color: #ffffff;
    }
    .modal-headline {
      font-size: 11px;
      color: #94a3b8;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      margin-bottom: 4px;
    }
    .modal-target-title {
      font-size: 20px;
      font-weight: 900;
      color: #38bdf8;
      margin-bottom: 4px;
      line-height: 1.3;
    }
    .modal-target-addr {
      font-size: 13px;
      color: #cbd5e1;
      margin-bottom: 16px;
    }

    /* 配送先選択リストモーダル (03. SEARCH風) */
    #all-destinations-modal {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: #f8fafc;
      z-index: 2100;
      display: none;
      flex-direction: column;
      padding: 16px;
    }
    .dest-list-scroll {
      flex: 1;
      overflow-y: auto;
      margin: 14px 0;
      -webkit-overflow-scrolling: touch;
    }
    .dest-select-card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      padding: 14px;
      margin-bottom: 10px;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0,0,0,0.03);
      transition: all 0.2s;
    }
    .dest-select-card:active { background: #f1f5f9; }
    .dest-select-card.completed {
      background: #f0fdf4;
      border-color: #86efac;
    }

    /* GPS記録中インジケータ */
    #tracking-indicator {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: rgba(239, 68, 68, 0.2);
      border: 1px solid rgba(239, 68, 68, 0.4);
      padding: 2px 8px;
      border-radius: 20px;
      font-size: 10px;
      color: #fca5a5;
      font-weight: 700;
    }
  </style>
</head>
<body>

  <div id="app-root">
    <!-- ================= 画面1: コース選択画面 (HOME) ================= -->
    <div id="view-course-select">
      <div class="app-header-hero">
        <div class="logo-badge-wrap">
          <img src="logo.svg" alt="LIVELY NAVI" style="max-width: 190px; width: 100%; height: auto; display: block;">
        </div>
        <div class="app-subtitle">Move Lively, Arrive Happy.</div>
      </div>

      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;">
        <b style="font-size:17px; font-weight:900; color:#0f172a; display:flex; align-items:center; gap:6px;">🚚 代配コース</b>
        <div style="display:flex; gap:6px;">
          <button class="btn btn-primary" style="padding:6px 12px; font-size:12px; font-weight:800;" onclick="syncWithCloudDirect()">☁️ クラウド同期</button>
          <button class="btn btn-white" style="padding:6px 10px; font-size:12px; color:#0d9488; font-weight:700;" onclick="forceClearCacheAndReload()">⚡ 最新化</button>
        </div>
      </div>

      <div id="courseCardsContainer">
        <!-- コースカード動的挿入 -->
      </div>
    </div>

    <!-- ================= 画面2: 運行・ナビ画面 (NAVIGATION) ================= -->
    <div id="view-nav-main">
      <!-- 上部ヘッダー -->
      <div id="nav-header">
        <button class="btn btn-white" style="padding:6px 10px; font-size:12px;" onclick="exitToCourseSelect()">
          ◀ コース一覧
        </button>
        <button id="toggleRouteLineBtn" class="btn btn-white" style="padding:5px 9px; font-size:12px; font-weight:700; color:#64748b; border-color:#cbd5e1; background:#ffffff;" onclick="toggleRouteLineVisibility()">
          🛣️ ルート: OFF
        </button>
        <button class="btn btn-white" style="padding:5px 10px; font-size:12px; font-weight:700; color:#0f172a; border-color:#cbd5e1;" onclick="openMapSelectorModal()">
          🗺️ 地図変更
        </button>
        <div style="font-size:12px; color:#0d9488; font-weight:800; background:#f0fdfa; border:1px solid #ccfbf1; padding:3px 8px; border-radius:12px;">
          <span id="navDeliveredCount">0</span>/<span id="navTotalCount">0</span> 完了
        </div>
      </div>

      <!-- マップコンテナ -->
      <div id="map-container">
        <!-- 🚚 02. NAVIGATION 公式デザイン HUDカード（画面最上部） -->
        <div id="transit-target-card" style="display:none;">
          <!-- 1段目: 宛名・順番 ＋ GPS ＋ 地点修正リンク -->
          <div class="hud-info-row">
            <div class="hud-title-group">
              <span class="hud-order-badge">
                <span id="transitOrderNum">1</span>
              </span>
              <span class="hud-name" id="transitName">宛名</span>
              <span class="hud-address-landscape" id="transitAddressLandscape">住所</span>
            </div>
            <div class="hud-status-group">
              <span class="hud-distance hud-distance-landscape" id="distanceTextLandscape">-- m</span>
              <div id="tracking-indicator">
                🔴 GPS (<span id="gpsPointCount">0</span>)
              </div>
              <span class="hud-fix-btn" onclick="openLocationCorrectionModal()">📍位置修正</span>
            </div>
          </div>

          <!-- 2段目（縦向き専用）: 住所 ＋ メモ ＋ 残り距離（横向きでは1段目に統合されるため非表示） -->
          <div class="hud-address-row-portrait">
            <div style="flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; display:flex; align-items:center; gap:6px;">
              <span id="transitAddress" style="overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">住所</span>
              <span id="transitMemoInline" style="display:none; color:#f59e0b; font-weight:700; font-size:10px; background:rgba(245,158,11,0.15); padding:1px 5px; border-radius:4px; white-space:nowrap;">📝</span>
            </div>
            <span class="hud-distance" id="distanceText" style="white-space:nowrap; color:#38bdf8; font-weight:800; background:rgba(0,0,0,0.3); padding:1px 8px; border-radius:6px; font-size:11px;">-- m</span>
            <span id="proximityStatusBadge" style="display:none;">案内中</span>
          </div>

          <!-- 3段目（縦向き時） / 2段目（横向き時）: 登録到着・到着・Gマップ・変更 -->
          <div class="hud-actions-row" style="display:flex; gap:6px;">

    // キャッシュ互換性用（古いキャッシュが残っている端末でのエラーを100%防止）

    // --- Service Worker 強制更新 (v44) ---

    // --- 4つの起点マスター（拠点データ） ---
    const DEPOT_LOCATIONS = [
      { id: 'tawaramoto', name: '田原本拠点', address: '奈良県磯城郡田原本町味間10-1', lat: 34.5379282, lng: 135.8131707, code: '50' },
      { id: 'nara', name: '奈良拠点', address: '奈良県奈良市七条東町4-21', lat: 34.6626997, lng: 135.7864145, code: '10' },
      { id: 'oji', name: '王寺拠点', address: '奈良県北葛城郡王寺町畠田8丁目1750-1', lat: 34.5784301, lng: 135.7038646, code: '20' },
      { id: 'ikoma', name: '生駒拠点', address: '奈良県生駒市東生駒1丁目307', lat: 34.6920197, lng: 135.7097433, code: '30' }
    ];
    let selectedDepot = DEPOT_LOCATIONS[0];
    let pendingStartCourseId = null;

    // キャッシュクリア＆強制リロード関数
    window.forceClearCacheAndReload = async function() {
      if ('caches' in window) {
        const keys = await caches.keys();
        await Promise.all(keys.map(k => caches.delete(k)));
      }
      if ('serviceWorker' in navigator) {
        const registrations = await navigator.serviceWorker.getRegistrations();
        for (let r of registrations) { await r.unregister(); }
      }
      window.location.href = window.location.pathname + '?v=' + Date.now();
    };

    const STORAGE_KEY = 'navisystem_courses';
    // 🎯 スマート近接オートズーム設定（50m手前で超詳細倍率へ自動拡大）
    const PROXIMITY_THRESHOLD_METERS = 50; 
    const CRUISE_ZOOM_LEVEL = 16;          // 巡航時のズーム倍率
    const APPROACH_ZOOM_LEVEL = 19;        // 50m以内接近時の超詳細ズーム倍率（建物・進入路確認）
    let isApproachingTarget = false;

    let currentCourse = null;
    let currentTargetItem = null;
    let lastFinishedOrder = 0;
    let lastArrivedCoords = null;
    let map = null;
    let markers = [];
    let currentRouteLayer = null;
    let registeredLegPolyline = null; // 登録済み区間軌跡（赤色の丸ドット点線）
    let currentLegFromOrder = 0; // 今回の区間の出発地点オーダー番号

    let isRouteLineVisible = false; // 起動時は常に完全 OFF

    // 🧭 ヘディングアップ / ノースアップ 設定
    const HEADING_MODE_KEY = 'lively_navi_heading_mode';
    let headingMode = localStorage.getItem(HEADING_MODE_KEY) || 'north-up'; // 'north-up' または 'heading-up'
    let currentHeading = 0; // 現在の方位角（0〜360度）
    let lastHeadingCoords = null; // 直前GPS座標

    let userCarMarker = null;
    let currentUserCoords = null;
    let shouldCenterOnUser = true;

    let isGpsRecording = false;
    let gpsWatchId = null;
    let recordedLogs = [];
    let currentLegLogs = [];
    let gpsPolyline = null; // 今回通った軌跡（薄い黄色の丸ドット点線）

    // 🧭 ヘディングアップ / ノースアップ 切替
    window.toggleHeadingMode = function() {
      if (headingMode === 'north-up') {
        headingMode = 'heading-up';
      } else {
        headingMode = 'north-up';
      }
      localStorage.setItem(HEADING_MODE_KEY, headingMode);
      updateHeadingModeUi();

      const mapEl = document.getElementById('map');
      if (mapEl) {
        if (headingMode === 'heading-up') {
          mapEl.classList.add('heading-up-active');
        } else {
          mapEl.classList.remove('heading-up-active');
        }
      }

      if (map) {
        map.invalidateSize();
        if (currentUserCoords && shouldCenterOnUser) {
          map.setView([currentUserCoords.lat, currentUserCoords.lng], map.getZoom(), { animate: false });
        }
      }

      updateMapHeading(currentHeading);
    };

    function updateHeadingModeUi() {
      const btn = document.getElementById('btnToggleHeadingMode');
      const text = document.getElementById('compassModeText');
      if (!btn || !text) return;

      if (headingMode === 'heading-up') {
        btn.classList.add('active-heading');
        text.innerText = '進行方向';
        text.style.color = '#0284c7';
      } else {
        btn.classList.remove('active-heading');
        text.innerText = '北上固定';
        text.style.color = '#64748b';
      }
    }

    // 🧭 地図の回転＆コンパス針のリアルタイム同期（中央中心で滑らかに回転）
    function updateMapHeading(heading) {
      if (isNaN(heading)) return;
      currentHeading = heading;

      const mapEl = document.getElementById('map');
      const compassNeedle = document.getElementById('compassNeedleIcon');

      if (headingMode === 'heading-up') {
        if (mapEl) {
          mapEl.classList.add('heading-up-active');
          // #map全体を画面中央(50% 50%)中心に回転
          mapEl.style.transform = `rotate(${-heading}deg)`;
        }
        // 配達先ピン・文字（逆回転して常に水平・正立を保つ）
        document.querySelectorAll('.custom-delivery-pin, .gps-log-start-pin, .gps-log-end-pin, .leaflet-popup').forEach(el => {
          el.style.transform = `rotate(${heading}deg)`;
        });
        // 車両マーカーは進行方向固定（画面上向き）
        const carMarkerEl = document.querySelector('.car-marker-container');
        if (carMarkerEl) {
          carMarkerEl.style.transform = 'rotate(0deg)';
        }
        // コンパス針は実際の北を指す
        if (compassNeedle) {
          compassNeedle.style.transform = `rotate(${-heading}deg)`;
        }
      } else {
        if (mapEl) {
          mapEl.classList.remove('heading-up-active');
          mapEl.style.transform = 'none';
        }
        document.querySelectorAll('.custom-delivery-pin, .gps-log-start-pin, .gps-log-end-pin, .leaflet-popup').forEach(el => {
          el.style.transform = 'none';
        });
        const carMarkerEl = document.querySelector('.car-marker-container');
        if (carMarkerEl) {
          carMarkerEl.style.transform = `rotate(${heading}deg)`;
        }
        if (compassNeedle) {
          compassNeedle.style.transform = 'rotate(0deg)';
        }
      }
    }

    // 2点間の球面方位角（Bearing）を算出（0〜360度）
    function calculateBearing(lat1, lon1, lat2, lon2) {
      const toRad = Math.PI / 180;
      const toDeg = 180 / Math.PI;
      const y = Math.sin((lon2 - lon1) * toRad) * Math.cos(lat2 * toRad);
      const x = Math.cos(lat1 * toRad) * Math.sin(lat2 * toRad) -
                Math.sin(lat1 * toRad) * Math.cos(lat2 * toRad) * Math.cos((lon2 - lon1) * toRad);
      let brng = Math.atan2(y, x) * toDeg;
      return (brng + 360) % 360;
    }

    window.toggleRouteLineVisibility = function() {
      isRouteLineVisible = !isRouteLineVisible;
      updateRouteLineBtnUi();

      if (!isRouteLineVisible) {
        if (currentRouteLayer && map) {
          map.removeLayer(currentRouteLayer);
          currentRouteLayer = null;
        }
      } else {
        if (currentTargetItem) {
          calculateTransitRoute(currentTargetItem);
        }
      }
    };

    function updateRouteLineBtnUi() {
      const btn = document.getElementById('toggleRouteLineBtn');
      if (!btn) return;
      if (isRouteLineVisible) {
        btn.innerHTML = '🛣️ ルート: ON';
        btn.style.color = '#0284c7';
        btn.style.borderColor = '#bae6fd';
        btn.style.background = '#f0f9ff';
      } else {
        btn.innerHTML = '🛣️ ルート: OFF';
        btn.style.color = '#64748b';
        btn.style.borderColor = '#cbd5e1';
        btn.style.background = '#ffffff';
      }
    }

    // --- コースデータ取得（週次配達表フォーマット基準） ---
    const SAMPLE_COURSES = [
      {
        id: 'sample_today',
        name: '【20260817週】コース 50001 (50)',
        memo: '田原本拠点発着 ルート配送',
        items: []
      }
    ];

    function getCourses() {
      const json = localStorage.getItem(STORAGE_KEY);
      if (json) {
        try {
          return JSON.parse(json);
        } catch (e) {
          console.error("Course parse error:", e);
        }
      }
      return SAMPLE_COURSES;
    }

    function saveCourses(courses) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(courses));
    }

    // ☁️ クラウドから最新コースを強制取得して同期
    window.syncWithCloudDirect = async function() {
      if (window.fetchCoursesFromCloudDirect) {
        const cloudCourses = await fetchCoursesFromCloudDirect();
        if (cloudCourses && cloudCourses.length > 0) {
          saveCourses(cloudCourses);
          refreshCourses();
          alert(`✅ クラウドから最新 ${cloudCourses.length} 件のコースを受信・同期しました！`);
          return;
        }
      }
      refreshCourses();
      alert("📡 クラウドと通信しました。コース一覧を最新化しました。");
    };

    function refreshCourses() {
      const courses = getCourses();
      const container = document.getElementById('courseCardsContainer');
      if (!container) return;
      container.innerHTML = '';

      if (!courses || courses.length === 0) {
        container.innerHTML = `
          <div style="text-align:center; color:#64748b; margin-top:40px; padding:24px; background:#ffffff; border-radius:18px; border:1px solid #e2e8f0; box-shadow:0 4px 14px rgba(0,0,0,0.03);">
            📦 代配コースはまだありません。<br>
            <span style="font-size:12px; color:#94a3b8; display:block; margin:8px 0 14px;">PC管理画面でCSVを保存するか、「☁️ クラウド同期」を押してください。</span>
            <button class="btn btn-primary" style="font-size:13px; padding:8px 16px;" onclick="syncWithCloudDirect()">☁️ クラウドから取得</button>
          </div>
        `;
        return;
      }

      courses.forEach(course => {
        // 配達先実件数（起点・帰着を除く）
        const realItems = (course.items || []).filter(i => !i.isDepot);
        const doneCount = realItems.filter(i => i.isDone).length;
        const totalCount = realItems.length;
        const remainingCount = totalCount - doneCount;
        const percent = totalCount > 0 ? Math.round((doneCount / totalCount) * 100) : 0;
        const isAllDone = (doneCount === totalCount && totalCount > 0);

        const card = document.createElement('div');
        card.className = 'course-card-mobile';
        card.innerHTML = `
          <div style="display:flex; justify-content:space-between; align-items:flex-start;">
            <div class="course-title-mobile">${course.name}</div>
            <button class="btn btn-white" style="padding:2px 8px; font-size:11px; color:#64748b;" onclick="resetCourseStatus('${course.id}', event)">
              🔄 リセット
            </button>
          </div>
          <div class="course-desc-mobile">${course.memo || 'ルート配送'}</div>
          <div class="course-stats">
            <span>件数: <b style="color:#0f172a;">${totalCount}件</b></span>
            <span style="color:${isAllDone ? '#10b981' : '#0d9488'}; font-weight:800;">
              進捗: ${doneCount}/${totalCount} (${percent}%)
            </span>
          </div>
          <button class="btn ${isAllDone ? 'btn-green' : 'btn-primary'}" style="width:100%; font-size:15px; padding:13px;" onclick="openDepotSelectModal('${course.id}')">
            ${isAllDone ? '✅ 配達完了済（確認・再配送）' : `🚚 起点を選んで配送開始（残り ${remainingCount}件）`}
          </button>
        `;
        container.appendChild(card);
      });
    }

    // --- 起点（出発・帰還拠点）選択モーダルの処理 ---
    window.openDepotSelectModal = function(courseId) {
      pendingStartCourseId = courseId;
      const courses = getCourses();
      const course = courses.find(c => c.id === courseId);

      // コース名から拠点を自動推定（初期選択）
      let defaultDepot = DEPOT_LOCATIONS[0];
      if (course && course.name) {
        if (course.name.includes('50') || course.name.includes('田原本')) defaultDepot = DEPOT_LOCATIONS[0];
        else if (course.name.includes('10') || course.name.includes('奈良')) defaultDepot = DEPOT_LOCATIONS[1];
        else if (course.name.includes('20') || course.name.includes('王寺')) defaultDepot = DEPOT_LOCATIONS[2];
        else if (course.name.includes('30') || course.name.includes('生駒')) defaultDepot = DEPOT_LOCATIONS[3];
      }
      selectedDepot = defaultDepot;

      renderDepotOptions();
      document.getElementById('depot-select-modal').style.display = 'flex';
    };

    function renderDepotOptions() {
      const container = document.getElementById('depotOptionsContainer');
      container.innerHTML = '';

      DEPOT_LOCATIONS.forEach(depot => {
        const isSelected = selectedDepot.id === depot.id;
        const card = document.createElement('div');
        card.style.cssText = `
          padding: 12px 14px;
          border: 2px solid ${isSelected ? '#0d9488' : '#e2e8f0'};
          background: ${isSelected ? '#f0fdfa' : '#ffffff'};
          border-radius: 14px;
          cursor: pointer;
          display: flex;
          justify-content: space-between;
          align-items: center;
          transition: all 0.2s;
        `;
        card.innerHTML = `
          <div>
            <div style="font-weight: 800; font-size: 15px; color: ${isSelected ? '#0f766e' : '#0f172a'}; display: flex; align-items: center; gap: 6px;">
              🏢 ${depot.name} ${isSelected ? '<span style="background:#0d9488; color:#fff; font-size:10px; padding:2px 6px; border-radius:10px;">選択中</span>' : ''}
            </div>
            <div style="font-size: 12px; color: #64748b; margin-top: 3px;">📍 ${depot.address}</div>
          </div>
          <div style="font-size: 18px;">${isSelected ? '🔘' : '⚪'}</div>
        `;
        card.onclick = () => {
          selectedDepot = depot;

        };
        container.appendChild(card);
      });
      document.getElementById('confirmDepotStartBtn').innerText = `🚀 ${selectedDepot.name}から出発して配送開始`;
    }

    window.closeDepotSelectModal = function() {
      document.getElementById('depot-select-modal').style.display = 'none';
      pendingStartCourseId = null;
    };

    window.confirmDepotAndStart = function() {
      if (!pendingStartCourseId) return;
      const courseId = pendingStartCourseId;
      const depot = selectedDepot;
      closeDepotSelectModal();
      startDeliveryWorkflow(courseId, depot);
    };

    window.resetCourseStatus = function(courseId, event) {
      if (event) event.stopPropagation();
      if (!confirm("このコースの配達完了状況をリセットして最初から配送しますか？")) return;
      const courses = getCourses();
      const target = courses.find(c => c.id === courseId);
      if (target) {
        target.items.forEach(i => i.isDone = false);
        saveCourses(courses);
        refreshCourses();
        alert("✅ 配達状況をリセットしました！");
      }
    };

    // --- 1. 配送開始（コース起動） ---
    window.startDeliveryWorkflow = function(courseId, depot = selectedDepot) {
      try {
        const courses = getCourses();
        currentCourse = courses.find(c => c.id === courseId);
        if (!currentCourse) return alert("コースが見つかりません");

        // 1. 顧客コード主キーで地点マスターを最新適用
        currentCourse.items.forEach(item => {
          if (item.code && window.findCustomerLocation) {
            const master = findCustomerLocation(item.code);
            if (master) {
              item.lat = master.lat;
              item.lng = master.lng;
              item.isCorrectedMaster = true;
            }
          }
        });

        // 起点・帰着アイテムをコースへ確実に統合
        const realItems = currentCourse.items.filter(i => !i.isDepot);
        realItems.forEach((it, idx) => {
          it.order = idx + 1; // 1件目〜N件目
        });

        const depotCode = depot.code ? (`DEPOT_${depot.code}`) : (`DEPOT_${depot.id}`);

        const startDepotItem = {
          id: 'depot_start_' + depot.id,
          order: 0,
          code: depotCode,
          name: `【起点】${depot.name}`,
          address: depot.address,
          lat: depot.lat,
          lng: depot.lng,
          isDone: true, // 出発時は完了扱い
          isDepot: true,
          isStartDepot: true,
          memo: '出発拠点'
        };

        const returnDepotItem = {
          id: 'depot_return_' + depot.id,
          order: realItems.length + 1,
          code: depotCode,
          name: `【帰着】${depot.name}`,
          address: depot.address,
          lat: depot.lat,
          lng: depot.lng,
          isDone: false, // 最終帰着
          isDepot: true,
          isReturnDepot: true,
          memo: '最終帰還拠点'
        };

        currentCourse.items = [startDepotItem, ...realItems, returnDepotItem];
        currentCourse.depot = depot;
        currentLegFromCode = depotCode;
        currentLegFromOrder = 0;

        // 完了済み地点から lastFinishedOrder を自動算出
        const doneItems = currentCourse.items.filter(i => i.isDone);
        if (doneItems.length > 0) {
          lastFinishedOrder = Math.max(...doneItems.map(i => (i.order !== undefined && i.order !== null) ? Number(i.order) : Number(i.id)));
        } else {
          lastFinishedOrder = 0;
        }

        document.getElementById('view-course-select').style.display = 'none';
        document.getElementById('view-nav-main').style.display = 'flex';

        // 🛣️ 配送開始時は常に「ルート案内: OFF」からスタート
        isRouteLineVisible = false;
        updateRouteLineBtnUi();

        initMap();
        startContinuousGpsTracking();
        promptNextDestinationSelection(true);
      } catch (err) {
        console.error("startDeliveryWorkflow error:", err);
        alert("開始中にエラーが発生しました: " + err.message);
      }
    };

    window.exitToCourseSelect = function() {
      stopGpsTracking();
      clearActiveSessionState();
      document.getElementById('view-nav-main').style.display = 'none';
      document.getElementById('view-course-select').style.display = 'flex';
      refreshCourses();
    };

    // 直前配送地点以降の未配達を優先案内するスマート判定
    function getNextRecommendedTarget() {
      if (!currentCourse || !currentCourse.items || currentCourse.items.length === 0) return null;

      // 1. 直前に配送/完了した地点(lastFinishedOrder) より後ろの順番にある「未配達」地点を最優先で探す！
      if (lastFinishedOrder > 0) {
        const futureUndone = currentCourse.items.filter(i => {
          const itemOrder = (i.order !== undefined && i.order !== null) ? Number(i.order) : Number(i.id);
          return !i.isDone && itemOrder > lastFinishedOrder;
        });
        if (futureUndone.length > 0) {
          // 例: #3 (C地点) 完了後 ➔ #4 (D地点) を優先案内！
          return futureUndone[0];
        }
      }

      // 2. 後ろの順番がすべて完了している場合は、飛ばして残っている未配達（前の順番）を探す
      const allUndone = currentCourse.items.filter(i => !i.isDone);
      if (allUndone.length > 0) {
        return allUndone[0];
      }

      return null;
    }

        <div class="modal-target-title">${orderDisplay} ${nameDisplay}</div>

    window.resetCurrentCourseAndRestart = function() {
      if (!confirm("すべての配達先を未配達に戻して最初からやり直しますか？")) return;
      lastFinishedOrder = 0;
      currentCourse.items.forEach(i => {
        if (!i.isDepot || i.code === 'RETURN') i.isDone = false;
      });
      const courses = getCourses();
      const idx = courses.findIndex(c => c.id === currentCourse.id);
      if (idx !== -1) {
        courses[idx] = currentCourse;
        saveCourses(courses);
      }
      promptNextDestinationSelection(true);
    };

    window.chooseNextSequentialTarget = function() {
      const nextDefault = getNextRecommendedTarget();
      if (!nextDefault) return;

    // --- 3. 配送先を確定して移動・ナビ開始 ---
    window.setTargetAndBeginTransit = function(item) {
      currentTargetItem = item;
      const targetOrder = (item.order !== undefined && item.order !== null) ? Number(item.order) : Number(item.id);
      saveActiveSessionState();
      document.getElementById('select-next-modal').style.display = 'none';
      document.getElementById('all-destinations-modal').style.display = 'none';
      document.getElementById('transit-target-card').style.display = 'block';

      const orderDisplay = (item.order === 0) ? 'START' : (item.code === 'RETURN' ? 'GOAL' : `${item.order || item.id}`);
      const nameDisplay = item.isDepot ? item.name : `${item.name} 様`;

      document.getElementById('transitOrderNum').innerText = orderDisplay;
      document.getElementById('transitName').innerText = nameDisplay;

      const memoInlineEl = document.getElementById('transitMemoInline');

        if (item.memo) {
          memoInlineEl.style.display = 'inline-block';
          memoInlineEl.innerText = `📝 ${item.memo}`;
        } else {
          memoInlineEl.style.display = 'none';
        }
      }

      currentLegLogs = [];
      plotMarkers();

      // 🔍 次の目的地への出発時はオートズームフラグを解除し、巡航ズーム（16）にスムーズ調整
      isApproachingTarget = false;
      if (map && currentUserCoords && shouldCenterOnUser) {
        map.flyTo([currentUserCoords.lat, currentUserCoords.lng], CRUISE_ZOOM_LEVEL, {
          animate: true,
          duration: 0.8
        });
      }

      // 🔴 登録軌跡（赤色の丸ドット点線）を取得・描画
      const toCode = item.code || '';
      loadAndDrawRegisteredLeg(currentLegFromCode, toCode, currentLegFromOrder, targetOrder, currentCourse ? currentCourse.id : null);

      checkProximityToTarget();
      calculateTransitRoute(item);
    };

    // 🔴 該当区間の登録軌跡（赤色の丸ドット点線）の取得・描画
    async function loadAndDrawRegisteredLeg(fromCode, toCode, fromOrder = null, toOrder = null, courseId = null) {
      if (registeredLegPolyline && map) {
        map.removeLayer(registeredLegPolyline);
        registeredLegPolyline = null;
      }

      let points = [];
      if (window.fetchLegTrackByCodes) {
        points = await fetchLegTrackByCodes(fromCode, toCode, fromOrder, toOrder, courseId);
      }

      if (points && points.length > 0) {
        const latlngs = points.map(p => [p.lat, p.lng]);
        // 🔴 登録されている過去の軌跡情報を「赤色の丸ドット点線」で鮮明に表示
        registeredLegPolyline = L.polyline(latlngs, {
          color: '#ef4444',
          weight: 8,
          opacity: 0.98,
          dashArray: '0, 14',
          lineCap: 'round',
          lineJoin: 'round'
        }).addTo(map);

        if (registeredLegPolyline.bringToFront) {
          registeredLegPolyline.bringToFront();
        }
        console.log(`✅ Loaded leg track for [${fromCode} (${fromOrder}) -> ${toCode} (${toOrder})]: ${points.length} pts`);
      } else {
        console.log(`ℹ️ No registered leg track found for [${fromCode} (${fromOrder}) -> ${toCode} (${toOrder})]`);
      }
    }

    function checkProximityToTarget() {
      if (!currentTargetItem) return;

      const distTextEl = document.getElementById('distanceText');
      const distLandEl = document.getElementById('distanceTextLandscape');
      const badgeEl = document.getElementById('proximityStatusBadge');
      const arrivalBtn = document.getElementById('mainArrivalButton');

      let distMeters = null;
      if (currentUserCoords) {
        distMeters = map.distance([currentUserCoords.lat, currentUserCoords.lng], [currentTargetItem.lat, currentTargetItem.lng]);
      }

      let formattedDist = "測位中...";
      if (distMeters !== null) {
        if (distMeters < 1000) {
          formattedDist = `${Math.round(distMeters)} m`;
        } else {
          formattedDist = `${(distMeters / 1000).toFixed(1)} km`;
        }

        if (distMeters <= PROXIMITY_THRESHOLD_METERS) {
          badgeEl.innerText = "🎯 目的地付近！";
          badgeEl.style.color = "#4ade80";
          arrivalBtn.classList.add('near-pulse');

          // 🔍 50m手前に到達した瞬間に、建物・進入路がくっきり見える超詳細倍率(19)へ自動拡大！
          if (!isApproachingTarget && map && currentUserCoords && shouldCenterOnUser) {
            isApproachingTarget = true;
            map.flyTo([currentUserCoords.lat, currentUserCoords.lng], APPROACH_ZOOM_LEVEL, {
              animate: true,
              duration: 0.9
            });
          }
        } else {
          badgeEl.innerText = "案内中";
          badgeEl.style.color = "#94a3b8";
          arrivalBtn.classList.remove('near-pulse');

          // 70m以上離れた場合は接近フラグをリセット
          if (isApproachingTarget && distMeters > PROXIMITY_THRESHOLD_METERS + 20) {
            isApproachingTarget = false;
          }
        }
      } else {
        badgeEl.innerText = "GPS接続中";
      }

      distTextEl.innerText = formattedDist;
      if (distLandEl) distLandEl.innerText = formattedDist;
    }

    async function calculateTransitRoute(targetItem) {
      if (!targetItem) return;

      // 1. 既知の出発座標（現在地GPS ➔ 直前到着地点 ➔ 起点）を決定
      let fromLat = null;
      let fromLng = null;

      if (currentUserCoords) {
        fromLat = currentUserCoords.lat;
        fromLng = currentUserCoords.lng;
      } else if (lastArrivedCoords) {
        fromLat = lastArrivedCoords.lat;
        fromLng = lastArrivedCoords.lng;
      } else if (currentCourse && currentCourse.items && currentCourse.items.length > 0) {
        fromLat = currentCourse.items[0].lat;
        fromLng = currentCourse.items[0].lng;
      }

      // 2. 出発座標があれば即座にルート線を描画！
      if (fromLat !== null && fromLng !== null) {
        drawRouteLine(fromLng, fromLat, targetItem.lng, targetItem.lat);
      }

      // 3. バックグラウンドで最新GPS測位を試行（測位できたら最新現在地ルートに更新）
      if (!currentUserCoords && navigator.geolocation) {
        navigator.geolocation.getCurrentPosition((pos) => {
          currentUserCoords = { lat: pos.coords.latitude, lng: pos.coords.longitude };
          if (isRouteLineVisible && currentTargetItem) {
            drawRouteLine(pos.coords.longitude, pos.coords.latitude, currentTargetItem.lng, currentTargetItem.lat);
          }
        }, () => {}, { enableHighAccuracy: true, timeout: 5000 });
      }
    }

    // --- 地点位置修正（スマホ版） ---
    let isMapTapCorrectionActive = false;

    window.openLocationCorrectionModal = function() {
      if (!currentTargetItem) return;
      document.getElementById('location-correction-modal').style.display = 'block';
    };

    window.closeLocationCorrectionModal = function() {
      document.getElementById('location-correction-modal').style.display = 'none';
    };

    // 1. 現在地（GPS）で修正
    window.correctLocationWithCurrentGps = async function() {
      if (!currentUserCoords) {
        return alert("GPS測位中です。現在地を取得してから再度お試しください。");
      }
      closeLocationCorrectionModal();
      await applyLocationCorrection(currentUserCoords.lat, currentUserCoords.lng);
    };

    // 2. 地図タップで修正
    window.startMapTapCorrectionMode = function() {
      closeLocationCorrectionModal();
      isMapTapCorrectionActive = true;
      document.getElementById('map-tap-guide-bar').style.display = 'flex';
      map.getContainer().style.cursor = 'crosshair';
    };

    window.cancelMapTapCorrection = function() {
      isMapTapCorrectionActive = false;
      document.getElementById('map-tap-guide-bar').style.display = 'none';
      map.getContainer().style.cursor = '';
    };

    // 地点修正の適用＆マスター保存
    async function applyLocationCorrection(lat, lng) {
      if (!currentTargetItem) return;

      currentTargetItem.lat = lat;
      currentTargetItem.lng = lng;
      currentTargetItem.isCorrectedMaster = true;

      // 1. 顧客コード主キーで地点マスターに保存（完全匿名化）
      if (currentTargetItem.code && window.saveCustomerLocation) {
        await saveCustomerLocation(currentTargetItem.code, lat, lng);
      }

      // 2. コースデータを保存
      const courses = getCourses();
      const cIdx = courses.findIndex(c => c.id === currentCourse.id);
      if (cIdx !== -1) {
        courses[cIdx] = currentCourse;
        saveCourses(courses);
      }

      // 3. ルート再計算 & ピン再描画
      plotMarkers();
      calculateTransitRoute(currentTargetItem);
      checkProximityToTarget();

      const targetOrderLabel = (currentTargetItem.order === 0) ? 'START' : (currentTargetItem.code === 'RETURN' ? 'GOAL' : `${currentTargetItem.order || currentTargetItem.id}`);
      const targetNameLabel = currentTargetItem.isDepot ? currentTargetItem.name : `${currentTargetItem.name} 様`;
      alert(`🎯 ${targetOrderLabel} ${targetNameLabel} の地点位置を修正し、【地点マスター】に登録しました！\n次回以降の配送でも、この正確な位置にピンが立ちます。`);
    }

    // --- マップ初期化 (高視認性 CARTO Voyager / OSM / 国土地理院 / 航空写真) ---
    const PREFERRED_MAP_KEY = 'lively_navi_preferred_map';
    let availableTileLayers = {};
    let currentTileLayerKey = 'carto';

    window.openMapSelectorModal = function() {
      document.getElementById('map-selector-modal').style.display = 'block';
    };

    window.closeMapSelectorModal = function() {
      document.getElementById('map-selector-modal').style.display = 'none';
    };

    window.switchMapLayer = function(key) {
      if (!availableTileLayers[key] || !map) return;

      // 現在のタイルレイヤーを削除して新しいタイルを追加
      Object.keys(availableTileLayers).forEach(k => {
        if (map.hasLayer(availableTileLayers[k])) {
          map.removeLayer(availableTileLayers[k]);
        }
      });

      availableTileLayers[key].addTo(map);
      currentTileLayerKey = key;
      localStorage.setItem(PREFERRED_MAP_KEY, key);

      // モーダル内のボタンスタイル更新
      document.querySelectorAll('.map-choice-btn').forEach(btn => {
        btn.style.borderColor = '#e2e8f0';
        btn.style.background = '#ffffff';
        const title = btn.querySelector('b');
        if (title) title.style.color = '#0f172a';
      });

      const selectedBtn = document.getElementById(`mapChoice_${key}`);
      if (selectedBtn) {
        selectedBtn.style.borderColor = '#0d9488';
        selectedBtn.style.background = '#f0fdfa';
        const title = selectedBtn.querySelector('b');
        if (title) title.style.color = '#0d9488';
      }

      closeMapSelectorModal();
    };

    function initMap() {
      if (!map) {
        // 1. CARTO Voyager (スマートナビ地図：視認性抜群・道路と建物がくっきり)
        availableTileLayers['carto'] = L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
          maxZoom: 19,
          subdomains: 'abcd',
          keepBuffer: 12,
          attribution: '© <a href="https://carto.com/">CARTO</a> © <a href="https://www.openstreetmap.org/">OSM</a>'
        });

        // 2. OpenStreetMap 標準
        availableTileLayers['osm'] = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
          maxZoom: 19,
          keepBuffer: 12,
          attribution: '© <a href="https://www.openstreetmap.org/">OpenStreetMap</a>'
        });

        // 3. 国土地理院 航空写真
        availableTileLayers['photo'] = L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/seamlessphoto/{z}/{x}/{y}.jpg', {
          maxZoom: 18,
          keepBuffer: 12,
          attribution: '© <a href="https://maps.gsi.go.jp/">国土地理院 航空写真</a>'
        });

        // 4. 国土地理院 淡色地図
        availableTileLayers['pale'] = L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/pale/{z}/{x}/{y}.png', {
          maxZoom: 18,
          keepBuffer: 12,
          attribution: '© <a href="https://maps.gsi.go.jp/">国土地理院</a>'
        });

        // 5. 国土地理院 標準地図
        availableTileLayers['std'] = L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/std/{z}/{x}/{y}.png', {
          maxZoom: 18,
          keepBuffer: 12,
          attribution: '© <a href="https://maps.gsi.go.jp/">国土地理院</a>'
        });

        const savedMapKey = localStorage.getItem(PREFERRED_MAP_KEY) || 'carto';
        currentTileLayerKey = availableTileLayers[savedMapKey] ? savedMapKey : 'carto';

        map = L.map('map', { 
          zoomControl: false,
          layers: [availableTileLayers[currentTileLayerKey]]
        }).setView([34.685062, 135.832809], 16);

        // ユーザーがドラッグ移動したら追従を一時停止
        map.on('dragstart', () => {
          shouldCenterOnUser = false;
        });

        // ユーザーが拡大・縮小したズームレベルを保持
        map.on('zoomend', () => {
          if (map) {
            // 現在のズーム倍率を維持
          }
        });

        // 地図タップによる地点修正
        map.on('click', async (e) => {
          if (!isMapTapCorrectionActive) return;
          cancelMapTapCorrection();
          const { lat, lng } = e.latlng;
          await applyLocationCorrection(lat, lng);
        });
      }

      handleScreenResize();
    }

    // 画面回転・リサイズ時の適正化（横向き・縦向きで画面いっぱいに広げる）
    function handleScreenResize() {
      if (!map) return;
      map.invalidateSize();
      if (currentUserCoords && shouldCenterOnUser) {
        map.setView([currentUserCoords.lat, currentUserCoords.lng], map.getZoom(), { animate: false });
      }
    }
    window.addEventListener('resize', handleScreenResize);
    window.addEventListener('orientationchange', () => {
      setTimeout(handleScreenResize, 100);
      setTimeout(handleScreenResize, 300);
    });

    window.centerOnUserLocation = function() {
      if (currentUserCoords && map) {
        shouldCenterOnUser = true;
        // ユーザーが変更したズームレベルを維持したまま現在地を中央に配置
        map.setView([currentUserCoords.lat, currentUserCoords.lng], map.getZoom(), { animate: true });
      } else {
        alert("GPS測位中です。少々お待ちください。");
      }
    };

    // --- 🎯 現在地マーカー（拡大・縮小したズームレベルを完全保持） ---
    function updateCarMarker(lat, lng) {
      const isFirstFix = !currentUserCoords;
      currentUserCoords = { lat, lng };
      if (!map) return;

      if (!userCarMarker) {
        const carHtml = `
          <div class="car-marker-container">
            <div class="car-pulse"></div>
            <div class="car-icon-body"></div>
          </div>
        `;
        const carIcon = L.divIcon({
          html: carHtml,
          className: 'custom-car-icon',
          iconSize: [32, 32],
          iconAnchor: [16, 16]
        });
        userCarMarker = L.marker([lat, lng], { icon: carIcon, zIndexOffset: 3000 }).addTo(map);
      } else {
        userCarMarker.setLatLng([lat, lng]);
      }

      if (shouldCenterOnUser || isFirstFix) {
        // 固定ズーム(16)で上書きせず、ユーザーが拡大・縮小した倍率を100%保持
        const currentZoom = isFirstFix ? 16 : map.getZoom();
        map.setView([lat, lng], currentZoom, { animate: false });
      }

      checkProximityToTarget();
    }

    async function drawRouteLine(lng1, lat1, lng2, lat2) {
      if (!isRouteLineVisible) {
        if (currentRouteLayer && map) {
          map.removeLayer(currentRouteLayer);
          currentRouteLayer = null;
        }
        return;
      }

      const url = `https://router.project-osrm.org/route/v1/driving/${lng1},${lat1};${lng2},${lat2}?overview=full&geometries=geojson`;
      try {
        const res = await fetch(url);
        const data = await res.json();
        if (data.routes && data.routes.length > 0) {
          if (currentRouteLayer) map.removeLayer(currentRouteLayer);
          currentRouteLayer = L.geoJSON(data.routes[0].geometry, {
            style: { color: '#0284c7', weight: 8, opacity: 0.95 }
          }).addTo(map);
          map.setView([lat1, lng1], map.getZoom(), { animate: false });
        }
      } catch (e) {
        map.setView([lat1, lng1], map.getZoom(), { animate: false });
      }
    }

    // --- 到着ボタン押下（isRegister: true = 軌跡ルート上書き登録, false = 通常完了のみ） ---
    window.onArrivalClick = function(isRegister = false) {
      if (!currentTargetItem) return;

      currentTargetItem.isDone = true;
      lastFinishedOrder = (currentTargetItem.order !== undefined && currentTargetItem.order !== null) ? Number(currentTargetItem.order) : Number(currentTargetItem.id);
      lastArrivedCoords = { lat: currentTargetItem.lat, lng: currentTargetItem.lng };

      const courses = getCourses();
      const idx = courses.findIndex(c => c.id === currentCourse.id);
      if (idx !== -1) {
        courses[idx] = currentCourse;
        saveCourses(courses);
      }

      // ⭐「登録到着」ボタンの場合のみ、今回の区間GPS走行ログをお手本として上書き保存！
      const toCode = currentTargetItem.code || `ORDER_${lastFinishedOrder}`;
      if (isRegister) {
        if (window.saveLegTrackByCodes && currentLegLogs.length > 0) {
          saveLegTrackByCodes(currentLegFromCode, toCode, currentLegLogs);
        }
      }
      // 「通常到着」の場合は保存・上書きをスキップ（迷走や回り道などの誤登録を完全防止）

      currentLegFromCode = toCode; // 次の出発地点顧客コードを更新
      currentLegFromOrder = lastFinishedOrder; // 次の出発地点オーダーを更新

      if (currentRouteLayer) {
        map.removeLayer(currentRouteLayer);
        currentRouteLayer = null;
      }
      if (registeredLegPolyline && map) {
        map.removeLayer(registeredLegPolyline);
        registeredLegPolyline = null;
      }

      const itemLabel = (currentTargetItem.order === 0) ? '🏁 起点' : (currentTargetItem.code === 'RETURN' ? '🏢 帰着' : `#${currentTargetItem.order || currentTargetItem.id} ${currentTargetItem.name} 様`);
      const finishMsg = isRegister 
        ? `⭐ ${itemLabel} への到着完了！\n該当区間の走行ルートをお手本軌跡として上書き登録しました。`
        : `✅ ${itemLabel} への配達が完了しました。\n（※軌跡ルートは登録・上書きしていません）`;
      alert(finishMsg);

      currentTargetItem = null;
      clearActiveSessionState();

      promptNextDestinationSelection(false);
    };

    // --- セッション状態の自動保存・復元 ---
    const ACTIVE_STATE_KEY = 'lively_navi_active_state';

    function saveActiveSessionState() {
      if (currentCourse && currentTargetItem) {
        localStorage.setItem(ACTIVE_STATE_KEY, JSON.stringify({
          courseId: currentCourse.id,
          targetItemId: currentTargetItem.id
        }));
      }
    }

    function clearActiveSessionState() {
      localStorage.removeItem(ACTIVE_STATE_KEY);
    }

    window.openExternalGoogleMap = function() {
      if (!currentTargetItem) return;
      saveActiveSessionState();

      const url = `https://www.google.com/maps/dir/?api=1&destination=${currentTargetItem.lat},${currentTargetItem.lng}`;
      
      const win = window.open(url, '_blank', 'noopener,noreferrer');
      if (!win) {
        const link = document.createElement('a');
        link.href = url;
        link.target = '_blank';
        link.rel = 'noopener noreferrer';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      }
    };

    function updateNavStats() {
      if (!currentCourse || !currentCourse.items) return;
      const realItems = currentCourse.items.filter(i => !i.isDepot && !i.isStartDepot && !i.isReturnDepot);
      const doneCount = realItems.filter(i => i.isDone).length;
      const totalCount = realItems.length;
      document.getElementById('navDeliveredCount').innerText = doneCount;
      document.getElementById('navTotalCount').innerText = totalCount;
    }

    // --- 🏁 配送先ピン描画（目的地はGマーク・Goalバッジ） ---
    function plotMarkers() {
      if (!map || !currentCourse) return;
      markers.forEach(m => map.removeLayer(m));
      markers = [];

      currentCourse.items.forEach((item) => {
        const isTarget = currentTargetItem && currentTargetItem.id === item.id;

        let iconHtml = '';
        let iconSize = [26, 26];
        let iconAnchor = [13, 13];

        if (isTarget) {
          // 🏁 目的地: 鮮やかな赤い「G」Goalバッジ！
          iconHtml = `
            <div class="goal-pin-container">
              <div class="goal-pin-badge">G</div>
              <div class="goal-pin-label">GOAL</div>
            </div>
          `;
          iconSize = [40, 50];
          iconAnchor = [20, 25];
        } else if (item.isStartDepot || item.order === 0 || item.code === 'START' || String(item.id).startsWith('depot_start_')) {
          // 🏁 出発起点
          iconHtml = `<div class="dest-pin-badge" style="background:#10b981; border-color:#059669;">🏁</div>`;
          iconSize = [30, 30];
          iconAnchor = [15, 15];
        } else if (item.isReturnDepot || item.code === 'RETURN' || String(item.id).startsWith('depot_return_')) {
          // 🏢 帰着拠点（未配達番号ではなく帰還アイコン）
          iconHtml = `<div class="dest-pin-badge" style="background:${item.isDone ? '#10b981' : '#0284c7'}; border-color:${item.isDone ? '#059669' : '#0369a1'};">🏢${item.isDone ? '✔' : ''}</div>`;
          iconSize = [30, 30];
          iconAnchor = [15, 15];
        } else if (item.isDone) {
          // 配達完了: 緑の✔バッジ
          iconHtml = `<div class="dest-pin-badge done">✔</div>`;
          iconSize = [26, 26];
          iconAnchor = [13, 13];
        } else {
          // 配達先: 配達順番号バッジ（#なしの数字のみ）
          iconHtml = `<div class="dest-pin-badge">${item.order || item.id}</div>`;
          iconSize = [26, 26];
          iconAnchor = [13, 13];
        }

        const customIcon = L.divIcon({
          html: iconHtml,
          className: 'custom-dest-pin-icon',
          iconSize: iconSize,
          iconAnchor: iconAnchor
        });

        const marker = L.marker([item.lat, item.lng], {
          icon: customIcon,
          zIndexOffset: isTarget ? 2000 : (item.isDepot ? 1500 : 500)
        }).addTo(map);

        const titleText = (item.isStartDepot || item.order === 0) ? `🏁 ${item.name}` : (item.isReturnDepot ? `🏢 ${item.name}` : `${item.order || item.id} ${item.name} 様`);

        marker.bindPopup(`
          <div style="min-width:170px; font-size:12px; font-family:'Noto Sans JP',sans-serif;">
            <b style="font-size:14px; color:#0f172a;">${titleText}</b><br>
            <span style="color:#64748b;">${item.address}</span><br>
            ${item.memo ? `<span style="color:#d97706; font-weight:600;">📝 ${item.memo}</span><br>` : ''}
            <div style="margin-top:8px;">
              <button class="btn btn-primary" style="width:100%; padding:6px; font-size:11px;" onclick="setTargetAndBeginTransitDirect('${item.id}')">
                🚚 ここへ向かう
              </button>
            </div>
          </div>
        `);

        markers.push(marker);
      });
    }

    window.setTargetAndBeginTransitDirect = function(id) {
      const item = currentCourse.items.find(i => String(i.id) === String(id));
      if (item) {
        map.closePopup();
        setTargetAndBeginTransit(item);
      }
    };

    // --- GPS追従 & クラウド自動送信 ---
    let lastCloudUploadTime = 0;

    function startContinuousGpsTracking() {
      if (!navigator.geolocation) return;
      isGpsRecording = true;
      recordedLogs = [];

      if (gpsPolyline) map.removeLayer(gpsPolyline);
      // 🟡 通った軌跡は「薄い黄色の丸ドット点線」で表示
      gpsPolyline = L.polyline([], {
        color: '#eab308',
        weight: 6,
        opacity: 0.9,
        dashArray: '0, 14',
        lineCap: 'round',
        lineJoin: 'round'
      }).addTo(map);

      gpsWatchId = navigator.geolocation.watchPosition((pos) => {
        const pt = { lat: pos.coords.latitude, lng: pos.coords.longitude, time: pos.timestamp };
        recordedLogs.push(pt);
        currentLegLogs.push(pt);
        gpsPolyline.addLatLng([pt.lat, pt.lng]);
        document.getElementById('gpsPointCount').innerText = recordedLogs.length;

        // 🧭 方位角（Heading / Bearing）の検知・算出
        let calculatedHeading = currentHeading;
        if (pos.coords.heading !== null && !isNaN(pos.coords.heading) && pos.coords.heading >= 0) {
          calculatedHeading = pos.coords.heading;
        } else if (lastHeadingCoords) {
          const dist = map.distance([lastHeadingCoords.lat, lastHeadingCoords.lng], [pt.lat, pt.lng]);
          if (dist > 1.5) { // 1.5m以上移動した場合に進行方位角を算出
            calculatedHeading = calculateBearing(lastHeadingCoords.lat, lastHeadingCoords.lng, pt.lat, pt.lng);
            lastHeadingCoords = pt;
          }
        } else {
          lastHeadingCoords = pt;
        }

        updateMapHeading(calculatedHeading);
        updateCarMarker(pt.lat, pt.lng);

        const now = Date.now();
        if (now - lastCloudUploadTime > 3000) {
          lastCloudUploadTime = now;
          if (window.updateDriverLocationToCloud) {
            updateDriverLocationToCloud('driver_main', {
              name: '担当ドライバー',
              courseId: currentCourse ? currentCourse.id : null,
              lat: pt.lat,
              lng: pt.lng
            });
          }
          if (window.appendGpsLogToCloud && currentCourse) {
            appendGpsLogToCloud(currentCourse.id, pt);
          }
        }
      }, (err) => {
        console.warn("GPS error:", err);
      }, { enableHighAccuracy: true, maximumAge: 2000, timeout: 10000 });
    }

    function stopGpsTracking() {
      if (gpsWatchId) navigator.geolocation.clearWatch(gpsWatchId);
      isGpsRecording = false;
    }

    // 初期化 & クラウドコース購読 & 運行セッション自動復元
    function initDriverApp() {
      updateRouteLineBtnUi();
      updateHeadingModeUi();

      // 🧭 端末コンパス（ジャイロ）対応 (iOS / Android)
      if (window.DeviceOrientationEvent) {
        window.addEventListener('deviceorientation', (e) => {
          let compassHeading = null;
          if (e.webkitCompassHeading) {
            compassHeading = e.webkitCompassHeading;
          } else if (e.alpha !== null) {
            compassHeading = (360 - e.alpha) % 360;
          }
          if (compassHeading !== null && !isNaN(compassHeading)) {
            // 停車中などにコンパス方位を活用
            if (!isGpsRecording || !lastHeadingCoords) {
              updateMapHeading(compassHeading);
            }
          }
        }, true);
      }

      // 画面1(view-course-select)内の不要な「地図切替」ボタンを強制完全除去
      try {
        document.querySelectorAll('#view-course-select button').forEach(b => {
          if (b.innerText.includes('地図切替') || (b.getAttribute('onclick') && b.getAttribute('onclick').includes('openMapSelectorModal'))) {
            b.remove();
          }
        });
      } catch (e) {}

      // 📱 QRコード / 共有リンクからの自動インポート (#import=...)
      try {
        const hash = window.location.hash;
        if (hash && hash.includes('import=')) {
          const rawCompressed = hash.substring(hash.indexOf('import=') + 7);
          if (rawCompressed && window.LZString) {
            const decompressedJson = LZString.decompressFromEncodedURIComponent(rawCompressed);
            if (decompressedJson) {
              const importedCourse = JSON.parse(decompressedJson);
              if (importedCourse && importedCourse.items && importedCourse.items.length > 0) {
                let courses = getCourses();
                // 既存の同一IDまたは名前のコースを更新、なければ先頭追加
                const existingIdx = courses.findIndex(c => c.id === importedCourse.id || c.name === importedCourse.name);
                if (existingIdx !== -1) {
                  courses[existingIdx] = importedCourse;
                } else {
                  courses.unshift(importedCourse);
                }
                saveCourses(courses);
                alert(`🎉 QRコードからコース「${importedCourse.name}」（${importedCourse.items.length}件）を正常に取り込みました！`);
                history.replaceState(null, null, ' ');
              }
            }
          }
        }
      } catch (importErr) {
        console.warn("QR/Link import error:", importErr);
      }

      refreshCourses();

      try {
        const savedStateRaw = localStorage.getItem(ACTIVE_STATE_KEY);
        if (savedStateRaw) {
          const state = JSON.parse(savedStateRaw);
          const courses = getCourses();
          const targetCourse = courses.find(c => c.id === state.courseId);
          if (targetCourse) {
            const targetItem = targetCourse.items.find(i => i.id === state.targetItemId && !i.isDone);
            if (targetItem) {
              currentCourse = targetCourse;
              document.getElementById('view-course-select').style.display = 'none';
              document.getElementById('view-nav-main').style.display = 'flex';
              initMap();
              startContinuousGpsTracking();
              setTargetAndBeginTransit(targetItem);
              console.log("✅ Restored active transit session:", targetItem.name);
            }
          }
        }
      } catch (e) {
        console.warn("Restore state error:", e);
      }

      if (window.subscribeCoursesFromCloud) {
        subscribeCoursesFromCloud((cloudCourses) => {
          if (cloudCourses && cloudCourses.length > 0) {
            saveCourses(cloudCourses);
            if (!currentCourse) {
              refreshCourses();
            }
          }
        });
      }

      // 初回起動時の直接同期
      if (window.fetchCoursesFromCloudDirect) {
        fetchCoursesFromCloudDirect().then((cloudCourses) => {
          if (cloudCourses && cloudCourses.length > 0) {
            saveCourses(cloudCourses);
            if (!currentCourse) {
              refreshCourses();
            }
          }
        });
      }
    }

    // 画面回転・リサイズ時の地図再描画
    window.addEventListener('resize', () => {
      if (map) {
        setTimeout(() => map.invalidateSize(), 100);
        setTimeout(() => map.invalidateSize(), 300);
      }
    });
    window.addEventListener('orientationchange', () => {
      if (map) {
        setTimeout(() => map.invalidateSize(), 150);
        setTimeout(() => map.invalidateSize(), 400);
      }
    });

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initDriverApp);
    } else {
      initDriverApp();
    }
  </script>
</body>
</html>
