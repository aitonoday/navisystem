<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Lively Navi - 配達ドライバー</title>
  
  <!-- PWA設定 -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#090d16">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Lively Navi">
  <link rel="apple-touch-icon" href="logo.png">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">

  <!-- Leaflet CSS (Cloudflare CDN) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
  
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      font-family: 'Plus Jakarta Sans', 'Noto Sans JP', -apple-system, sans-serif;
      background: #090d16;
      color: #f8fafc;
      overflow: hidden;
      user-select: none;
    }
    #app-root {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* 共通モダンボタン */
    .btn {
      padding: 12px 16px;
      border: none;
      border-radius: 12px;
      font-weight: 700;
      cursor: pointer;
      font-size: 14px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      text-decoration: none;
    }
    .btn-blue {
      background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
      color: #ffffff;
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.4), inset 0 1px 1px rgba(255, 255, 255, 0.2);
    }
    .btn-blue:active { transform: scale(0.97); }

    .btn-green {
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      color: #ffffff;
      box-shadow: 0 4px 14px rgba(16, 185, 129, 0.4), inset 0 1px 1px rgba(255, 255, 255, 0.2);
    }
    .btn-green:active { transform: scale(0.97); }

    .btn-slate {
      background: rgba(30, 41, 59, 0.85);
      color: #f1f5f9;
      border: 1px solid rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(8px);
    }
    .btn-slate:active { background: rgba(51, 65, 85, 0.9); transform: scale(0.97); }

    .btn-outline {
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #94a3b8;
    }

    /* 車の現在地アイコン (パルスエフェクト) */
    .car-marker-container {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .car-icon-body {
      width: 42px;
      height: 42px;
      background: #0f172a;
      border: 2.5px solid #38bdf8;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.6), 0 0 14px rgba(56, 189, 248, 0.5);
      z-index: 10;
    }
    .car-pulse {
      position: absolute;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: rgba(56, 189, 248, 0.35);
      animation: pulseAnim 1.8s infinite ease-out;
      z-index: 1;
    }
    @keyframes pulseAnim {
      0% { transform: scale(0.6); opacity: 0.9; }
      100% { transform: scale(1.6); opacity: 0; }
    }

    /* --- 画面1: コース選択画面 --- */
    #view-course-select {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 20px 16px;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      background: radial-gradient(circle at 50% 0%, #1e1b4b 0%, #090d16 60%);
    }
    .app-header-hero {
      text-align: center;
      margin: 12px 0 20px;
    }
    .logo-badge-wrap {
      display: inline-block;
      background: #ffffff;
      padding: 8px 18px;
      border-radius: 14px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
      margin-bottom: 8px;
    }
    .app-subtitle {
      font-size: 13px;
      color: #94a3b8;
      font-weight: 500;
    }

    .course-card-mobile {
      background: rgba(30, 41, 59, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 18px;
      padding: 18px;
      margin-bottom: 14px;
      box-shadow: 0 10px 28px rgba(0,0,0,0.3);
      transition: all 0.2s ease;
    }
    .course-title-mobile {
      font-size: 17px;
      font-weight: 800;
      color: #f8fafc;
      letter-spacing: -0.3px;
    }
    .course-desc-mobile {
      font-size: 12px;
      color: #94a3b8;
      margin: 4px 0 12px;
    }
    .course-stats {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      margin-bottom: 14px;
      background: rgba(15, 23, 42, 0.8);
      padding: 10px 14px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.04);
    }

    /* --- 画面2: 運行・ナビ画面 --- */
    #view-nav-main {
      flex: 1;
      display: none;
      flex-direction: column;
      width: 100%;
      height: 100%;
      position: relative;
    }

    /* ナビ上部バー */
    #nav-header {
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 8px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      z-index: 1000;
      height: 52px;
    }

    /* メインマップエリア */
    #map-container {
      flex: 1;
      width: 100%;
      height: calc(100% - 52px);
      position: relative;
      background: #090d16;
    }
    #map {
      width: 100%;
      height: 100%;
      background: #090d16;
    }

    /* 🚚 移動中 HUD風 お届け先カード（超コンパクト・スリム設計） */
    #transit-target-card {
      position: absolute;
      top: 8px;
      left: 8px;
      right: 8px;
      background: rgba(15, 23, 42, 0.95);
      border: 1.5px solid rgba(56, 189, 248, 0.4);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 14px;
      padding: 8px 12px;
      z-index: 1000;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5), 0 0 16px rgba(56, 189, 248, 0.15);
      animation: fadeIn 0.2s ease-out;
    }
    .btn-arrival:active {
      transform: scale(0.98);
      background: #059669;
    }
    .btn-arrival.near-pulse {
      animation: arrivalGlow 1.5s infinite alternate;
    }
    @keyframes arrivalGlow {
      0% { box-shadow: 0 0 15px rgba(16, 185, 129, 0.5); transform: scale(1); }
      100% { box-shadow: 0 0 30px rgba(16, 185, 129, 0.9); transform: scale(1.02); }
    }

    /* 2択選択モーダル（フローティングカード） */
    #select-next-modal {
      position: absolute;
      top: 10px;
      left: 10px;
      right: 10px;
      z-index: 1500;
      display: none;
      pointer-events: none;
      animation: fadeIn 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .modal-content-card {
      pointer-events: auto;
      background: rgba(15, 23, 42, 0.95);
      border: 1.5px solid rgba(56, 189, 248, 0.5);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 20px;
      padding: 16px 18px;
      box-shadow: 0 16px 40px rgba(0,0,0,0.7), 0 0 24px rgba(56, 189, 248, 0.2);
    }
    .modal-headline {
      font-size: 11px;
      color: #94a3b8;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      margin-bottom: 4px;
    }
    .modal-target-title {
      font-size: 21px;
      font-weight: 900;
      color: #38bdf8;
      margin-bottom: 4px;
      line-height: 1.3;
      letter-spacing: -0.3px;
    }
    .modal-target-addr {
      font-size: 13px;
      color: #cbd5e1;
      margin-bottom: 16px;
    }

    /* 配送先選択リストモーダル */
    #all-destinations-modal {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(9, 13, 22, 0.97);
      backdrop-filter: blur(16px);
      z-index: 2100;
      display: none;
      flex-direction: column;
      padding: 16px;
    }
    .dest-list-scroll {
      flex: 1;
      overflow-y: auto;
      margin: 14px 0;
      -webkit-overflow-scrolling: touch;
    }
    .dest-select-card {
      background: rgba(30, 41, 59, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 10px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .dest-select-card:active {
      background: rgba(51, 65, 85, 0.9);
      border-color: #38bdf8;
    }
    .dest-select-card.completed {
      opacity: 0.6;
      background: rgba(6, 78, 59, 0.4);
      border-color: #059669;
    }

    /* GPS記録中インジケータ */
    #tracking-indicator {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.4);
      padding: 3px 8px;
      border-radius: 20px;
      font-size: 11px;
      color: #f87171;
      font-weight: 700;
    }
  </style>
</head>
<body>

  <div id="app-root">
    <!-- ================= 画面1: コース選択画面 ================= -->
    <div id="view-course-select">
      <div class="app-header-hero">
        <div class="logo-badge-wrap">
          <img src="logo.png" alt="Lively Navi" style="max-width: 180px; width: 100%; height: auto; display: block;">
        </div>
        <div class="app-subtitle">ルート配送ナビゲーション＆運行管理</div>
      </div>

      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;">
        <b style="font-size:16px; font-weight:800;">本日のお届けコース</b>
        <div style="display:flex; gap:6px;">
          <button class="btn btn-outline" style="padding:4px 8px; font-size:11px;" onclick="refreshCourses()">🔄 更新</button>
          <button class="btn btn-slate" style="padding:4px 8px; font-size:11px; color:#38bdf8;" onclick="forceClearCacheAndReload()">⚡ 最新化</button>
        </div>
      </div>

      <div id="courseCardsContainer">
        <!-- コースカード動的挿入 -->
      </div>
    </div>

    <!-- ================= 画面2: 運行・ナビ画面 ================= -->
    <div id="view-nav-main">
      <!-- 上部ヘッダー -->
      <div id="nav-header">
        <button class="btn btn-slate" style="padding:6px 10px; font-size:12px;" onclick="exitToCourseSelect()">
          ◀ コース一覧
        </button>
        <div style="background:#fff; padding:3px 8px; border-radius:6px;">
          <img src="logo.png" alt="Lively Navi" style="height: 18px; display: block;">
        </div>
        <div style="font-size:12px; color:#38bdf8; font-weight:800; background:rgba(56,189,248,0.1); border:1px solid rgba(56,189,248,0.25); padding:3px 8px; border-radius:12px;">
          <span id="navDeliveredCount">0</span>/<span id="navTotalCount">0</span> 完了
        </div>
      </div>

      <!-- マップコンテナ -->
      <div id="map-container">
        <!-- 🚚 移動中 HUD風 お届け先カード（超スリム設計・地図視認性最大化） -->
        <div id="transit-target-card" style="display:none;">
          <!-- 1段目: 配達順・氏名 ＋ GPS記録中 -->
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:4px; gap:8px;">
            <div style="display:flex; align-items:center; gap:6px; overflow:hidden; flex:1;">
              <span style="background:linear-gradient(135deg, #0284c7 0%, #0369a1 100%); color:#fff; font-size:11px; font-weight:800; padding:2px 6px; border-radius:6px; white-space:nowrap;">
                #<span id="transitOrderNum">1</span>
              </span>
              <span style="font-size:16px; font-weight:900; color:#38bdf8; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;" id="transitName">宛名 様</span>
            </div>
            <div id="tracking-indicator" style="padding:2px 8px; font-size:10px; white-space:nowrap; flex-shrink:0;">
              🔴 GPS (<span id="gpsPointCount">0</span>)
            </div>
          </div>

          <!-- 2段目: 住所 ＋ 残り距離 -->
          <div style="display:flex; justify-content:space-between; align-items:center; font-size:11px; color:#cbd5e1; margin-bottom:6px; gap:8px;">
            <span style="overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1;" id="transitAddress">住所</span>
            <span style="white-space:nowrap; color:#38bdf8; font-weight:800; background:rgba(0,0,0,0.3); padding:1px 6px; border-radius:4px;" id="distanceText">-- m</span>
            <span id="proximityStatusBadge" style="display:none;">案内中</span>
          </div>

          <div id="transitMemoBox" style="display:none; background:rgba(245, 158, 11, 0.15); border-left:2px solid #f59e0b; padding:2px 6px; font-size:11px; color:#fbbf24; border-radius:0 4px 4px 0; margin-bottom:6px;">
            📝 <span id="transitMemoText">備考メモ</span>
          </div>

          <!-- 3段目: 3ボタン横並び（到着・Gマップ・変更） -->
          <div style="display:flex; gap:6px; align-items:center;">
            <button class="btn btn-green" id="mainArrivalButton" style="flex:1.2; padding:8px 4px; font-size:13px; font-weight:900;" onclick="onArrivalClick()">
              📍 到着
            </button>
            <button class="btn btn-blue" style="flex:1; padding:8px 4px; font-size:12px; font-weight:700;" onclick="openExternalGoogleMap()">
              🗺️ Gマップ
            </button>
            <button class="btn btn-slate" style="flex:0.9; padding:8px 4px; font-size:12px; font-weight:700;" onclick="openChangeDestinationModal()">
              🔄 変更
            </button>
          </div>
        </div>

        <!-- 地図本体（全画面） -->
        <div id="map"></div>

        <!-- 📍 現在地へセンタリングするフローティングボタン -->
        <button id="btnRecenterLocation" class="btn btn-slate" style="position:absolute; bottom:24px; right:16px; z-index:1000; border-radius:50%; width:50px; height:50px; padding:0; box-shadow:0 6px 20px rgba(0,0,0,0.6); font-size:22px; border:2px solid #38bdf8;" onclick="centerOnUserLocation()" title="現在地を中心にする">
          📍
        </button>
      </div>

      <!-- ================= 2択選択モーダル（画面最上部にフローティング配置） ================= -->
      <div id="select-next-modal">
        <div class="modal-content-card" id="modalCardBody">
          <!-- 動的書き換え -->
        </div>
      </div>

      <!-- ================= 配送先一覧選択モーダル ================= -->
      <div id="all-destinations-modal">
        <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid rgba(255,255,255,0.1); padding-bottom:12px;">
          <b style="font-size:17px; color:#38bdf8; font-weight:800;">📋 配送先を一覧から選択</b>
          <button class="btn btn-slate" style="padding:4px 10px; font-size:12px;" onclick="closeAllDestinationsModal()">✕ 閉じる</button>
        </div>

        <div class="dest-list-scroll" id="destListContainer"></div>
      </div>

    </div>
  </div>

  <!-- Leaflet JS (Cloudflare CDN) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
  <!-- Firebase SDK (v9 compat) -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <script src="firebase-sync.js"></script>
  <script>
    // --- Service Worker 強制更新 ---
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js?v=6').then((reg) => {
          reg.update();
        }).catch(err => console.log('SW registration failed:', err));
      });
    }

    // キャッシュクリア＆強制リロード関数
    window.forceClearCacheAndReload = async function() {
      if ('caches' in window) {
        const keys = await caches.keys();
        await Promise.all(keys.map(k => caches.delete(k)));
      }
      if ('serviceWorker' in navigator) {
        const registrations = await navigator.serviceWorker.getRegistrations();
        for (let r of registrations) { await r.unregister(); }
      }
      window.location.reload(true);
    };

    const STORAGE_KEY = 'navisystem_courses';
    const PROXIMITY_THRESHOLD_METERS = 100;

    let currentCourse = null;
    let currentTargetItem = null;
    let lastArrivedCoords = null;
    let map = null;
    let markers = [];
    let currentRouteLayer = null;

    let userCarMarker = null;
    let currentUserCoords = null;
    let shouldCenterOnUser = true;

    let isGpsRecording = false;
    let gpsWatchId = null;
    let recordedLogs = [];
    let currentLegLogs = [];
    let gpsPolyline = null;

    // --- コースデータ取得 ---
    function getCourses() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) return JSON.parse(raw);
      } catch (e) {}

      return [
        {
          id: 'sample_today',
          name: '本日 奈良エリア午前配達便 (サンプル)',
          memo: '担当: ドライバーA / ルート001',
          createdAt: new Date().toISOString(),
          items: [
            { id: 1, order: 1, name: "田中 太郎", address: "奈良県奈良市登大路町30", time: "午前中", memo: "置き配可（玄関前）", lat: 34.685062, lng: 135.832809, isDone: false },
            { id: 2, order: 2, name: "高橋 四郎", address: "奈良県奈良市三条栄町", time: "指定なし", memo: "道幅狭小注意", lat: 34.680706, lng: 135.808823, isDone: false },
            { id: 3, order: 3, name: "佐藤 次郎", address: "奈良県生駒市北新町10-38", time: "14:00-16:00", memo: "オートロック暗証1234", lat: 34.694481, lng: 135.697067, isDone: false },
            { id: 4, order: 4, name: "鈴木 三郎", address: "奈良県大和高田市大中100", time: "18:00-20:00", memo: "不在時宅配BOX", lat: 34.515060, lng: 135.737167, isDone: false }
          ]
        }
      ];
    }

    function saveCourses(courses) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(courses));
    }

    function refreshCourses() {
      const courses = getCourses();
      const container = document.getElementById('courseCardsContainer');
      if (!container) return;
      container.innerHTML = '';

      if (!courses || courses.length === 0) {
        container.innerHTML = `
          <div style="text-align:center; color:#94a3b8; margin-top:40px;">
            📦 本日の配達コースはまだありません。<br>
            <span style="font-size:12px;">PC管理画面からCSVを取り込んでコースを作成してください。</span>
          </div>
        `;
        return;
      }

      courses.forEach(course => {
        const doneCount = course.items.filter(i => i.isDone).length;
        const totalCount = course.items.length;
        const remainingCount = totalCount - doneCount;
        const percent = totalCount > 0 ? Math.round((doneCount / totalCount) * 100) : 0;
        const isAllDone = (doneCount === totalCount && totalCount > 0);

        const card = document.createElement('div');
        card.className = 'course-card-mobile';
        card.innerHTML = `
          <div style="display:flex; justify-content:space-between; align-items:flex-start;">
            <div class="course-title-mobile">${course.name}</div>
            <button class="btn btn-slate" style="padding:3px 8px; font-size:11px; color:#94a3b8;" onclick="resetCourseStatus('${course.id}', event)">
              🔄 リセット
            </button>
          </div>
          <div class="course-desc-mobile">${course.memo || 'ルート配送'}</div>
          <div class="course-stats">
            <span>件数: <b>${totalCount}件</b></span>
            <span style="color:${isAllDone ? '#4ade80' : '#38bdf8'}; font-weight:800;">
              進捗: ${doneCount}/${totalCount} (${percent}%)
            </span>
          </div>
          <button class="btn ${isAllDone ? 'btn-green' : 'btn-blue'}" style="width:100%; font-size:15px; padding:13px;" onclick="startDeliveryWorkflow('${course.id}')">
            ${isAllDone ? '✅ 配達完了済（確認・再配送）' : `🚚 配送を開始する（残り ${remainingCount}件）`}
          </button>
        `;
        container.appendChild(card);
      });
    }

    window.resetCourseStatus = function(courseId, event) {
      if (event) event.stopPropagation();
      if (!confirm("このコースの配達完了状況をリセットして最初から配送しますか？")) return;
      const courses = getCourses();
      const target = courses.find(c => c.id === courseId);
      if (target) {
        target.items.forEach(i => i.isDone = false);
        saveCourses(courses);
        refreshCourses();
        alert("✅ 配達状況をリセットしました！");
      }
    };

    // --- 1. 配送開始（コース起動） ---
    window.startDeliveryWorkflow = function(courseId) {
      try {
        const courses = getCourses();
        currentCourse = courses.find(c => c.id === courseId);
        if (!currentCourse) return alert("コースが見つかりません");

        currentCourse.items.sort((a, b) => (a.order || a.id) - (b.order || b.id));

        document.getElementById('view-course-select').style.display = 'none';
        document.getElementById('view-nav-main').style.display = 'flex';

        initMap();
        startContinuousGpsTracking();
        promptNextDestinationSelection(true);
      } catch (err) {
        console.error("startDeliveryWorkflow error:", err);
        alert("開始中にエラーが発生しました: " + err.message);
      }
    };

    window.exitToCourseSelect = function() {
      stopGpsTracking();
      document.getElementById('view-nav-main').style.display = 'none';
      document.getElementById('view-course-select').style.display = 'flex';
      refreshCourses();
    };

    // --- 2. 次の行き先を選択するプロンプト表示 ---
    function promptNextDestinationSelection(isFirst = false) {
      updateNavStats();
      const undoneItems = currentCourse.items.filter(i => !i.isDone);
      const modalCard = document.getElementById('modalCardBody');

      if (undoneItems.length === 0) {
        document.getElementById('transit-target-card').style.display = 'none';
        document.getElementById('select-next-modal').style.display = 'flex';
        modalCard.innerHTML = `
          <div class="modal-headline" style="color:#4ade80;">🎉 全件配達完了</div>
          <div class="modal-target-title" style="color:#4ade80; font-size:19px;">本日の配達はすべて完了しています</div>
          <div class="modal-target-addr">配達データは保持されています。一覧から選んで再配送や確認が可能です。</div>
          <button class="btn btn-blue" style="width:100%; font-size:14px; padding:12px; margin-bottom:8px;" onclick="openAllDestinationsModal()">
            📋 配送先一覧から選んで再度向かう
          </button>
          <button class="btn btn-slate" style="width:100%; font-size:13px; padding:10px;" onclick="resetCurrentCourseAndRestart()">
            🔄 全件を未配達にリセットして再配送
          </button>
        `;
        plotMarkers();
        return;
      }

      const nextDefault = undoneItems[0];
      modalCard.innerHTML = `
        <div class="modal-headline">${isFirst ? "【1件目の配送先を選択】" : "【次の配送先を選択】"}</div>
        <div class="modal-target-title">#${nextDefault.order || nextDefault.id} ${nextDefault.name} 様</div>
        <div class="modal-target-addr">${nextDefault.address}</div>
        <button class="btn btn-blue" style="width:100%; font-size:15px; padding:14px; margin-bottom:10px;" onclick="chooseNextSequentialTarget()">
          🚚 この順番通りに出発する
        </button>
        <button class="btn btn-slate" style="width:100%; font-size:14px; padding:12px;" onclick="openAllDestinationsModal()">
          📋 別の配送先を一覧から選ぶ
        </button>
      `;

      document.getElementById('select-next-modal').style.display = 'flex';
      document.getElementById('transit-target-card').style.display = 'none';
      plotMarkers();
    }

    window.resetCurrentCourseAndRestart = function() {
      if (!confirm("すべての配達先を未配達に戻して最初からやり直しますか？")) return;
      currentCourse.items.forEach(i => i.isDone = false);
      const courses = getCourses();
      const idx = courses.findIndex(c => c.id === currentCourse.id);
      if (idx !== -1) {
        courses[idx] = currentCourse;
        saveCourses(courses);
      }
      promptNextDestinationSelection(true);
    };

    window.chooseNextSequentialTarget = function() {
      const undoneItems = currentCourse.items.filter(i => !i.isDone);
      if (undoneItems.length === 0) return;
      setTargetAndBeginTransit(undoneItems[0]);
    };

    window.openAllDestinationsModal = function() {
      document.getElementById('select-next-modal').style.display = 'none';
      const container = document.getElementById('destListContainer');
      container.innerHTML = '';

      currentCourse.items.forEach(item => {
        const card = document.createElement('div');
        card.className = `dest-select-card ${item.isDone ? 'completed' : ''}`;
        card.innerHTML = `
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <b style="font-size:15px; font-weight:800;">#${item.order || item.id} ${item.name} 様</b>
            <span style="font-size:11px; padding:2px 8px; border-radius:10px; font-weight:700; background:${item.isDone ? '#10b981' : '#2563eb'}; color:#fff;">
              ${item.isDone ? '✅ 配達済' : '未配達'}
            </span>
          </div>
          <div style="font-size:12px; color:#94a3b8; margin:4px 0;">${item.address}</div>
          ${item.memo ? `<div style="font-size:11px; color:#fbbf24;">📝 ${item.memo}</div>` : ''}
          <div style="display:flex; gap:6px; margin-top:10px;">
            <button class="btn btn-blue" style="flex:1; padding:8px; font-size:12px;" onclick="event.stopPropagation(); setTargetAndBeginTransitDirect(${item.id})">
              🚚 ここへ向かう
            </button>
            <button class="btn btn-slate" style="padding:8px 12px; font-size:11px;" onclick="event.stopPropagation(); toggleItemDoneState(${item.id})">
              ${item.isDone ? '↩ 未完に戻す' : '✅ 完了にする'}
            </button>
          </div>
        `;
        card.onclick = () => {
          document.getElementById('all-destinations-modal').style.display = 'none';
          setTargetAndBeginTransit(item);
        };
        container.appendChild(card);
      });

      document.getElementById('all-destinations-modal').style.display = 'flex';
    };

    window.toggleItemDoneState = function(itemId) {
      const item = currentCourse.items.find(i => i.id === itemId);
      if (item) {
        item.isDone = !item.isDone;
        const courses = getCourses();
        const idx = courses.findIndex(c => c.id === currentCourse.id);
        if (idx !== -1) {
          courses[idx] = currentCourse;
          saveCourses(courses);
        }
        openAllDestinationsModal();
        plotMarkers();
        updateNavStats();
      }
    };

    window.closeAllDestinationsModal = function() {
      document.getElementById('all-destinations-modal').style.display = 'none';
      if (!currentTargetItem) {
        document.getElementById('select-next-modal').style.display = 'flex';
      }
    };

    window.openChangeDestinationModal = function() {
      openAllDestinationsModal();
    };

    // --- 3. 配送先を確定して移動・ナビ開始 ---
    window.setTargetAndBeginTransit = function(item) {
      currentTargetItem = item;
      document.getElementById('select-next-modal').style.display = 'none';
      document.getElementById('all-destinations-modal').style.display = 'none';
      document.getElementById('transit-target-card').style.display = 'block';

      document.getElementById('transitOrderNum').innerText = item.order || item.id;
      document.getElementById('transitName').innerText = `${item.name} 様`;
      document.getElementById('transitAddress').innerText = item.address;

      const memoBox = document.getElementById('transitMemoBox');
      if (item.memo) {
        memoBox.style.display = 'block';
        document.getElementById('transitMemoText').innerText = item.memo;
      } else {
        memoBox.style.display = 'none';
      }

      currentLegLogs = [];
      plotMarkers();

      checkProximityToTarget();
      calculateTransitRoute(item);
    };

    function checkProximityToTarget() {
      if (!currentTargetItem) return;

      const distTextEl = document.getElementById('distanceText');
      const badgeEl = document.getElementById('proximityStatusBadge');
      const arrivalBtn = document.getElementById('mainArrivalButton');

      let distMeters = null;
      if (currentUserCoords) {
        distMeters = map.distance([currentUserCoords.lat, currentUserCoords.lng], [currentTargetItem.lat, currentTargetItem.lng]);
      }

      if (distMeters !== null) {
        if (distMeters < 1000) {
          distTextEl.innerText = `${Math.round(distMeters)} m`;
        } else {
          distTextEl.innerText = `${(distMeters / 1000).toFixed(1)} km`;
        }

        if (distMeters <= PROXIMITY_THRESHOLD_METERS) {
          badgeEl.innerText = "🎯 目的地付近！";
          badgeEl.style.color = "#4ade80";
          arrivalBtn.classList.add('near-pulse');
        } else {
          badgeEl.innerText = "案内中";
          badgeEl.style.color = "#94a3b8";
          arrivalBtn.classList.remove('near-pulse');
        }
      } else {
        distTextEl.innerText = "測位中...";
        badgeEl.innerText = "GPS接続中";
      }
    }

    async function calculateTransitRoute(targetItem) {
      if (currentUserCoords) {
        drawRouteLine(currentUserCoords.lng, currentUserCoords.lat, targetItem.lng, targetItem.lat);
      } else {
        navigator.geolocation.getCurrentPosition(async (pos) => {
          const fromLng = pos.coords.longitude;
          const fromLat = pos.coords.latitude;
          drawRouteLine(fromLng, fromLat, targetItem.lng, targetItem.lat);
        }, () => {
          if (lastArrivedCoords) {
            drawRouteLine(lastArrivedCoords.lng, lastArrivedCoords.lat, targetItem.lng, targetItem.lat);
          } else {
            map.setView([targetItem.lat, targetItem.lng], 16);
          }
        });
      }
    }

    // --- マップ初期化 (国土地理院 標準地図) ---
    function initMap() {
      if (!map) {
        map = L.map('map', { zoomControl: false }).setView([34.685062, 135.832809], 16);

        L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/std/{z}/{x}/{y}.png', {
          maxZoom: 18,
          attribution: '© <a href="https://maps.gsi.go.jp/development/ichiran.html" target="_blank">国土地理院</a>'
        }).addTo(map);

        L.control.zoom({ position: 'topright' }).addTo(map);

        map.on('dragstart', () => {
          shouldCenterOnUser = false;
        });
      }

      setTimeout(() => map.invalidateSize(), 50);
      setTimeout(() => map.invalidateSize(), 200);
      setTimeout(() => map.invalidateSize(), 500);
    }

    window.centerOnUserLocation = function() {
      if (currentUserCoords && map) {
        shouldCenterOnUser = true;
        map.setView([currentUserCoords.lat, currentUserCoords.lng], 17);
      } else {
        alert("GPS測位中です。少々お待ちください。");
      }
    };

    function updateCarMarker(lat, lng) {
      const isFirstFix = !currentUserCoords;
      currentUserCoords = { lat, lng };
      if (!map) return;

      if (!userCarMarker) {
        const carHtml = `
          <div class="car-marker-container">
            <div class="car-pulse"></div>
            <div class="car-icon-body">🚚</div>
          </div>
        `;
        const carIcon = L.divIcon({
          html: carHtml,
          className: 'custom-car-icon',
          iconSize: [42, 42],
          iconAnchor: [21, 21]
        });
        userCarMarker = L.marker([lat, lng], { icon: carIcon, zIndexOffset: 1000 }).addTo(map);
      } else {
        userCarMarker.setLatLng([lat, lng]);
      }

      if (shouldCenterOnUser || isFirstFix) {
        map.setView([lat, lng], 16);
      }

      checkProximityToTarget();
    }

    async function drawRouteLine(lng1, lat1, lng2, lat2) {
      const url = `https://router.project-osrm.org/route/v1/driving/${lng1},${lat1};${lng2},${lat2}?overview=full&geometries=geojson`;
      try {
        const res = await fetch(url);
        const data = await res.json();
        if (data.routes && data.routes.length > 0) {
          if (currentRouteLayer) map.removeLayer(currentRouteLayer);
          currentRouteLayer = L.geoJSON(data.routes[0].geometry, {
            style: { color: '#1d4ed8', weight: 7, opacity: 0.95 } // 濃い青色
          }).addTo(map);
          map.setView([lat1, lng1], 16);
        }
      } catch (e) {
        map.setView([lat1, lng1], 16);
      }
    }

    // --- 到着ボタン押下 ---
    window.onArrivalClick = function() {
      if (!currentTargetItem) return;

      currentTargetItem.isDone = true;
      lastArrivedCoords = { lat: currentTargetItem.lat, lng: currentTargetItem.lng };

      const courses = getCourses();
      const idx = courses.findIndex(c => c.id === currentCourse.id);
      if (idx !== -1) {
        courses[idx] = currentCourse;
        saveCourses(courses);
      }

      // クラウドへ配達完了を同期
      if (window.updateItemStatusToCloud && currentCourse) {
        updateItemStatusToCloud(currentCourse.id, currentTargetItem.id, true);
      }

      if (currentRouteLayer) {
        map.removeLayer(currentRouteLayer);
        currentRouteLayer = null;
      }

      alert(`✅ #${currentTargetItem.order || currentTargetItem.id} ${currentTargetItem.name} 様への配達が完了しました！`);
      currentTargetItem = null;

      promptNextDestinationSelection(false);
    };

    window.openExternalGoogleMap = function() {
      if (!currentTargetItem) return;
      window.open(`https://www.google.com/maps/dir/?api=1&destination=${currentTargetItem.lat},${currentTargetItem.lng}`);
    };

    function updateNavStats() {
      const doneCount = currentCourse.items.filter(i => i.isDone).length;
      const totalCount = currentCourse.items.length;
      document.getElementById('navDeliveredCount').innerText = doneCount;
      document.getElementById('navTotalCount').innerText = totalCount;
    }

    function plotMarkers() {
      if (!map || !currentCourse) return;
      markers.forEach(m => map.removeLayer(m));
      markers = [];

      currentCourse.items.forEach((item) => {
        const isTarget = currentTargetItem && currentTargetItem.id === item.id;

        const marker = L.circleMarker([item.lat, item.lng], {
          radius: isTarget ? 14 : 9,
          fillColor: item.isDone ? "#10b981" : (isTarget ? "#f59e0b" : "#1d4ed8"),
          color: "#ffffff",
          weight: isTarget ? 3 : 2,
          fillOpacity: 1
        }).addTo(map);

        marker.bindPopup(`
          <div style="min-width:170px; font-size:12px; font-family:'Noto Sans JP',sans-serif;">
            <b style="font-size:14px;">#${item.order || item.id} ${item.name} 様</b><br>
            <span style="color:#64748b;">${item.address}</span><br>
            ${item.memo ? `<span style="color:#fbbf24;">📝 ${item.memo}</span><br>` : ''}
            <div style="margin-top:8px;">
              <button class="btn btn-blue" style="width:100%; padding:6px; font-size:11px;" onclick="setTargetAndBeginTransitDirect(${item.id})">
                🚚 ここへ向かう
              </button>
            </div>
          </div>
        `);

        markers.push(marker);
      });
    }

    window.setTargetAndBeginTransitDirect = function(id) {
      const item = currentCourse.items.find(i => i.id === id);
      if (item) {
        map.closePopup();
        setTargetAndBeginTransit(item);
      }
    };

    // --- GPS追従 & クラウド自動送信 ---
    let lastCloudUploadTime = 0;

    function startContinuousGpsTracking() {
      if (!navigator.geolocation) return;
      isGpsRecording = true;
      recordedLogs = [];

      if (gpsPolyline) map.removeLayer(gpsPolyline);
      gpsPolyline = L.polyline([], { color: '#ef4444', weight: 4 }).addTo(map);

      gpsWatchId = navigator.geolocation.watchPosition((pos) => {
        const pt = { lat: pos.coords.latitude, lng: pos.coords.longitude, time: pos.timestamp };
        recordedLogs.push(pt);
        currentLegLogs.push(pt);
        gpsPolyline.addLatLng([pt.lat, pt.lng]);
        document.getElementById('gpsPointCount').innerText = recordedLogs.length;

        updateCarMarker(pt.lat, pt.lng);

        // クラウドへ位置情報 & 走行ログを自動送信（3秒間隔）
        const now = Date.now();
        if (now - lastCloudUploadTime > 3000) {
          lastCloudUploadTime = now;
          if (window.updateDriverLocationToCloud) {
            updateDriverLocationToCloud('driver_main', {
              name: '担当ドライバー',
              courseId: currentCourse ? currentCourse.id : null,
              lat: pt.lat,
              lng: pt.lng
            });
          }
          if (window.appendGpsLogToCloud && currentCourse) {
            appendGpsLogToCloud(currentCourse.id, pt);
          }
        }
      }, (err) => {
        console.warn("GPS error:", err);
      }, { enableHighAccuracy: true, maximumAge: 2000, timeout: 10000 });
    }

    function stopGpsTracking() {
      if (gpsWatchId) navigator.geolocation.clearWatch(gpsWatchId);
      isGpsRecording = false;
    }

    // 初期化 & クラウドコース購読
    function initDriverApp() {
      refreshCourses();
      if (window.subscribeCoursesFromCloud) {
        subscribeCoursesFromCloud((cloudCourses) => {
          if (cloudCourses && cloudCourses.length > 0) {
            saveCourses(cloudCourses);
            if (!currentCourse) {
              refreshCourses();
            }
          }
        });
      }
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initDriverApp);
    } else {
      initDriverApp();
    }
  </script>
</body>
</html>
